# HNU 错题本 - 题库自主更新 Worker 配置
# 部署前需：
#   1. 创建 KV 命名空间：wrangler kv namespace create WQ_BANK_KV
#   2. 将返回的 id 填入下方 kv_namespaces.id
#   3. 部署：wrangler deploy

name = "hnu-wq-bank-updater"
main = "worker.js"
compatibility_date = "2024-09-01"

# Cron 触发器：每 2 小时执行一次
[triggers]
crons = ["0 */2 * * *"]

# KV 命名空间绑定（需先创建并填入 id）
[[kv_namespaces]]
binding = "WQ_BANK_KV"
id = "5416e48878264be68ef3abe3095c7e55"

# Cloudflare Workers AI（内网调用，避免跨境超时）
[ai]
binding = "AI"

# 路由（可选）：绑定到自定义域名或 workers.dev 子域
# routes = ["hnu-wq-bank-updater.<your-subdomain>.workers.dev/*"]

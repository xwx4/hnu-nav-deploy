        }

        function startNavigation() { return routePipeline("select"); }

        function routePipeline(source) {
            var startSel = document.getElementById("startSelect");
            var destSel = document.getElementById("destSelect");
            var startName = startSel.value, destName = destSel.value;
            if (!startName || !destName) { highlightMarkers(); return; }
            if (startName === destName) {
                showRouteInfo('<div class="rt-warn">⚠️ 起点和终点不能是同一个位置！</div>');
                clearRouteCanvas();
                lastAlts = null; currentRoute = null;
                highlightMarkers();
                return;
            }
            // ---- 1. 端点解析（本层房间 / 其他楼层 f:前缀 / 校园室外 o:前缀） ----
            var sEp = resolveEndpoint(startName);
            var dEp = resolveEndpoint(destName);
            if (!sEp || !dEp) {
                var miss = !sEp ? startName : destName;
                Track.log("route_result", { ok: false, kind: "indoor", reason: "missing:" + miss });   // S5.3
                Toast.error("「" + miss + "」还没有实测坐标，暂时无法导航。");
                showRouteInfo('<div class="rt-warn">⚠️ 「' + miss + '」坐标缺失，待实测后开放导航。</div>');
                clearRouteCanvas(); lastAlts = null; currentRoute = null;
                return;
            }
            // ---- 2. S4 分派：任一端为室外 → 统一导航引擎（室内外一体化 / 跨楼） ----
            //    楼层解锁校验只约束纯楼内流程，统一导航不受当前层锁定影响
            Track.log("funnel", { stage: "route" });   // S5.3 漏斗：进入路线规划
            if (sEp.kind === "outdoor" || dEp.kind === "outdoor") {
                uniAbort();
                planUnified(sEp, dEp);
                return;
            }
            // ---- 3. 纯楼内流程：要求已解锁楼层；新路线开始前清统一导航状态 ----
            if (!isFloorReady() && !(typeof PlanBuildings !== "undefined" && PlanBuildings.active())) {
                Toast.error("请先在上方选择并解锁一个楼层。");
                return;
            }
            if (uniRoute) uniAbort();
            var bldName = (currentIndoorBld && currentIndoorBld.name) || "综合楼";
            var alts = (typeof PlanBuildings !== "undefined" && PlanBuildings.active())
                ? PlanBuildings.alternatives({ floor: sEp.floor, node: sEp.node },
                                             { floor: dEp.floor, node: dEp.node },
                                             { strategy: navStrategy, curFloor: currentFloor })
                : IndoorRouter.alternatives(bldName,
                { floor: sEp.floor, node: sEp.node },
                { floor: dEp.floor, node: dEp.node },
                { strategy: navStrategy, curFloor: currentFloor });
            if (alts.error) {
                var why = alts.error === "missing_start" ? sEp.node :
                          alts.error === "missing_goal" ? dEp.node : null;
                var msg = why ? ("「" + why + "」还没有实测坐标，暂时无法导航。")
                              : (alts.error === "same" ? "起点和终点不能是同一个位置！"
                                                       : "这两点之间暂无可用通路。");
                Track.log("route_result", { ok: false, kind: "indoor", reason: String(alts.error) });   // S5.3
                Toast.error(msg);
                showRouteInfo('<div class="rt-warn">⚠️ ' + msg + '</div>');
                clearRouteCanvas(); lastAlts = null; currentRoute = null;
                return;
            }
            Track.log("route_result", { ok: true, kind: "indoor",
                                        from: sEp.node, to: dEp.node,
                                        meters: alts[0] ? Math.round(alts[0].meters || 0) : null });   // S5.3
            lastAlts = alts;
            currentScheme = 0;
            currentRoute = { start: sEp.node, dest: dEp.node };   // 兼容缩放重绘与标记高亮（存纯节点名，不带 f: 前缀）
            // ---- 4/5. 画布分层重绘 + 指示层 ----
            redrawRoute();
            renderRouteUI();
        }

        // 节点在整楼内的楼层号；找不到返回 null（调用方据此给出明确提示）。
        // 门厅/电梯厅等多层同名节点优先取当前层（起点随所在层走）。
        function floorOfNode(name) {
            if ((floorCoordinates[currentFloor] || {})[name]) return currentFloor;
            for (var fl in floorCoordinates) {
                if (floorCoordinates[fl][name]) return fl;
            }
            return null;
        }

        function clearRouteCanvas() {
            var old = document.getElementById("routeCanvas");
            if (old) old.remove();
            var guide = document.getElementById("layerGuide");
            if (guide) guide.innerHTML = "";
        }

        /* ---------------- S2.3 行进流动动画：虚线 offset 逐帧推进 ---------------- */
        var routeFlow = { offset: 0, raf: 0, frames: 0, sumDt: 0 };
        /* ---------------- S3.4 动效与性能 ----------------
         * PERF.low：低端机自动降级（关发光/流动）；实测流动掉帧时自适应再降。
         * fxOff()：用户动效开关（localStorage 持久化），叠加 prefers-reduced-motion。 */
        var PERF = { low: false };
        try {
            var _dm = navigator.deviceMemory || 8, _hc = navigator.hardwareConcurrency || 8;
            PERF.low = (_dm <= 2 || _hc <= 3);
        } catch (e) { /* 检测失败按高端机处理 */ }
        if (PERF.low) document.body.classList.add("low-perf");
        var FX_KEY = "hnuMotionOff";
        function fxOff() {
            try { return localStorage.getItem(FX_KEY) === "1"; } catch (e) { return false; }
        }
        function applyFx() {
            document.body.classList.toggle("no-motion", fxOff());
            var b = document.getElementById("fxBtn");
            if (b) b.classList.toggle("off", fxOff());
        }
        function toggleFx() {
            try { localStorage.setItem(FX_KEY, fxOff() ? "0" : "1"); } catch (e) {}
            applyFx();
            if (fxOff() && routeFlow.raf) { cancelAnimationFrame(routeFlow.raf); routeFlow.raf = 0; }
            showToast(fxOff() ? "动效已关闭（省电模式）" : "动效已开启");
        }
        function motionOK() {
            if (fxOff()) return false;
            return !(window.matchMedia && window.matchMedia("(prefers-reduced-motion: reduce)").matches);
        }
        function startRouteFlow() {
            if (routeFlow.raf || !motionOK() || PERF.low) return;
            routeFlow.frames = 0; routeFlow.sumDt = 0;
            var last = 0;
            var tick = function (ts) {
                routeFlow.raf = 0;
                if (!currentRoute || !document.getElementById("routeCanvas")) return;  // 路线没了即停
                if (!document.body.classList.contains("indoor")) return;               // 离开楼内即停
                var dt = last ? Math.min(50, ts - last) : 16; last = ts;
                routeFlow.frames++; routeFlow.sumDt += dt;
                // 低端机自适应降级：流动动画实测掉帧 → 关发光与流动，保静态路线不消失
                if (routeFlow.frames >= 110 && routeFlow.sumDt / routeFlow.frames > 26) {
                    PERF.low = true;
                    document.body.classList.add("low-perf");
                    redrawRoute();
                    return;
                }
                routeFlow.offset -= dt * 0.045;   // ≈45 画布px/秒 的行进流动
                redrawRoute(true);
                routeFlow.raf = requestAnimationFrame(tick);
            };
            routeFlow.raf = requestAnimationFrame(tick);
        }

        /* arcTo 圆角折线：半径按相邻边长钳制，贴走廊中轴线的拐角自然圆滑 */
        function traceSmoothPath(ctx, pts, toX, toY, radius) {
            ctx.moveTo(toX(pts[0].x), toY(pts[0].y));
            for (var i = 1; i < pts.length - 1; i++) {
                var px = toX(pts[i].x), py = toY(pts[i].y);
                var nx = toX(pts[i + 1].x), ny = toY(pts[i + 1].y);
                var bx = toX(pts[i - 1].x), by = toY(pts[i - 1].y);
                var l1 = Math.hypot(px - bx, py - by), l2 = Math.hypot(nx - px, ny - py);
                var r = Math.max(0, Math.min(radius, l1 / 2.2, l2 / 2.2));
                if (r > 0.5) ctx.arcTo(px, py, nx, ny, r);
                else ctx.lineTo(px, py);
            }
            ctx.lineTo(toX(pts[pts.length - 1].x), toY(pts[pts.length - 1].y));
        }
        /* 沿折线等距撒方向箭头（白色小雪佛龙），指示行进方向 */
        function drawChevrons(ctx, pts, toX, toY, zf) {
            var step = 46 / zf, first = 26 / zf, size = 5.5 / zf;
            var acc = 0;
            for (var i = 1; i < pts.length; i++) {
                var x0 = toX(pts[i - 1].x), y0 = toY(pts[i - 1].y);
                var x1 = toX(pts[i].x), y1 = toY(pts[i].y);
                var len = Math.hypot(x1 - x0, y1 - y0);
                if (len < 1) continue;
                var ux = (x1 - x0) / len, uy = (y1 - y0) / len;
                var d = (i === 1) ? first : (step - (acc % step));
                while (d < len) {
                    var cx = x0 + ux * d, cy = y0 + uy * d;
                    ctx.beginPath();
                    ctx.moveTo(cx - uy * size - ux * size * 0.6, cy + ux * size - uy * size * 0.6);
                    ctx.lineTo(cx + ux * size, cy + uy * size);
                    ctx.lineTo(cx + uy * size - ux * size * 0.6, cy - ux * size - uy * size * 0.6);
                    ctx.stroke();
                    d += step;
                }
                acc += len;
            }
        }
        /* 起终点渐变圆标：径向渐变 + 白描边 + 外发光 */
        function drawEndpoint(ctx, x, y, zf, kind) {
            var R = 10 / zf;
            var g = ctx.createRadialGradient(x - R * 0.3, y - R * 0.35, R * 0.15, x, y, R);
            if (kind === "start") { g.addColorStop(0, "#4ade80"); g.addColorStop(1, "#15803d"); }
            else { g.addColorStop(0, "#fca5a5"); g.addColorStop(1, "#b91c1c"); }
            ctx.save();
            ctx.shadowColor = kind === "start" ? "rgba(34,197,94,.6)" : "rgba(239,68,68,.6)";
            ctx.shadowBlur = 10 / zf;
            ctx.beginPath(); ctx.arc(x, y, R, 0, 2 * Math.PI);
            ctx.fillStyle = g; ctx.fill();
            ctx.shadowBlur = 0;
            ctx.lineWidth = 2.5 / zf; ctx.strokeStyle = "#fff"; ctx.stroke();
            ctx.fillStyle = "#fff";
            ctx.beginPath(); ctx.arc(x, y, 3 / zf, 0, 2 * Math.PI); ctx.fill();
            ctx.restore();
        }

        /* S3.2 路线面板 = 统一手势 Sheet：注入拖拽把手；隐藏状态下重开回到 full 档 */
        function showRouteInfo(html) {
            var box = document.getElementById("routeInfo");
            var wasHidden = box.style.display !== "block";
            box.style.display = "block";
            if (wasHidden) {
                box.classList.remove("peek");
                var pill = document.getElementById("routePeek");
                if (pill) pill.classList.remove("show");
            }
            box.innerHTML = '<div class="sheet-grip" aria-hidden="true"></div>' + html;
        }
        /* 收起路线面板（路线仍画在图上，留浮标可再次展开） */
        function hideRoutePanel(keepPill) {
            var box = document.getElementById("routeInfo");
            box.style.display = "none";
            box.classList.remove("peek");
            var pill = document.getElementById("routePeek");
            if (pill) pill.classList.toggle("show", !!(keepPill && currentRoute));
        }

        /* 指示层：策略 chips + 方案 chips + 总览 + 逐段指引（当前层段高亮） */
        var STRATEGY_LABELS = [
            ["distance", "距离优先"], ["time", "最快到达"],
            ["accessible", "无障碍"], ["transfers", "少换乘"]
        ];
        function renderRouteUI() {
            if (!lastAlts || lastAlts.error) return;
            var alt = lastAlts[currentScheme] || lastAlts[0];
            var chips = '<div class="rt-chips" role="group" aria-label="权重策略">';
            STRATEGY_LABELS.forEach(function (s) {
                chips += '<button type="button" class="rt-chip' + (navStrategy === s[0] ? ' on' : '') +
                    '" data-strategy="' + s[0] + '" aria-pressed="' + (navStrategy === s[0]) + '">' + s[1] + '</button>';
            });
            chips += '</div>';
            if (lastAlts.length > 1) {
                chips += '<div class="rt-chips" role="group" aria-label="备选方案">';
                for (var i = 0; i < lastAlts.length; i++) {
                    chips += '<button type="button" class="rt-chip alt' + (i === currentScheme ? ' on' : '') +
                        '" data-scheme="' + i + '" aria-pressed="' + (i === currentScheme) + '">方案' + (i + 1) + '</button>';
                }
                chips += '</div>';
            }
            /* S4：统一导航段内显示"第 X/N 段"，纯楼内保持原"全程"文案 */
            var head = '<div class="rt-head">' +
                (uniRoute ? "🧭 统一导航 · 第 " + (uniRoute.idx + 1) + "/" + uniRoute.legs.length + " 段 · " : "🚶 全程 ") +
                (alt.meters >= 100 ? Math.round(alt.meters) : alt.meters.toFixed(1)) + ' 米 · 约 ' +
                (alt.sec >= 90 ? Math.round(alt.sec / 60) + ' 分钟' : Math.round(alt.sec) + ' 秒') + '</div>';
            /* S2.3 口播式"下一步"引导卡：当前层第一步（不在本层则取全程第一步），点击语音播报 */
            var nextStep = null;
            for (var si = 0; si < alt.steps.length; si++) {
                if (alt.steps[si].floor === currentFloor) { nextStep = alt.steps[si]; break; }
            }
            if (!nextStep && alt.steps.length) nextStep = alt.steps[0];
            var nextHtml = "";
            if (nextStep) {
                nextHtml = '<div class="rt-next" id="rtNext" role="button" tabindex="0" title="点击语音播报">' +
                    '<span class="rt-next-label">下一步</span>' +
                    '<span class="rt-next-text">' + nextStep.text + '</span>' +
                    '<span class="rt-next-speak" aria-hidden="true">🔊</span></div>';
            }
            var stepsHtml = '<ol class="rt-steps">';
            alt.steps.forEach(function (st) {
                var onThis = st.floor === currentFloor;
                stepsHtml += '<li class="' + (onThis ? 'cur' : '') + '">' +
                    (onThis ? '<b>本层</b> ' : '') + st.text + '</li>';
            });
            stepsHtml += '</ol>';
            if (uniRoute) {
                /* S4.3：室内无精确定位，出楼由用户到达门厅后确认（不假装自动推进） */
                if (uniRoute.legs[uniRoute.idx + 1]) {
                    stepsHtml += '<button type="button" class="rt-jump uni-exit" data-uni-exit="1">' +
                        '🚪 我已到门厅，继续室外导航 ›</button>';
                }
            } else {
                var destFloor = floorOfNode(currentRoute.dest);
                if (destFloor && destFloor !== currentFloor) {
                    stepsHtml += '<button type="button" class="rt-jump" data-jumpfloor="' + destFloor +
                        '">已到电梯？前往 ' + destFloor + ' 层继续 ›</button>';
                }

            showRouteInfo((uniRoute ? uniLegStripHTML() : "") + chips + head + nextHtml + stepsHtml);
            bindRouteUI();
        }

        function bindRouteUI() {
            var box = document.getElementById("routeInfo");
            box.querySelectorAll(".rt-chip[data-strategy]").forEach(function (btn) {
                btn.addEventListener("click", function () {
                    navStrategy = btn.getAttribute("data-strategy");
                    routePipeline("strategy");
                });
            });
            box.querySelectorAll(".rt-chip[data-scheme]").forEach(function (btn) {
                btn.addEventListener("click", function () {
                    currentScheme = Number(btn.getAttribute("data-scheme"));
                    redrawRoute();
                    renderRouteUI();
                });
            });
            box.querySelectorAll(".rt-jump[data-jumpfloor]").forEach(function (btn) {
                btn.addEventListener("click", function () {
                    jumpToFloor(btn.getAttribute("data-jumpfloor"));
                });
            });
            // 口播卡：点击用系统语音读出"下一步"指引
            var nx = box.querySelector("#rtNext");
            if (nx) nx.addEventListener("click", function () {
                var txt = nx.querySelector(".rt-next-text");
                if (!txt || !window.speechSynthesis) return;
                try {
                    window.speechSynthesis.cancel();
                    var u = new SpeechSynthesisUtterance(txt.textContent);
                    u.lang = "zh-CN"; u.rate = 1;
                    window.speechSynthesis.speak(u);
                } catch (e) { /* 无语音环境则静默 */ }
            });
            /* S4 统一导航：分段卡片点击跳视图 + 到达门厅后确认出楼 */
            bindUniLegStrip(box);
            var ux = box.querySelector("[data-uni-exit]");
            if (ux) ux.addEventListener("click", function () { uniAdvance(false); });
        }

        /* 跨楼层接续：切到目标层（走楼层锁流程），解锁后自动以电梯厅续航 */
        function jumpToFloor(floor) {
            if (String(floor) === String(currentFloor)) return;
            pendingAutoRoute = { dest: currentRoute ? currentRoute.dest : null };
            if (floorLockCtl && floorLockCtl.unlockFloor) floorLockCtl.unlockFloor(floor + "F", "route");
            else applyUnlockedFloor(floor + "F");
        }

        /* ---------------- 画布渲染（纯几何：缩放/切方案只重绘，不重算 A*） ----------------
         * S2.3 视觉升级：shadowBlur 外发光 / arcTo 转角圆角 / 流动虚线 /
         * 起终点渐变 + 方向箭头 / "下一步"段高亮。画布挂在路线层随图缩放旋转。 */
        function redrawRoute(skipMarkers) {
            var layer = document.getElementById("layerRoute");
            if (!layer) return;
            if (!lastAlts || lastAlts.error) { currentRoute = null; clearRouteCanvas(); return; }
            var alt = lastAlts[currentScheme] || lastAlts[0];
            var aw = layer.clientWidth || 0, ah = layer.clientHeight || 0;
            if (!aw || !ah) return;   // 图层还没布局好
            // 画布复用：流动动画 60fps 下不反复建删 DOM
            var canvas = document.getElementById("routeCanvas");
            if (!canvas) {
                canvas = document.createElement("canvas");
                canvas.id = "routeCanvas";
                layer.appendChild(canvas);
            }
            if (canvas.width !== aw || canvas.height !== ah) { canvas.width = aw; canvas.height = ah; }
            var ctx = canvas.getContext("2d");
            ctx.clearRect(0, 0, aw, ah);
            var guide = document.getElementById("layerGuide");
            if (guide) guide.innerHTML = "";
            var zf = mapState.scale || 1;
            var toX = function (x) { return x / REF_W * aw; };
            var toY = function (y) { return y / REF_H * ah; };
            var primary = THEME.cssVar("--primary", "#3b82f6");

            // 备选方案淡显（非当前方案的本层步行段）
            ctx.save();
            ctx.strokeStyle = THEME.cssVar("--text-tertiary", "#64748b");
            ctx.globalAlpha = 0.22;   /* S3.5 降低备选路线干扰，突出当前方案 */
            ctx.lineWidth = 3 / zf;
            ctx.lineCap = "round"; ctx.lineJoin = "round";
            ctx.setLineDash([5 / zf, 6 / zf]);
            lastAlts.forEach(function (a, ai) {
                if (ai === currentScheme) return;
                a.segments.forEach(function (seg) {
                    if (seg.kind !== "walk" || seg.floor !== currentFloor || seg.pts.length < 2) return;
                    ctx.beginPath();
                    traceSmoothPath(ctx, seg.pts, toX, toY, 8 / zf);
                    ctx.stroke();
                });
            });
            ctx.restore();

            // "下一步"段：当前层第一个步行段，做高亮（口播卡同步展示其文本）
            var floorData = floorCoordinates[currentFloor] || {};
            var nextSeg = null;
            for (var ni = 0; ni < alt.segments.length; ni++) {
                var nsg = alt.segments[ni];
                if (nsg.kind === "walk" && nsg.floor === currentFloor && nsg.pts.length >= 2) { nextSeg = nsg; break; }
            }

            // 当前方案：本层步行段（外发光 + 圆角实线 + 行进流动虚线 + 方向箭头）
            alt.segments.forEach(function (seg) {
                if (seg.kind !== "walk" || seg.floor !== currentFloor || seg.pts.length < 2) return;
                var isNext = (seg === nextSeg);
                ctx.save();
                ctx.lineCap = "round"; ctx.lineJoin = "round";
                // pass 1：外发光底层（S3.4 低端机降级：跳过 shadowBlur 重绘）
                if (!PERF.low) {
                    ctx.strokeStyle = isNext ? "rgba(56,189,248,.45)" : "rgba(59,130,246,.38)";
                    ctx.lineWidth = (isNext ? 15 : 13) / zf;
                    ctx.shadowColor = isNext ? "rgba(56,189,248,.95)" : "rgba(59,130,246,.75)";
                    ctx.shadowBlur = (isNext ? 20 : 16) / zf;
                    ctx.beginPath();
                    traceSmoothPath(ctx, seg.pts, toX, toY, 10 / zf);
                    ctx.stroke();
                }
                // pass 2：主线（下一步段用渐变提亮）
                ctx.shadowBlur = 0;
                if (isNext) {
                    var p0 = seg.pts[0], p1 = seg.pts[seg.pts.length - 1];
                    var grad = ctx.createLinearGradient(toX(p0.x), toY(p0.y), toX(p1.x), toY(p1.y));
                    grad.addColorStop(0, "#38bdf8"); grad.addColorStop(1, "#2563eb");
                    ctx.strokeStyle = grad;
                } else {
                    ctx.strokeStyle = primary;
                }
                ctx.lineWidth = (isNext ? 7.5 : 6.5) / zf;
                ctx.beginPath();
                traceSmoothPath(ctx, seg.pts, toX, toY, 10 / zf);
                ctx.stroke();
                // pass 3：行进流动虚线
                ctx.strokeStyle = "rgba(255,255,255,.95)";
                ctx.lineWidth = 2.4 / zf;
                ctx.setLineDash([9 / zf, 8 / zf]);
                ctx.lineDashOffset = routeFlow.offset / zf;
                ctx.beginPath();
                traceSmoothPath(ctx, seg.pts, toX, toY, 10 / zf);
                ctx.stroke();
                ctx.setLineDash([]);
                // pass 4：方向箭头（白色雪佛龙）
                ctx.strokeStyle = "rgba(255,255,255,.92)";
                ctx.lineWidth = 2.2 / zf;
                drawChevrons(ctx, seg.pts, toX, toY, zf);
                ctx.restore();
            });

            // 垂直交通：电梯厅位置琥珀色圆环（canvas）+ ↕目标层徽标（指示层 DOM）
            var vert = null;
            for (var vi = 0; vi < alt.segments.length; vi++) {
                var sg = alt.segments[vi];
                if (sg.kind !== "walk" && (sg.floor === currentFloor || sg.toFloor === currentFloor)) { vert = sg; break; }
            }
            if (vert && floorData["电梯厅"]) {
                var ex = toX(floorData["电梯厅"].x), ey = toY(floorData["电梯厅"].y);
                var other = vert.floor === currentFloor ? vert.toFloor : vert.floor;
                ctx.save();
                ctx.strokeStyle = "#f59e0b";
                ctx.lineWidth = 4 / zf;
                ctx.setLineDash([4 / zf, 3 / zf]);
                ctx.shadowColor = "rgba(245,158,11,.55)"; ctx.shadowBlur = 8 / zf;
                ctx.beginPath();
                ctx.arc(ex, ey, 12 / zf, 0, 2 * Math.PI);
                ctx.stroke();
                ctx.restore();
                if (guide) {
                    var badge = document.createElement("div");
                    badge.className = "elev-badge";
                    badge.style.left = (floorData["电梯厅"].x / REF_W * 100) + "%";
                    badge.style.top = (floorData["电梯厅"].y / REF_H * 100) + "%";
                    badge.textContent = "↕ " + other + "F";
                    guide.appendChild(badge);
                }
            }
            // 起终点渐变圆标（在本层才画：起点绿、终点红）
            if (currentRoute && floorData[currentRoute.start]) {
                drawEndpoint(ctx, toX(floorData[currentRoute.start].x), toY(floorData[currentRoute.start].y), zf, "start");
            }
            if (currentRoute && floorData[currentRoute.dest]) {
                drawEndpoint(ctx, toX(floorData[currentRoute.dest].x), toY(floorData[currentRoute.dest].y), zf, "dest");
            }
            if (skipMarkers) applyMarkerScale();   // 流动帧：只需让新建徽标吃到缩放补偿
            else { highlightMarkers(); startRouteFlow(); }   // 流动帧内不得再启动循环（否则 rAF 每帧翻倍卡死页面）
        }
        /* =====================================================================
         * 第一步 · 校园导航：高德地图室外导航 + 大楼「楼内立体导航」接口
         * ---------------------------------------------------------------------
         * · 室外导航：直接调起高德地图（官方 URI API，无需申请 Key）——
         *   手机优先唤起高德 App，桌面/未安装则打开网页版；定位、实时路线、
         *   语音导航与日常使用的高德地图完全一致。
         * · 楼内导航：BUILDINGS 中 indoor:true 的大楼开放「楼内立体导航」；
         *   未上线的大楼点击只提示"暂未完成"。目前仅综合楼（zonghe）已上线。
         * · 坐标：GCJ-02 火星坐标（与高德同坐标系，URI 参数 coordinate=gaode）。
         * 以后新增大楼：在 BUILDINGS 加一条；楼内导航做好后把 indoor 置为 true。
         * ===================================================================== */
var navMode = "walk";

// 把用户输入展开成一组搜索词：第 0 个是原始词（全权重），其余为同义/意图扩展词
        function expandSearchTerms(keyword) {
            var terms = [keyword];
            function addAll(list) {
                list.forEach(function(t) {
                    var tl = String(t).toLowerCase();
                    if (terms.indexOf(tl) < 0) terms.push(tl);
                });
            }
            SEARCH_SYNONYM_GROUPS.forEach(function(group) {
                var hit = false;
                group.forEach(function(t) {
                    if (hit) return;
                    var tl = t.toLowerCase();
                    if (tl === keyword || (tl.length > 1 && tl.indexOf(keyword) >= 0) || (keyword.length > 1 && keyword.indexOf(tl) >= 0)) hit = true;
                });
                if (hit) addAll(group);
            });
            SEARCH_INTENTS.forEach(function(it) {
                var hit = false;
                it.patterns.forEach(function(p) {
                    if (!hit && (keyword.indexOf(p) >= 0 || (p.length > 1 && p.indexOf(keyword) >= 0))) hit = true;
                });
                if (hit) addAll(it.terms);
            });
            return terms;
        }

        /* ========== 搜索功能 ========== */
        function searchAll(keyword) {
            keyword = (keyword || "").trim().toLowerCase();
            if (!keyword) return [];
            var terms = expandSearchTerms(keyword);
            var results = [];
            var seen = {};   // 去重：同一结果只保留最高分
            function push(key, item) {
                if (seen[key]) {
                    if (item.score > seen[key].score) {
                        results[results.indexOf(seen[key])] = item;
                        seen[key] = item;
                    }
                    return;
                }
                seen[key] = item;
                results.push(item);
            }
            terms.forEach(function(term, ti) {
                var factor = ti === 0 ? 1 : 0.75;   // 扩展词降权，保证精确输入排最前
                // 1. 楼栋匹配（权重100）
                BUILDINGS.forEach(function(b) {
                    var score = 0;
                    if (b.name.toLowerCase().indexOf(term) >= 0) score += 100;
                    if (b.alias && b.alias.toLowerCase().indexOf(term) >= 0) score += 80;
                    if (b.desc && b.desc.toLowerCase().indexOf(term) >= 0) score += 50;
                    if (score > 0) {
                        push("b:" + b.id, { type: "building", data: b, score: Math.round(score * factor),
                            display: { name: b.name, sub: b.cat + (b.desc ? " · " + b.desc : ""), icon: "🏢" } });
                    }
                });
                // 2. POI匹配（权重90）
                POI_DATA.forEach(function(poi) {
                    var score = 0;
                    if (poi.name.toLowerCase().indexOf(term) >= 0) score += 90;
                    if (poi.room && poi.room.toLowerCase().indexOf(term) >= 0) score += 85;
                    if (poi.keywords) {
                        poi.keywords.forEach(function(kw) {
                            if (kw.toLowerCase().indexOf(term) >= 0) score += 60;
                        });
                    }
                    if (score > 0) {
                        var bld = findBuildingByName(poi.building);
                        push("p:" + poi.name, { type: "poi", data: poi, score: Math.round(score * factor), bld: bld,
                            display: { name: poi.name, sub: poi.building + (poi.floor ? " · " + poi.floor + "F" : "") + (poi.room ? " · " + poi.room : ""), icon: poi.icon } });
                    }
                });
            });
            // 3. 房间匹配：支持前缀 / 子串 —— 输入"5"就能列出 501/502/…，输入"50"就能命中 501
            function pushRoom(bname, bld, floor, rk, pt, bid) {
                var score = 0, rkL = String(rk).toLowerCase();
                if (rkL === keyword) score = 98;
                else if (rkL.indexOf(keyword) === 0) score = 92;
                else if (rkL.indexOf(keyword) > 0) score = 72;
                if (score <= 0) return;
                push("r:" + bname + ":" + floor + ":" + rk, { type: "room",
                    data: { room: rk, floor: floor, building: bname, x: pt.x, y: pt.y, bid: bid || "" },
                    score: score, bld: bld,
                    display: { name: rk, sub: bname + " · " + floor + "F", icon: "🚪" } });
            }
            var bldZ = findBuildingByName("综合楼");
            Object.keys(floorCoordinates).forEach(function(floor) {
                var rooms = floorCoordinates[floor];
                Object.keys(rooms).forEach(function(rk) {
                    pushRoom("综合楼", bldZ, floor, rk, rooms[rk], "zonghe");
                });
            });
            // 已接入平面图的研究生楼：运行时解析结果同样参与房间搜索
            if (typeof PlanBuildings !== "undefined") {
                for (var pid in PlanBuildings.REG) {
                    var pbld = findBuildingById(pid), pname = PlanBuildings.nameOf(pid);
                    var nfl = PlanBuildings.floorsOf(pid);
                    for (var pf = 1; pf <= nfl; pf++) {
                        var pcs = PlanBuildings.coordsFor(pid, pf);
                        for (var prk in pcs) {
                            if (/^楼梯|^电梯|^门厅|^出口|^正门|^连廊/.test(prk)) continue;
                            pushRoom(pname, pbld, String(pf), prk, pcs[prk], pid);
                        }
                    }
                }
            }
            results.sort(function(a, b) { return b.score - a.score; });
            return results;
        }

        function findBuildingByName(name) {
            for (var i = 0; i < BUILDINGS.length; i++) {
                if (BUILDINGS[i].name === name || BUILDINGS[i].alias === name) return BUILDINGS[i];

            return null;
        }

                    html += '<button class="search-item-btn accent" onclick="locateRoom(\'' + d.room + '\',\'' + d.floor + '\',\'' + (d.bid || "") + '\')">定位</button>';

        /* ========== 热门搜索 / 最近搜索 ========== */
        var SEARCH_HISTORY_KEY = "hnuSearchHistory";

        /* ========== 平面图缩放功能 ========== */
        var mapState = { scale: 1, translateX: 0, translateY: 0, minScale: 0.5, maxScale: 5, rotZ: 0 };
        var currentRoute = null;   // 当前画出的路线 {start, dest}，缩放时重绘
        var isDragging = false, lastX = 0, lastY = 0, lastDist = 0;

        function resetZoom() {
            mapState.scale = 1; mapState.translateX = 0; mapState.translateY = 0; mapState.rotZ = 0;
            applyTransform();
        }
        // 房间标记保持屏幕尺寸：缩放时反向补偿，选中点再放大 1.4 倍
        function applyMarkerScale() {
            var inv = 1 / (mapState.scale || 1);
            var markers = document.querySelectorAll(".room-marker");
            for (var i = 0; i < markers.length; i++) {
                var boost = markers[i].classList.contains("selected") ? 1.4 : 1;
                markers[i].style.transform = "scale(" + (inv * boost) + ")";
            }
            // 指示层徽标同样保持屏幕尺寸
            var badges = document.querySelectorAll(".elev-badge");
            for (var j = 0; j < badges.length; j++) {
                badges[j].style.transform = "translate(-50%,-50%) scale(" + inv + ")";
            }
        }
        function initMapZoom() {
            var viewport = document.getElementById("mapBox");
            var transform = document.getElementById("mapTransform");
            if (!viewport || !transform) return;
            if (viewport.dataset.zoomInit) return;
            viewport.dataset.zoomInit = "1";
            var pts = new Map();     // 活动指针（统一鼠标/触摸/笔）
            var pinch = null;        // 双指状态 {dist, ang}
            var panLast = null;      // 单指拖动上一点
            /* S3.1 手势扩展：惯性滑行 / 双击放大 / 触控防误触 */
            var fling = { vx: 0, vy: 0, raf: 0, last: 0 };
            var tap = null;          // 上一次点按 {t,x,y}（双击检测）
            var downInfo = null;     // 本次按下的起点信息（判定是否为"点按"）
            var panVel = [];         // 平移速度采样（惯性用）

            function stopFling() {
                if (fling.raf) { cancelAnimationFrame(fling.raf); fling.raf = 0; }
            }
            // 惯性滑行 + 边界回弹：越界后弹簧力拉回，速度衰减后自然停在边界内
            function flingStep(ts) {
                fling.raf = 0;
                var dt = Math.min(34, ts - (fling.last || ts)); fling.last = ts;
                var c = boxCenter();
                var w = planW * mapState.scale, h = planH * mapState.scale;
                var a = (mapState.rotZ || 0) * Math.PI / 180;
                var bw = Math.abs(w * Math.cos(a)) + Math.abs(h * Math.sin(a));
                var bh = Math.abs(w * Math.sin(a)) + Math.abs(h * Math.cos(a));
                var mx = Math.max(0, (bw - c.w) / 2), my = Math.max(0, (bh - c.h) / 2);
                var tx = mapState.translateX, ty = mapState.translateY;
                var ox = tx > mx ? tx - mx : (tx < -mx ? tx + mx : 0);
                var oy = ty > my ? ty - my : (ty < -my ? ty + my : 0);
                if (ox) { fling.vx *= Math.pow(0.85, dt / 16); fling.vx -= ox * 0.008 * dt; }
                if (oy) { fling.vy *= Math.pow(0.85, dt / 16); fling.vy -= oy * 0.008 * dt; }
                mapState.translateX += fling.vx * dt;
                mapState.translateY += fling.vy * dt;
                var f = Math.pow(0.945, dt / 16);
                fling.vx *= f; fling.vy *= f;
                if (Math.abs(fling.vx) < 0.02 && Math.abs(fling.vy) < 0.02 && !ox && !oy) {
                    commit(true);   // 最终回弹收位（commit 内含 clampPan + 过渡动画）
                } else {
                    applyTransform();
                    fling.raf = requestAnimationFrame(flingStep);
                }
            }
            function startFling(vx, vy) {
                stopFling();
                fling.vx = vx; fling.vy = vy; fling.last = 0;
                fling.raf = requestAnimationFrame(flingStep);
            }
            // 松手后：点按（双击放大）或惯性滑行
            function handleTapOrFling(e) {
                if (!downInfo) return;
                var moved = Math.hypot(e.clientX - downInfo.x, e.clientY - downInfo.y);
                var dur = e.timeStamp - downInfo.t;
                if (moved < 10 && dur < 260) {
                    if (tap && e.timeStamp - tap.t < 320 &&
                        Math.hypot(e.clientX - tap.x, e.clientY - tap.y) < 48) {
                        stopFling();
                        zoomAt({ x: e.clientX, y: e.clientY }, 1.7);   // 双击：围绕点按处放大
                        commit(true);
                        tap = null;
                    } else {
                        tap = { t: e.timeStamp, x: e.clientX, y: e.clientY };
                    }
                } else if (panVel.length >= 2) {
                    var s = panVel, n = s.length, i0 = n - 1;
                    while (i0 > 0 && e.timeStamp - s[i0 - 1].t < 90) i0--;
                    var dt0 = Math.max(1, s[n - 1].t - s[i0].t);
                    var vx = (s[n - 1].x - s[i0].x) / dt0, vy = (s[n - 1].y - s[i0].y) / dt0;
                    if (Math.hypot(vx, vy) > 0.28) startFling(vx, vy);   // px/ms
                }
                downInfo = null;
            }

            function boxCenter() {
                var r = viewport.getBoundingClientRect();
                return { x: r.left + r.width / 2, y: r.top + r.height / 2, w: r.width, h: r.height };
            }
            // 平移边界钳制：图缩小到视口内时锁定居中，放大后图缘不越过视口 → 不再有黑边/乱跑
            function clampPan() {
                var c = boxCenter();
                var w = planW * mapState.scale, h = planH * mapState.scale;
                var a = (mapState.rotZ || 0) * Math.PI / 180;
                var bw = Math.abs(w * Math.cos(a)) + Math.abs(h * Math.sin(a));
                var bh = Math.abs(w * Math.sin(a)) + Math.abs(h * Math.cos(a));
                var mx = Math.max(0, (bw - c.w) / 2);
                var my = Math.max(0, (bh - c.h) / 2);
                if (mapState.translateX > mx) mapState.translateX = mx;
                if (mapState.translateX < -mx) mapState.translateX = -mx;
                if (mapState.translateY > my) mapState.translateY = my;
                if (mapState.translateY < -my) mapState.translateY = -my;
            }
            // 围绕屏幕点 A 缩放 k 倍：手指按住的内容点保持不动（锚点缩放，不漂移）
            function zoomAt(A, k) {
                var c = boxCenter();
                var ns = Math.max(mapState.minScale, Math.min(mapState.maxScale, mapState.scale * k));
                if (ns === mapState.scale) return;
                var r = ns / mapState.scale;
                mapState.translateX = r * mapState.translateX + (1 - r) * (A.x - c.x);
                mapState.translateY = r * mapState.translateY + (1 - r) * (A.y - c.y);
                mapState.scale = ns;
            }
            // 围绕屏幕点 A 旋转 d 度：双指旋转同样绕指间中点，不绕屏幕中心乱转
            function rotateAt(A, d) {
                var c = boxCenter();
                var vx = mapState.translateX + c.x - A.x, vy = mapState.translateY + c.y - A.y;
                var rad = d * Math.PI / 180, cos = Math.cos(rad), sin = Math.sin(rad);
                mapState.translateX = A.x - c.x + vx * cos - vy * sin;
                mapState.translateY = A.y - c.y + vx * sin + vy * cos;
                mapState.rotZ = (mapState.rotZ || 0) + d;
            }
            function commit(animate) {
                clampPan();
                if (animate) transform.classList.add("animate");
                applyTransform();
                if (animate) setTimeout(function () { transform.classList.remove("animate"); }, 220);
            }

            viewport.addEventListener("pointerdown", function (e) {
                if (e.pointerType === "mouse" && e.button !== 0) return;
                stopFling();
                pokeMini();
                if (viewport.setPointerCapture) { try { viewport.setPointerCapture(e.pointerId); } catch (err) {} }
                pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
                if (pts.size === 1) {
                    panLast = { x: e.clientX, y: e.clientY };
                    downInfo = { x: e.clientX, y: e.clientY, t: e.timeStamp };
                    panVel = [{ t: e.timeStamp, x: e.clientX, y: e.clientY }];
                } else if (pts.size === 2) {
                    var arr = Array.from(pts.values());
                    pinch = { dist: Math.hypot(arr[0].x - arr[1].x, arr[0].y - arr[1].y),
                              ang: Math.atan2(arr[1].y - arr[0].y, arr[1].x - arr[0].x) * 180 / Math.PI };
                    panLast = null;
                    downInfo = null; tap = null;   // 双指不是点按
                }
                e.preventDefault();
            });
            viewport.addEventListener("pointermove", function (e) {
                if (!pts.has(e.pointerId)) return;
                pts.set(e.pointerId, { x: e.clientX, y: e.clientY });
                if (pts.size === 2) {
                    var arr = Array.from(pts.values());
                    var mid = { x: (arr[0].x + arr[1].x) / 2, y: (arr[0].y + arr[1].y) / 2 };
                    var dist = Math.hypot(arr[0].x - arr[1].x, arr[0].y - arr[1].y);
                    var ang = Math.atan2(arr[1].y - arr[0].y, arr[1].x - arr[0].x) * 180 / Math.PI;
                    if (pinch && pinch.dist > 0) zoomAt(mid, dist / pinch.dist);
                    if (pinch) {
                        var dAng = ang - pinch.ang;
                        if (dAng > 180) dAng -= 360;
                        if (dAng < -180) dAng += 360;
                        if (Math.abs(dAng) < 25) rotateAt(mid, dAng);   // 抑制抖动
                    }
                    pinch = { dist: dist, ang: ang };
                    commit(false);
                } else if (pts.size === 1 && panLast) {
                    mapState.translateX += e.clientX - panLast.x;
                    mapState.translateY += e.clientY - panLast.y;
                    panLast = { x: e.clientX, y: e.clientY };
                    panVel.push({ t: e.timeStamp, x: e.clientX, y: e.clientY });
                    if (panVel.length > 6) panVel.shift();
                    commit(false);
                }
                e.preventDefault();
            });
            function release(e) {
                pts.delete(e.pointerId);
                if (pts.size < 2) pinch = null;
                if (pts.size === 1) {
                    var arr = Array.from(pts.values());
                    panLast = { x: arr[0].x, y: arr[0].y };
                } else if (pts.size === 0) {
                    panLast = null;
                    if (e.type === "pointerup") handleTapOrFling(e);   // 点按→双击放大；拖拽→惯性
                    downInfo = null;
                }
            }
            viewport.addEventListener("pointerup", release);
            viewport.addEventListener("pointercancel", release);

            // 触摸手势冲突治理：长按不弹菜单；iOS Safari 禁页面双指缩放
            viewport.addEventListener("contextmenu", function (e) { e.preventDefault(); });

            // 按钮缩放/旋转：带平滑动画，围绕视口中心（wheel 缩放已按手机端规范移除，
            // 桌面端用双击或 +/− 按钮）
            var zoomIn = document.getElementById("zoomIn");
            var zoomOut = document.getElementById("zoomOut");
            var zoomReset = document.getElementById("zoomReset");
            if (zoomIn) zoomIn.onclick = function () { zoomAt(boxCenter(), 1.3); commit(true); };
            if (zoomOut) zoomOut.onclick = function () { zoomAt(boxCenter(), 1 / 1.3); commit(true); };
            if (zoomReset) zoomReset.onclick = resetZoom;
            var rotateLeft = document.getElementById("rotateLeft");
            var rotateRight = document.getElementById("rotateRight");
            var rotateReset = document.getElementById("rotateReset");
            if (rotateLeft) rotateLeft.onclick = function () { rotateAt(boxCenter(), -15); commit(true); };
            if (rotateRight) rotateRight.onclick = function () { rotateAt(boxCenter(), 15); commit(true); };
            if (rotateReset) rotateReset.onclick = function () { mapState.rotZ = 0; commit(true); };
        }

        var transformRaf = 0;
        function applyTransform() {
            var transform = document.getElementById("mapTransform");
            if (transform) {
                var t = "translate(calc(-50% + " + mapState.translateX + "px), calc(-50% + " + mapState.translateY + "px))";
                t += " rotateZ(" + (mapState.rotZ || 0) + "deg)";
                t += " scale(" + mapState.scale + ")";
                transform.style.transform = t;
            }
            applyMarkerScale();
            pokeMini();   // S3.3 Mini-map：任何视图操作时浮现，停止操作后淡出
            // 路线重绘走 rAF 节流：CSS 缩放即时生效，画布下一帧按新倍率重画保持线宽恒定
            // （纯几何重绘，不重算 A*；路线数据在 lastAlts）
            if (currentRoute && !transformRaf) {
                transformRaf = requestAnimationFrame(function() {
                    transformRaf = 0;
                    if (currentRoute) redrawRoute();
                });
            }
        }

        /* =====================================================================
         * S3.3 Mini-map：左下角总览小地图（平面图 + 当前视口框）
         * 操作时浮现，停止操作 900ms 后淡出；低端机自动禁用（省性能）。
         * ===================================================================== */
        var mini = { raf: 0, hideTimer: 0 };
        function pokeMini() {
            if (PERF.low) return;   // 低端机不画小地图
            var mm = document.getElementById("miniMap");
            if (!mm) return;
            mm.classList.add("on");
            clearTimeout(mini.hideTimer);
            mini.hideTimer = setTimeout(function () { mm.classList.remove("on"); }, 900);
            scheduleMini();
        }
        function scheduleMini() {
            if (mini.raf) return;
            mini.raf = requestAnimationFrame(function () { mini.raf = 0; drawMini(); });
        }
        function drawMini() {
            var mm = document.getElementById("miniMap");
            var vp = document.getElementById("mapBox");
            if (!mm || !vp || !vp.clientWidth) return;
            var ctx = mm.getContext("2d");
            var W = mm.width, H = mm.height;
            ctx.clearRect(0, 0, W, H);
            ctx.fillStyle = "#eef2f8";
            ctx.fillRect(0, 0, W, H);
            var img = document.getElementById("floorMap");
            if (img && img.style.display !== "none" && img.naturalWidth > 1) {
                var s = Math.min(W / img.naturalWidth, H / img.naturalHeight);
                var dw = img.naturalWidth * s, dh = img.naturalHeight * s;
                try { ctx.drawImage(img, (W - dw) / 2, (H - dh) / 2, dw, dh); } catch (e) {}
            } else {
                // SVG 底图 / 加载中：画浅色图纸底 + 网格
                ctx.strokeStyle = "rgba(100,116,139,.22)";
                ctx.lineWidth = 1;
                for (var gx = 10; gx < W; gx += 16) { ctx.beginPath(); ctx.moveTo(gx, 0); ctx.lineTo(gx, H); ctx.stroke(); }
                for (var gy = 10; gy < H; gy += 16) { ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(W, gy); ctx.stroke(); }
            }
            // 当前视口框：屏幕四角 → 逆变换回平面图坐标（含旋转/缩放/平移）
            var vw = vp.clientWidth, vh = vp.clientHeight;
            var scl = mapState.scale || 1, rot = (mapState.rotZ || 0) * Math.PI / 180;
            var cos = Math.cos(rot), sin = Math.sin(rot);
            ctx.beginPath();
            for (var i = 0; i < 4; i++) {
                var cx0 = (i === 0 || i === 3) ? 0 : vw;
                var cy0 = (i < 2) ? 0 : vh;
                var rx = cx0 - vw / 2 - mapState.translateX;
                var ry = cy0 - vh / 2 - mapState.translateY;
                var lx = (rx * cos + ry * sin) / scl;
                var ly = (-rx * sin + ry * cos) / scl;
                var nx = (planW / 2 + lx) / planW, ny = (planH / 2 + ly) / planH;
                if (i === 0) ctx.moveTo(nx * W, ny * H); else ctx.lineTo(nx * W, ny * H);
            }
            ctx.closePath();
            ctx.fillStyle = "rgba(37,99,235,.14)";
            ctx.fill();
            ctx.lineWidth = 2.5;
            ctx.strokeStyle = "#2563eb";
            ctx.stroke();
            ctx.strokeStyle = "rgba(100,116,139,.55)";
            ctx.lineWidth = 1;
            ctx.strokeRect(0.5, 0.5, W - 1, H - 1);
        }

            if (!tabs) return;
            tabs.innerHTML = "";

            for (var i = 1; i <= n; i++) {
                (function(f) {
                    var btn = document.createElement("button");
                    btn.type = "button"; btn.className = "floor-tab"; btn.textContent = f;
                    btn.setAttribute("role", "tab");
                    btn.setAttribute("aria-selected", "false");
                    btn.onclick = function() {
                        // 新接入楼栋（研究生楼）不走楼层密码锁：平面图无加密需求
                        if (typeof PlanBuildings !== "undefined" && PlanBuildings.active()) {
                            PlanBuildings.prepareFloor(String(f).replace(/F$/i, ""));
                            applyUnlockedFloor(f);
                            return;
                        }
                        // 走楼层锁流程：加密楼层会先弹密码，解锁后广播 floor-unlocked
                        if (floorLockCtl) floorLockCtl.unlockFloor(f, "tab");

                    };
                    tabs.appendChild(btn);
                })(i + "F");
            }

            for (var i = 0; i < btns.length; i++) {

                btns[i].classList.toggle("active", on);

            input.addEventListener("input", function() {

                    var kw = input.value.trim();

var currentIndoorBld = null;   // 当前进入楼内导航的楼栋（BUILDINGS 项）

        function resolveStartFromText(text, cb) {
            var kw = String(text || "").trim();
            if (!kw) { showToast("请输入起点地点名"); return; }
            var list = (typeof BUILDINGS !== "undefined" && BUILDINGS) ? BUILDINGS : [];
            var exact = null, fuzzy = null;
            for (var i = 0; i < list.length; i++) {
                var b = list[i];
                var nm = b.name || "", al = b.alias || "";
                if (nm === kw || al === kw) { exact = b; break; }
                if (!fuzzy && (nm.indexOf(kw) >= 0 || kw.indexOf(nm) >= 0 || (al && al.indexOf(kw) >= 0))) fuzzy = b;
            }
            var hit = exact || fuzzy;
            if (hit && hit.lng != null && hit.lat != null) {
                cb({ lng: hit.lng, lat: hit.lat, label: hit.name, from: "校园楼栋" });
                return;

            if (typeof AMap === "undefined" || typeof AMap.Geocoder !== "function") {
                showToast("未找到「" + kw + "」，且地图未加载无法联网解析");
                return;

            var geo = null;
            try { geo = new AMap.Geocoder({ city: "长沙", radius: 8000 }); } catch (e) { geo = null; }
            if (!geo) { showToast("未找到「" + kw + "」，换个说法试试"); return; }

                if (status === "complete" && result.geocodes && result.geocodes.length) {

                    if (loc && loc.lng != null) {

                        return;

                var a = parseInt(g.s.slice(0, 2), 10) * 60 + parseInt(g.s.slice(3), 10);
                var b2 = parseInt(g.e.slice(0, 2), 10) * 60 + parseInt(g.e.slice(3), 10);
                if (m >= a && m <= b2) return g;
            }
            return null;
        }
        /* 路线是否穿过教学区核心拥挤区域 */
        function routeHitsCrowd(r) {
            var p = (r && r.path) || [];
            for (var i = 0; i < p.length; i++) {
                if (haversine(p[i], CROWD_HUB) < CROWD_HUB.r) return true;
            }
            return false;
        }
        var peakTipTimer = null;
        /* 刷新高峰提示；每 30 秒自动跑一次，跨时段时提示会自动出现/消失 */
        function updatePeakTip() {
            if (!peakTipTimer) peakTipTimer = setInterval(updatePeakTip, 30000);
            var el = document.getElementById("amapPeakTip");
            if (!el) return;
            var pk = peakSegmentNow();
            if (!pk || navMode !== "walk" || !navRoutes.length || !navRoutes[navSelIdx]) {
                el.style.display = "none"; el.innerHTML = ""; return;
            }
            var span = pk.s + "–" + pk.e;
            var curCrowded = routeHitsCrowd(navRoutes[navSelIdx]);
            var altIdx = -1;
            for (var i = 0; i < navRoutes.length; i++) {
                if (i !== navSelIdx && !routeHitsCrowd(navRoutes[i])) { altIdx = i; break; }
            }
            if (curCrowded) {
                el.className = "amap-peak-tip";
                el.innerHTML = "⚠️ 课间高峰 " + span + "：当前方案经过" + CROWD_HUB.name + "，人多拥挤。" +
                    (altIdx >= 0
                        ? "建议点上方切换「" + (navRoutes[altIdx].label || ("方案" + (altIdx + 1))) + "」避开人流。"
                        : "条件允许时建议改走<b>校外路线</b>（如麓山南路一侧），减少人流拥堵。");
            } else {
                el.className = "amap-peak-tip ok";
                el.innerHTML = "✅ 课间高峰 " + span + "：当前方案已避开" + CROWD_HUB.name + "，通行相对顺畅";
            }

        function renderRouteChips() {
            var rc = document.getElementById("amapRouteChips");
            if (!rc) return;

            for (var i = 0; i < navRoutes.length; i++) {
                var r = navRoutes[i];
                html += '<button type="button" data-route="' + i + '"' + (i === navSelIdx ? ' class="active"' : '') + '>' +
                        '<b>' + (r.label || ("方案" + (i + 1))) + '</b><i>' +
                        fmtDist(r.dist) + " · " + Math.max(1, Math.round(r.time / 60)) + "分钟</i>" +
                        (r.note ? '<u>' + r.note + '</u>' : '') + '</button>';

        function selectNavRoute(idx) {
            if (!amapInstance || !navRoutes[idx]) return;

            if (old && old._line && navSelIdx !== idx) old._line.setOptions(altLineOpts(old.path, navSelIdx));
            navSelIdx = idx;
            var r = navRoutes[idx];
            r._line.setOptions(routeLineOpts(r.path));
            var summary = document.getElementById("amapNavSummary");
            if (summary) summary.innerHTML = (navRoutes.length > 1 ? "已选「" + (r.label || ("方案" + (idx + 1))) + "」· " : "") +
                "全程约 <b>" + fmtDist(r.dist) + "</b> · 约 <b>" + Math.max(1, Math.round(r.time / 60)) + " 分钟</b>" +
                (r.note ? '<br><span class="amap-route-note">' + r.note + '</span>' : "");
            var stepsBox = document.getElementById("amapNavSteps");
            if (stepsBox) {
                var html = "";
                if (r.steps && r.steps.length) {
                    html += '<div class="amap-nav-steps-head">' + (r.transit ? '行程分段 · 共 ' + r.steps.length + ' 段' : '路线指引 · 共 ' + r.steps.length + ' 步') + '</div>';
                    // 实时计算当前步骤索引（导航进行中时高亮正确位置）
                    var curStepIdx = 0;
                    if (myPos) { var pgSel = routeProgress(myPos); if (pgSel) curStepIdx = stepIndexAt(r, pgSel.along).index; }
                    for (var j = 0; j < r.steps.length; j++) {
                        var st = r.steps[j];
                        // 公交/地铁分段：解析时已拼好白话文案（乘车线路+上下车站），直接呈现，不做方位注释
                        var rd = (st._icon || st._display) ? { arrow: st._icon || "•" } : relativeDir(st, myHeading);
                        var txt = st._display || stepDisplay(st, myHeading);
                        html += '<div class="amap-nav-step' + (j === curStepIdx ? ' current' : '') + '" data-step="' + j + '">' +
                                '<i>' + rd.arrow + '</i><span>' + txt +

            updateNavProgress();

        function drawRoutes(routes) {
            // 重算收尾：无论本轮成功与否，先清掉上一条路线的重算标记（须在 clearNavRoute 清空数组前读取）
            var prev = navRoutes[navSelIdx];
            if (prev) prev._recalculating = false;
            clearNavRoute();
            offRoadTicks = 0;
            if (!routes.length || !amapInstance) return false;
            navRoutes = routes;
            for (var i = 0; i < navRoutes.length; i++) {
                navRoutes[i]._line = (i === 0)
                    ? new AMap.Polyline(routeLineOpts(navRoutes[i].path))
                    : new AMap.Polyline(altLineOpts(navRoutes[i].path, i));
                amapInstance.add(navRoutes[i]._line);
                if (i > 0) navAltLines.push(navRoutes[i]._line);
            }
            navPolyline = navRoutes[0]._line;
            selectNavRoute(0);
            /* S5.3 埋点：内嵌室外路线成功（统一导航的室外段在此不入账，避免与 unified 重复计数） */
            if (embeddedTracking) {
                Track.log("route_result", { ok: true, kind: "outdoor", meters: navRoutes[0].dist || null });
                embeddedTracking = false;
            }
            if (navRoutes[0].dist <= 80) {
                var ab = document.getElementById("amapArriveBtn");
                if (ab) ab.classList.add("pulse");
                showToast("您已到达附近，可点『我已到达』进入楼内导航");
            }

        }
        function routeFail(b, origin, dest, why) {
            Track.log("route_result", { ok: false, kind: "outdoor", reason: String(why || "unknown") });   // S5.3 路线失败埋点
            var summary = document.getElementById("amapNavSummary");
            clearNavRoute();
            navPolyline = new AMap.Polyline({
                path: [origin, dest], strokeColor: "#2563eb", strokeWeight: 5,
                strokeOpacity: 0.75, strokeStyle: "dashed", lineJoin: "round", zIndex: 180
            });
            amapInstance.add(navPolyline);
            try { amapInstance.setFitView([navPolyline, navTargetMarker], false, [80, 80, 240, 80]); } catch (e) {}
            startGeoWatch();
            if (summary) summary.innerHTML = "⚠️ 路线服务暂不可用（" + why + "）。下方虚线<b>仅示意相对方位与直线距离（约 " +
                fmtDist(haversine(myPos, b)) + "）</b>，<b>不是可通行路径，请勿沿线行走</b>；请点『用高德App导航』获取真实路线。";
        }
        var embeddedTracking = false;   // S5.3：本轮内嵌室外规划是否入埋点账（统一导航的室外段不入账）
        function computeEmbeddedRoute(b) {
            if (!myPos || b.lng == null || b.lat == null) return;
            /* S5.1 断网守卫：离线时内嵌路线规划直接给明确提示 */
            if (navigator.onLine === false) {
                var sumOff = document.getElementById("amapNavSummary");
                if (sumOff) sumOff.innerHTML = "📴 当前离线，路线规划不可用；可点『用高德App导航』（恢复联网后重试）。";
                showToast("当前离线，路线规划不可用");
                return;
            }
            embeddedTracking = true;   // 本次规划成功后由 drawRoutes 入账
            routeToken++;   // 本轮之后发出的回调才有效，过期回调一律丢弃，避免旧结果覆盖新方案
            var tk = routeToken;
            var origin = [myPos.lng, myPos.lat];
            /* S4.2：室外段导航到「楼栋入口」而非几何中心，到达后与楼内 1F 门厅自然衔接 */
            var entry = buildingEntry(b);
            var dest = entry.ll ? [entry.ll.lng, entry.ll.lat] : [b.lng, b.lat];
            var summary = document.getElementById("amapNavSummary");
            if (summary) summary.textContent = "正在规划路线…";
            var stepsBox = document.getElementById("amapNavSteps");
            if (stepsBox) stepsBox.innerHTML = "";

            // 驾车：以高德推荐策略为主，另取最短/躲避拥堵；只有高德确实给出不同路线时才成为多方案
            // 三个策略顺序请求，避免同一 Key 并发触发 QPS 限制
            if (navMode === "car" && typeof AMap.Driving === "function" && AMap.DrivingPolicy) {
                var policies = [["高德推荐", AMap.DrivingPolicy.LEAST_TIME],
                                ["最短距离", AMap.DrivingPolicy.LEAST_DISTANCE],
                                ["躲避拥堵", AMap.DrivingPolicy.REAL_TRAFFIC]];
                var found = [], pi = 0;
                var nextDrive = function () {
                    if (tk !== routeToken) return;
                    if (pi >= policies.length) {
                        found.sort(function (a, c) { return a.dist - c.dist; });
                        var uniq = [];
                        for (var i = 0; i < found.length; i++) {
                            var dup = false;
                            for (var j2 = 0; j2 < uniq.length; j2++) {
                                if (Math.abs(uniq[j2].dist - found[i].dist) < 15 &&
                                    Math.abs(uniq[j2].time - found[i].time) < 15) dup = true;
                            }
                            if (!dup) uniq.push(found[i]);
                        }
                        if (!uniq.length) { routeFail(b, origin, dest, "未规划到驾车路线"); return; }
                        annotateRoutes(uniq);
                        if (drawRoutes(uniq)) startGeoWatch();
                        return;
                    }
                    var label = policies[pi][0], policy = policies[pi][1];
                    pi++;
                    var d = null;
                    try { d = new AMap.Driving({ policy: policy }); } catch (e) {}
                    if (!d) { nextDrive(); return; }
                    d.search(origin, dest, function (status, result) {
                        if (tk !== routeToken) return;
                        if (status === "complete") {
                            var rs = collectRoutes(result);
                            if (rs.length) { rs[0].label = label; found.push(rs[0]); }
                        }
                        setTimeout(nextDrive, 150);
                    });
                };
                nextDrive();
                return;
            }
            // 公交/地铁：高德 Transfer 规划（真实公交线网+换乘方案，贴高德数据，不自造路径）
            // 顺序请求 + 一次重试，避免 QPS 限制；路线chips 显示换乘线路链
            if (navMode === "bus" && typeof AMap.Transfer === "function") {
                var busOpt = { city: "长沙" };
                if (typeof AMap.TransferPolicy !== "undefined" && AMap.TransferPolicy) busOpt.policy = AMap.TransferPolicy.LEAST_TIME;
                var tf = null;
                try { tf = new AMap.Transfer(busOpt); } catch (e) {}
                if (!tf) { routeFail(b, origin, dest, "公交规划插件不可用"); return; }
                var busRetried = false;
                var doBusSearch = function () {
                    tf.search(origin, dest, function (status, result) {
                        if (tk !== routeToken) return;
                        if (status === "error" && !busRetried) { busRetried = true; setTimeout(doBusSearch, 800); return; }
                        var plans = (status === "complete" && result && result.plans) ? result.plans : [];
                        var routes = [];
                        for (var i = 0; i < plans.length && routes.length < 3; i++) {
                            var rr = transitPlanToRoute(plans[i], routes.length, b.name);
                            if (rr) routes.push(rr);
                        }
                        var why = (result && result.info) ? result.info : String(status || "未知错误");
                        if (!routes.length) { routeFail(b, origin, dest, why); return; }
                        if (!drawRoutes(routes)) { routeFail(b, origin, dest, why); return; }
                        if (summary) summary.innerHTML = "公交/地铁方案按高德实时线网规划，班次时刻请以高德App为准。<br>" + summary.innerHTML;
                        startGeoWatch();
                    });
                };
                doBusSearch();
                return;
            }
            var svc = null;
            try {
                if (navMode === "ride" && typeof AMap.Riding === "function") svc = new AMap.Riding({});
                else if (typeof AMap.Walking === "function") svc = new AMap.Walking({});
            } catch (e) { svc = null; }
            if (!svc) { routeFail(b, origin, dest, "当前出行方式不支持内嵌规划"); return; }
            var retried = false;
            var doSearch = function () {
                svc.search(origin, dest, function (status, result) {
                    if (tk !== routeToken) return;
                    // 高德偶发 QPS/超时返回 error，稍后重试一次，避免把临时故障误报成"无路线"
                    if (status === "error" && !retried) { retried = true; setTimeout(doSearch, 800); return; }
                    var routes = (status === "complete") ? collectRoutes(result) : [];
                    var why = (result && result.info) ? result.info : String(status || "未知错误");
                    if (!routes.length && navMode === "ride") {
                        // 高德骑行无路线（起终点多落在骑行路网之外）→ 明确告知原因后给步行参考，不冒充骑行方案
                        var w = null;
                        try { w = new AMap.Walking({}); } catch (e2) {}
                        if (w) {
                            w.search(origin, dest, function (s2, r2) {
                                if (tk !== routeToken) return;
                                var rs2 = (s2 === "complete") ? collectRoutes(r2) : [];
                                if (!rs2.length) { routeFail(b, origin, dest, why); return; }
                                for (var i = 0; i < rs2.length; i++) rs2[i].label = rs2.length > 1 ? ("步行方案" + (i + 1)) : "步行参考";
                                if (!drawRoutes(rs2)) { routeFail(b, origin, dest, why); return; }
                                if (summary) summary.innerHTML = "高德暂无骑行路线（" + why + "），已显示步行参考路线。<br>" + summary.innerHTML;
                                startGeoWatch();
                            });
                            return;
                        }
                    }
                    if (!routes.length) { routeFail(b, origin, dest, why); return; }
                    for (var i2 = 0; i2 < routes.length; i2++) routes[i2].label = routes.length > 1 ? ("方案" + (i2 + 1)) : modeLabel(navMode);
                    annotateRoutes(routes);
                    if (!drawRoutes(routes)) { routeFail(b, origin, dest, why); return; }
                    startGeoWatch();
                });
            };
            doSearch();
        }
        // 入口：优先内嵌地图导航；无 Key / 地图未加载 → 兜底跳转高德
        function startEmbeddedNav(b, target) {
            if (!b) return;
            if (uniRoute) uniAbort();   // S4：新导航开始前清统一导航状态
            pendingNavTarget = target || null;
            autoArrived = false;
            hideSearchResults();
            if (!amapInstance || typeof AMap === "undefined") { goAmapNav(b); return; }
            /* S4.2：路线终点与旗标都落在「楼栋入口」，到达后经 amapArrived 接楼内导航 */
            var entry = buildingEntry(b);
            var ep = entry.ll ? entry.ll : { lng: b.lng, lat: b.lat };
            pendingNavBld = { name: b.name, lng: ep.lng, lat: ep.lat, indoor: !!b.indoor };

            if (pk) pk.innerHTML = "";

            if (sheet) sheet.classList.remove("expanded");

            showAmapNavPanel(b);

        // 到达：统一导航 → 推进下一段；普通楼栋导航 → 关闭面板进入楼内导航并定位/高亮目标
        function amapArrived() {
            if (uniRoute) { uniAdvance(true); return; }   // S4：室外段 GPS 到达入口 → 自动衔接（静默进楼，避免双重提示）
            var b = pendingNavBld;
            var target = pendingNavTarget;
            hideAmapNavPanel(true);
            clearNavRoute();
            if (target && (target.floor || target.room)) {
                try {
                    sessionStorage.setItem("locateTarget", JSON.stringify(
                        { room: target.room || null, floor: target.floor || null, start: "门厅" }));
                } catch (e) {}
            }
            if (b && b.indoor) {
                currentIndoorBld = findBuildingByName(b.name) || b;
                showIndoor();
            } else if (b) {
                showToast("「" + b.name + "」的楼内立体导航正在建设中，暂未开放，敬请期待～");
            }
        }

        /* =====================================================================
         * 课表导航：本地结构化课表 + 「下一节课」卡片一键导航
         * ---------------------------------------------------------------------
         * 为什么不直连湖大教务系统：浏览器单文件受跨域(CORS)与统一身份认证安全
         * 限制，无法代用户登录教务平台抓取课表；且代输学号密码存在账号安全风险。
         * 因此采用本地录入（一次录入、全程自动）：按周次/节次计算最近一节课，
         * 悬浮卡显示并一键触发现有导航流程（室外→楼栋→到达后进楼内高亮教室）。
         * ===================================================================== */
        var TT_KEY = "navTimetable";
        var TT_WEEK0_KEY = "navTimetableWeek0";   // 学期第一周周一的日期（yyyy-mm-dd）
        /* 节次→上课时间映射（湖南大学常规作息：上午4节/下午4节/晚上3节，每节45分钟）。
           如与教务处校历有出入，改这里的字符串即可（"HH:MM"）。 */
        var TT_PERIODS = ["08:00", "08:55", "10:05", "11:00",
                          "14:00", "14:55", "15:55", "16:50",
                          "19:00", "19:55", "20:50"];
        var TT_DAY_NAMES = ["周一", "周二", "周三", "周四", "周五", "周六", "周日"];
        function ttLoad() {
            try { return JSON.parse(localStorage.getItem(TT_KEY) || "[]") || []; }
            catch (e) { return []; }
        }
        function ttSave(list) { localStorage.setItem(TT_KEY, JSON.stringify(list)); }
        function ttWeek0() {
            var v = localStorage.getItem(TT_WEEK0_KEY) || "2026-09-07";
            var d = new Date(v + "T00:00:00");
            return isNaN(d.getTime()) ? new Date("2026-09-07T00:00:00") : d;
        }
        // 周次字符串解析："1-16" / "1,3,5" / "1-8,10-16" → {周次:true} 映射
        function ttParseWeeks(str) {
            var set = {};
            String(str || "").replace(/，/g, ",").split(",").forEach(function (seg) {
                seg = seg.trim();
                var m = seg.match(/^(\d+)\s*[-–~]\s*(\d+)$/);
                if (m) { for (var i = parseInt(m[1], 10); i <= parseInt(m[2], 10); i++) set[i] = 1; }
                else if (/^\d+$/.test(seg)) set[parseInt(seg, 10)] = 1;
            });
            return set;
        }
        // "HH:MM" → 当天该时刻的 Date（基于 base 的日期）
        function ttTimeOn(base, hhmm) {
            var p = hhmm.split(":");
            var d = new Date(base.getFullYear(), base.getMonth(), base.getDate(),
                             parseInt(p[0], 10), parseInt(p[1], 10), 0, 0);
            return d;
        }
        // 计算下一节课：从现在起向后看7天，取当前周次内最早的一节在上的课
        // 返回 { c: 课程, at: 上课时间Date, week: 当前周次 } 或 null（无课/不在周次内）
        function ttNext(now) {
            now = now || new Date();
            var w0 = ttWeek0();
            var dayMs = 86400000;
            var today0 = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            var week = Math.floor((today0 - w0) / (dayMs * 7)) + 1;   // 学期第几周
            if (week < 1) return null;
            var list = ttLoad();
            var best = null;
            for (var dOff = 0; dOff <= 7; dOff++) {
                var dayDate = new Date(today0.getTime() + dOff * dayMs);
                var wd = dayDate.getDay(); if (wd === 0) wd = 7;      // 周一=1…周日=7
                for (var i = 0; i < list.length; i++) {
                    var c = list[i];
                    if (c.day !== wd) continue;
                    var wk = ttParseWeeks(c.weeks);
                    if (!wk[week]) continue;
                    var at = ttTimeOn(dayDate, TT_PERIODS[(c.startSec || 1) - 1] || "08:00");
                    if (at <= now) continue;
                    if (!best || at < best.at) best = { c: c, at: at, week: week };
                }
                if (best && dOff >= 1) break;   // 已找到且今天已查完，无需再看更远
            }
            return best;
        }
        // 楼内房间解析：课表教室号 → 楼内 floorCoordinates 精确/包含匹配键
        // 仅对开放楼内导航的楼栋有意义；返回 { room: 节点名, floor: 楼层 } 或 null
        function ttResolveRoom(b, room) {
            if (!b || !b.indoor || !room || typeof floorCoordinates === "undefined") return null;
            var r = String(room).trim();
            if (!r) return null;
            for (var fl in floorCoordinates) {

        /* ---------- 课表导入解析（抽取式，容忍杂乱粘贴） ----------
           不再要求固定列顺序：无论「一行一节课」，还是教务导出的
           「课程名一行 + 星期/节次/周次/地点各自一行」的多行块，都会自动分组；
           每段用正则抽取星期/节次/周次/楼栋/教室，教师、学分、课程号、班级、备注等

        var TT_DAY_MAP = { "一": 1, "二": 2, "三": 3, "四": 4, "五": 5, "六": 6, "日": 7, "天": 7 };

        function ttBldIn(s) {

            if (pm) parity = pm[1] || pm[2];

        function ttWeeks(tok, parity) {
            tok = String(tok == null ? "" : tok).replace(/\s/g, "").replace(/^第/, "").replace(/周$/, "");
            if (!parity) return Object.keys(ttParseWeeks(tok)).length ? tok : "";

        /* =====================================================================
         * S3.2 统一 Bottom Sheet 手势体系
         * ---------------------------------------------------------------------
         * attachSheetDrag(el, grip, cfg)：所有底部面板共用同一套拖拽手势——
         *   按住把手拖动跟随（越界橡皮筋阻尼）→ 松手按速度+位置吸附到
         *   最近一档（快甩直接切上/下档）→ 吸附完成回调 onSnap 应用档位类。
         * cfg.snaps(d)：返回 [{name, ty}]（ty 为相对自然位置的 translateY px）
         * cfg.hit(t)：pointerdown 命中测试（如路线面板只认把手区域）
         * cfg.onTap：把手"点按"（未拖动）时触发；cfg.onDrag：拖动中回调
         * 嵌套关闭：Esc/返回优先关最上层浮层（房间卡 > 路线面板 > 室外导航面板）
         * ===================================================================== */
        function curTy(el) {
            var t = getComputedStyle(el).transform;
            if (!t || t === "none") return 0;
            var m = t.match(/matrix\(([^)]+)\)/);
            if (!m) return 0;
            var p = m[1].split(",").map(parseFloat);
            return p.length > 16 ? p[13] : (p.length > 6 ? p[13] : (p.length > 5 ? p[5] : 0));
        }
        function attachSheetDrag(el, grip, cfg) {
            if (!el || el.dataset.sheetDrag) return;
            el.dataset.sheetDrag = "1";
            grip = grip || el;
            var drag = null;
            grip.addEventListener("pointerdown", function (e) {
                if (e.pointerType === "mouse" && e.button !== 0) return;
                if (cfg.hit && !cfg.hit(e.target)) return;
                var rect = el.getBoundingClientRect();
                drag = {
                    y0: e.clientY, ty0: curTy(el),
                    unTop: rect.top - (curTy(el) || 0),
                    H: el.offsetHeight, moved: false,
                    vy: 0, lastY: e.clientY, lastT: e.timeStamp
                };
                el.style.transition = "none";
                try { grip.setPointerCapture(e.pointerId); } catch (err) {}
                e.preventDefault();
            });
            grip.addEventListener("pointermove", function (e) {
                if (!drag) return;
                var dy = e.clientY - drag.y0;
                if (Math.abs(dy) > 6) drag.moved = true;
                var dt = Math.max(1, e.timeStamp - drag.lastT);
                drag.vy = 0.7 * drag.vy + 0.3 * ((e.clientY - drag.lastY) / dt);
                drag.lastY = e.clientY; drag.lastT = e.timeStamp;
                var snaps = cfg.snaps(drag);
                var min = Infinity, max = -Infinity;
                snaps.forEach(function (s) { if (s.ty < min) min = s.ty; if (s.ty > max) max = s.ty; });
                var ty = drag.ty0 + dy;
                if (ty < min) ty = min + (ty - min) * 0.25;   // 越界橡皮筋
                if (ty > max) ty = max + (ty - max) * 0.25;
                el.style.transform = "translateY(" + ty + "px)";
                if (cfg.onDrag) cfg.onDrag(ty);
                e.preventDefault();
            });
            function finish(e) {
                if (!drag) return;
                var d = drag; drag = null;
                if (!d.moved && e.type === "pointerup" && cfg.onTap) { cfg.onTap(); return; }
                var snaps = cfg.snaps(d);
                var proj = d.ty0 + (e.clientY - d.y0) + d.vy * 110;   // 松手速度投影
                var best = snaps[0], bd = Infinity;
                snaps.forEach(function (s) {
                    var dd = Math.abs(s.ty - proj);
                    if (dd < bd) { bd = dd; best = s; }
                });
                if (d.vy < -0.5) best = snaps[0];                    // 快速上滑 → 最展开档
                else if (d.vy > 0.5) best = snaps[snaps.length - 1]; // 快速下滑 → 最收起档
                el.style.transition = "transform .26s cubic-bezier(.22,.9,.3,1)";
                el.style.transform = "translateY(" + best.ty + "px)";
                setTimeout(function () {
                    el.style.transition = "";
                    el.style.transform = "";
                    if (cfg.onSnap) cfg.onSnap(best.name, d);
                }, 270);
            }
            grip.addEventListener("pointerup", finish);
            grip.addEventListener("pointercancel", finish);
        }

        /* ---------------- 房间信息卡 Sheet（点地图标记弹出） ---------------- */

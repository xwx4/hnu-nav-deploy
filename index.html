<style id="floor-lock-styles">

/* floor-lock.css */
/*!
 * floor-lock.css — 楼层访问控制模块样式
 * ---------------------------------------------------------------------------
 * 只负责本模块自己生成的 DOM（.fl-* 类名），全部作用域收在 .fl-root / .fl-overlay
 * 之下，不会污染现有网站的其它元素。
 * 想换成网站主题色：只覆盖 --fl-accent 等变量，或直接改写下面的规则。
 */

:root {
  /* 变量直接别名到主应用深色主题（解析发生在计算时，跨 style 块引用有效） */
  --fl-accent: var(--primary, #3b82f6);
  --fl-accent-hover: var(--primary-hover, #2563eb);
  --fl-text: var(--text-primary, #222);
  --fl-subtle: var(--text-secondary, #777);
  --fl-border: var(--border, #d0d4da);
  --fl-danger: var(--danger, #d93025);
  --fl-success: var(--success, #1a7f37);
  --fl-radius: 8px;
  --fl-bg: var(--bg-tertiary, #fff);
}

/* ---------------------------------------------------------------- 容器 */
.fl-root {
  font-family: inherit;
  font-size: 14px;
  line-height: 1.5;
  color: var(--fl-text);
  box-sizing: border-box;
}

.fl-root *,
.fl-overlay * {
  box-sizing: border-box;
}

.fl-title {
  margin: 0 0 10px;
  font-size: 16px;
  font-weight: 600;
}

.fl-note {
  margin: 8px 0 0;
  font-size: 12px;
  color: var(--fl-subtle);
}

/* ------------------------------------------------------ 普通用户：楼层列表 */
.fl-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
}

.fl-item {
  margin: 0;
  padding: 0;
}

.fl-floor-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 8px 14px;
  font: inherit;
  font-size: 14px;
  color: inherit;
  background: var(--fl-bg);
  border: 1px solid var(--fl-border);
  border-radius: var(--fl-radius);
  cursor: pointer;
  transition: border-color 0.15s, background 0.15s, transform 0.05s;
}

.fl-floor-btn:hover {
  border-color: var(--fl-accent);
}

.fl-floor-btn:active {
  transform: translateY(1px);
}

.fl-floor-btn:focus-visible {
  outline: 2px solid var(--fl-accent);
  outline-offset: 2px;
}

.fl-floor-btn-locked {
  color: #555;
}

.fl-floor-btn .fl-badge {
  font-size: 12px;
  line-height: 1;
}

/* --------------------------------------------------------- 管理员：配置面板 */
.fl-admin-list {
  margin: 0 0 4px;
}

.fl-admin-row {
  display: flex;
  align-items: center;
  gap: 10px;
  margin: 0 0 8px;
}

.fl-admin-floor {
  flex: 0 0 auto;
  width: 52px;
  font-weight: 600;
}

.fl-admin-switch {
  flex: 0 0 auto;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-size: 13px;
  white-space: nowrap;
  cursor: pointer;
}

.fl-admin-pass {
  flex: 1 1 auto;
  min-width: 120px;
  padding: 6px 10px;
  font: inherit;
  font-size: 14px;
  color: inherit;
  border: 1px solid var(--fl-border);
  border-radius: 6px;
}

.fl-admin-pass:focus {
  border-color: var(--fl-accent);
  outline: none;
}

.fl-admin-pass:disabled {
  background: #f2f3f5;
  color: #aaa;
  cursor: not-allowed;
}

/* ------------------------------------------------------------------ 按钮 */
.fl-actions {
  display: flex;
  gap: 8px;
  margin-top: 10px;
}

.fl-btn {
  padding: 7px 16px;
  font: inherit;
  font-size: 14px;
  border: 1px solid transparent;
  border-radius: 6px;
  cursor: pointer;
  transition: background 0.15s, border-color 0.15s;
}

.fl-btn:focus-visible {
  outline: 2px solid var(--fl-accent);
  outline-offset: 2px;
}

.fl-btn-primary {
  color: #fff;
  background: var(--fl-accent);
}

.fl-btn-primary:hover {
  background: var(--fl-accent-hover);
}

.fl-btn-ghost {
  color: #555;
  background: var(--fl-bg);
  border-color: var(--fl-border);
}

.fl-btn-ghost:hover {
  border-color: var(--fl-accent);
  color: var(--fl-accent);
}

/* ------------------------------------------------------------------ 状态 */
.fl-status {
  min-height: 18px;
  margin: 8px 0 0;
  font-size: 13px;
  color: var(--fl-success);
}

.fl-status-error {
  color: var(--fl-danger);
}

/* --------------------------------------------------------- 管理员：密码门 */
.fl-gate {
  max-width: 360px;
  margin: 0 auto;
  padding: 24px 20px;
  background: var(--fl-bg);
  border: 1px solid var(--fl-border);
  border-radius: 12px;
}

.fl-gate .fl-title {
  font-size: 18px;
  text-align: center;
}

.fl-gate-input {
  width: 100%;
  margin: 0 0 10px;
  padding: 10px 12px;
  font: inherit;
  font-size: 15px;
  color: inherit;
  border: 1px solid var(--fl-border);
  border-radius: 6px;
}

.fl-gate-input:focus {
  border-color: var(--fl-accent);
  outline: none;
}

.fl-gate .fl-actions {
  justify-content: stretch;
}

.fl-gate .fl-actions .fl-btn {
  width: 100%;
}

.fl-gate-hint {
  color: var(--fl-accent);
}

/* ------------------------------------------------------- 密码输入弹窗 */
.fl-overlay {
  position: fixed;
  inset: 0;
  z-index: 2147483000;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
  background: rgba(0, 0, 0, 0.45);
}

.fl-overlay[hidden] {
  display: none;
}

.fl-dialog {
  width: min(90vw, 300px);
  padding: 20px;
  text-align: center;
  background: var(--fl-bg);
  border-radius: 10px;
  box-shadow: 0 10px 30px rgba(0, 0, 0, 0.2);
}

.fl-dialog-title {
  margin: 0 0 12px;
  font-size: 16px;
  font-weight: 600;
}

.fl-dialog input {
  width: 100%;
  padding: 9px 12px;
  font: inherit;
  font-size: 15px;
  color: inherit;
  border: 1px solid var(--fl-border);
  border-radius: 6px;
}

.fl-dialog input:focus {
  border-color: var(--fl-accent);
  outline: none;
}

.fl-dialog-msg {
  min-height: 16px;
  margin: 10px 0 0;
  font-size: 13px;
  color: var(--fl-danger);
}

.fl-dialog-actions {
  display: flex;
  gap: 8px;
  margin-top: 14px;
}

.fl-dialog-actions .fl-btn {
  flex: 1;
}


</style>
<style>

        /* ========== 深色专业主题（默认；浅色见文件末尾 prefers-color-scheme: light） ========== */
        :root {
            color-scheme: dark;
            --primary: #3b82f6; --primary-hover: #2563eb;
            --accent: #f59e0b; --success: #10b981; --danger: #ef4444;
            --bg-primary: #0f172a; --bg-secondary: #1e293b; --bg-tertiary: #334155;
            --bg-primary-rgb: 15,23,42;   /* 半透明面板基色（顶栏/浮层用） */
            --text-primary: #f1f5f9; --text-secondary: #94a3b8; --text-tertiary: #64748b;
            --border: #334155; --border-light: #475569;
            --radius-sm: 8px; --radius-md: 12px; --radius-lg: 16px;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: var(--bg-primary); color: var(--text-primary);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            overflow: hidden; height: 100vh; height: 100dvh;
        }
        /* ========== 顶部导航栏 ========== */
        .app-header {
            position: fixed; top: 0; left: 0; right: 0; z-index: 100;
            display: flex; align-items: center; gap: 12px;
            padding: 12px 16px; padding-top: calc(12px + env(safe-area-inset-top, 0px));
            background: rgba(var(--bg-primary-rgb),0.92); backdrop-filter: blur(12px);
            border-bottom: 1px solid var(--border);
        }
        .header-left { display: flex; align-items: center; gap: 8px; flex-shrink: 0; }
        .header-back {
            background: none; border: none; color: var(--primary);
            font-size: 22px; cursor: pointer; padding: 4px 8px; border-radius: var(--radius-sm);
        }
        .header-back:hover { background: var(--bg-secondary); }
        .header-title { font-size: 18px; font-weight: 700; color: var(--text-primary); white-space: nowrap; }
        .header-search-box { flex: 1; min-width: 0; }
        .header-search-box input {
            width: 100%; padding: 10px 16px; border-radius: 24px;
            background: var(--bg-secondary); border: 1px solid var(--border);
            color: var(--text-primary); font-size: 15px; outline: none;
        }
        .header-search-box input::placeholder { color: var(--text-tertiary); }
        .header-search-box input:focus { border-color: var(--primary); }
        .header-icon-btn {
            background: var(--bg-secondary); border: 1px solid var(--border);
            border-radius: 50%; width: 40px; height: 40px; font-size: 18px;
            cursor: pointer; color: var(--text-primary); flex-shrink: 0;
        }
        /* ========== 课表：下一节课悬浮卡 ========== */
        .next-class-card {
            position: fixed; top: calc(64px + env(safe-area-inset-top, 0px)); left: 12px; right: 12px;
            z-index: 85; display: flex; align-items: center; gap: 10px;
            background: var(--bg-primary); border: 1px solid var(--border);
            border-radius: var(--radius-md); padding: 10px 12px;
            box-shadow: 0 6px 20px rgba(15, 23, 42, .10);
        }
        .next-class-card .nc-icon { font-size: 20px; flex: 0 0 auto; }
        .next-class-card .nc-main { flex: 1; min-width: 0; line-height: 1.4; }
        .next-class-card .nc-main b {
            display: block; font-size: 14px; color: var(--text-primary);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .next-class-card .nc-main i {
            display: block; font-style: normal; font-size: 12px; color: var(--text-tertiary);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
        }
        .next-class-card .nc-go {
            flex: 0 0 auto; padding: 9px 16px; min-height: 44px; border-radius: var(--radius-sm);
            background: var(--primary); color: #fff; border: none; font-size: 14px; cursor: pointer;
        }
        /* ========== 课表管理弹窗 ========== */
        .tt-overlay {
            position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 99998;
            display: flex; align-items: center; justify-content: center; padding: 20px;
        }
        .tt-box {
            background: #fff; border-radius: 12px; padding: 20px; width: 100%; max-width: 460px;
            color: #0f172a; max-height: 86vh; overflow-y: auto;
        }
        .tt-box h3 { margin: 0 0 8px; font-size: 17px; color: #0f172a; }
        .tt-box .tt-hint { margin: 0 0 12px; font-size: 12px; color: #64748b; line-height: 1.6; }
        .tt-list { margin: 0 0 12px; }
        .tt-item {
            display: flex; align-items: center; gap: 8px; padding: 10px 12px;
            background: #f1f5f9; border-radius: 8px; margin-bottom: 8px; font-size: 13px; line-height: 1.5;
        }
        .tt-item .tt-info { flex: 1; min-width: 0; }
        .tt-item .tt-info b { display: block; font-size: 14px; }
        .tt-item .tt-info i { display: block; font-style: normal; color: #64748b; font-size: 12px; }
        .tt-item .tt-del {
            flex: 0 0 auto; padding: 8px 10px; min-height: 44px; background: none; border: none;
            color: #dc2626; font-size: 13px; cursor: pointer;
        }
        .tt-form { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .tt-form label { font-size: 12px; color: #334155; grid-column: span 2; margin-top: 4px; }
        .tt-form input, .tt-form select {
            width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #cfd9e5;
            border-radius: 8px; font-size: 14px; color: #0f172a; background: #fff;
        }
        .tt-form .tt-full { grid-column: span 2; }
        .tt-box textarea.tt-bulk {
            width: 100%; box-sizing: border-box; padding: 10px; border: 1px solid #cfd9e5;
            border-radius: 8px; font-size: 13px; line-height: 1.6; color: #0f172a;
            font-family: inherit; resize: vertical;
        }
        .tt-box .tt-details { margin: 12px 0 2px; border-top: 1px solid #e5eaf1; padding-top: 6px; }
        .tt-box .tt-details > summary { font-size: 13px; color: #1d4ed8; cursor: pointer; padding: 6px 0; }
        .tt-box .tt-actions { display: flex; gap: 10px; margin-top: 14px; }
        .tt-box .tt-actions button { padding: 11px; border: none; border-radius: 8px; font-size: 15px; cursor: pointer; }
        .tt-box .tt-save { flex: 1; background: var(--primary); color: #fff; }
        .tt-box .tt-cancel { padding: 11px 18px; background: #eef1f5; color: #334155; }
        /* ========== 搜索结果 ========== */
        .search-results {
            position: fixed; top: 60px; left: 0; right: 0; bottom: 0;
            background: var(--bg-primary); z-index: 90; overflow-y: auto;
            padding: 16px; padding-bottom: calc(16px + env(safe-area-inset-bottom, 0px));
        }
        .search-results.show { display: block !important; }
        .search-group { margin-bottom: 20px; }
        .search-group-title {
            font-size: 13px; color: var(--text-tertiary); margin-bottom: 8px;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .search-item {
            display: flex; align-items: center; gap: 12px; padding: 14px 16px;
            background: var(--bg-secondary); border-radius: var(--radius-md);
            margin-bottom: 8px; cursor: pointer; border: 1px solid transparent;
            transition: border-color 0.2s;
        }
        .search-item:hover { border-color: var(--primary); }
        .search-item-icon { font-size: 24px; flex-shrink: 0; }
        .search-item-info { flex: 1; min-width: 0; }
        .search-item-name { font-size: 16px; font-weight: 600; margin-bottom: 4px; }
        .search-item-sub { font-size: 13px; color: var(--text-secondary); }
        .search-item-actions { display: flex; gap: 8px; flex-shrink: 0; }
        .search-item-btn {
            padding: 8px 14px; border-radius: var(--radius-sm); font-size: 13px;
            border: none; cursor: pointer; font-weight: 500;
        }
        .search-item-btn.primary { background: var(--primary); color: #fff; }
        .search-item-btn.accent { background: var(--accent); color: #000; }
        /* ========== 视图切换 ========== */
        .view { display: none; height: 100vh; height: 100dvh; }
        .view.active { display: flex; flex-direction: column; }
        body.indoor #campusView { display: none; }
        body.indoor #indoorView { display: flex; }
        /* ========== 校园视图 ========== */
        #campusView { position: relative; }
        .amap-box {
            flex: 1; width: 100%; background: var(--bg-secondary);
            position: relative; margin-top: 60px;
        }
        .amap-nokey {
            position: absolute; inset: 0; display: flex; flex-direction: column;
            align-items: center; justify-content: center; color: var(--text-secondary);
            font-size: 15px; gap: 8px;
        }
        /* 楼栋标记：圆点 + 文字描边（无白框底），hot 高亮；低倍率仅留点 */
        #amapBox .bld-mk { position: relative; width: 0; height: 0; cursor: pointer; }
        #amapBox .bld-mk-dot {
            position: absolute; left: -5px; top: -5px; width: 10px; height: 10px;
            border-radius: 50%; background: #2563eb; border: 2px solid #fff;
            box-shadow: 0 1px 4px rgba(0,0,0,.45); box-sizing: border-box;
        }
        #amapBox .bld-mk.hot .bld-mk-dot {
            background: #dc2626; width: 12px; height: 12px; left: -6px; top: -6px;
        }
        #amapBox .bld-mk-name {
            position: absolute; left: 8px; top: -8px; font-size: 11px; font-weight: 600;
            color: #0b1220; white-space: nowrap; line-height: 16px;
            text-shadow: -1px -1px 0 #fff, 1px -1px 0 #fff, -1px 1px 0 #fff,
                         1px 1px 0 #fff, 0 0 4px #fff;
        }
        #amapBox .bld-mk.hot .bld-mk-name { font-weight: 700; color: #b91c1c; }
        #amapBox.bld-names-off .bld-mk-name { display: none; }
        #amapBox.bld-names-off .bld-mk-dot { width: 7px; height: 7px; left: -3.5px; top: -3.5px; }
        /* 底部抽屉 */
        /* 底部抽屉：peek(80px) / half(45vh) / full(86vh) 三档，手势见 S3.2 块 */
        .bottom-sheet {
            position: fixed; bottom: 0; left: 0; right: 0; z-index: 50;
            background: var(--bg-secondary); border-radius: var(--radius-lg) var(--radius-lg) 0 0;
            max-height: 86vh; transform: translateY(calc(100% - 80px));
            transition: transform 0.3s cubic-bezier(.22,.9,.3,1);
        }
        .bottom-sheet.expanded { transform: translateY(calc(100% - 45vh)); }
        .bottom-sheet.expanded.sheet-full { transform: translateY(0); }
        /* 抽屉把手 / 面板把手：视觉上仍是细条，但整条 36px 高的区域都可拖拽和点按，
           手机上不再出现「抓不住把手、拉不动」的问题 */
        .sheet-handle, .sheet-grip {
            width: 100%; height: 36px; box-sizing: border-box; margin: 0;
            display: flex; align-items: center; justify-content: center;
            background: transparent; cursor: grab; touch-action: none; flex: 0 0 auto;
        }
        .sheet-handle::before, .sheet-grip::before {
            content: ""; display: block; width: 44px; height: 5px;
            border-radius: 3px; background: var(--border-light);
        }
        .sheet-body { padding: 0 16px 16px; overflow-y: auto; max-height: calc(86vh - 40px); }
        /* 楼栋卡片 */

            padding: 16px; margin-bottom: 10px; border: 1px solid var(--border);
        }
        .bld-card.hot { border-color: var(--accent); }

        .bld-head .bld-info { flex: 1; min-width: 0; }
        .bld-thumb {
            width: 96px; height: 72px; flex: 0 0 96px;
            border-radius: 8px; border: 1px solid var(--border); background: var(--bg-secondary);
            display: flex; align-items: center; justify-content: center;
        }
        .bld-thumb svg { width: 36px; height: 36px; color: var(--primary); }
        .bld-name { font-size: 16px; font-weight: 600; margin-bottom: 6px; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .bld-desc { font-size: 13px; color: var(--text-secondary); margin-bottom: 10px; }
        .bld-actions { display: flex; gap: 8px; flex-wrap: wrap; }

            border: none; cursor: pointer; font-weight: 500;
        }
        .btn-nav { background: var(--primary); color: #fff; }
        .btn-indoor { background: var(--bg-secondary); color: var(--text-primary); border: 1px solid var(--border); }
        .btn-indoor.locked { opacity: 0.5; }
        .badge { font-size: 11px; padding: 3px 8px; border-radius: 10px; }
        .badge-on { background: var(--success); color: #fff; }
        .badge-off { background: var(--bg-secondary); color: var(--text-tertiary); }
        .bld-group-title {
            font-size: 13px; color: var(--text-tertiary); margin: 16px 0 8px;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .empty-tip { text-align: center; color: var(--text-tertiary); padding: 40px 0; }
        .hot-enter {
            width: 100%; padding: 14px; background: var(--accent); color: #000;
            border: none; border-radius: var(--radius-md); font-size: 16px;
            font-weight: 600; cursor: pointer; margin-top: 10px;
        }
        /* 选中楼栋卡片 */
        .picked-card { position: fixed; bottom: 0; left: 0; right: 0; z-index: 60; padding: 16px; }
        .picked-card:empty { display: none; }
        .picked-card .bld-card { margin-bottom: 0; }
        /* ========== 楼内视图 ========== */
        #indoorView { display: none; }
        .indoor-topbar {
            display: flex; align-items: center; gap: 12px; padding: 12px 16px;
            padding-top: calc(12px + 60px); background: var(--bg-secondary);
            border-bottom: 1px solid var(--border);
        }
        .indoor-bld-name { font-size: 16px; font-weight: 600; }
        .floor-tabs { display: flex; gap: 6px; overflow-x: auto; }
        .floor-tab {
            padding: 6px 14px; border-radius: 20px; font-size: 14px;
            background: var(--bg-tertiary); color: var(--text-secondary);
            border: 1px solid var(--border); cursor: pointer; white-space: nowrap;
        }
        .floor-tab.active { background: var(--primary); color: #fff; border-color: var(--primary); }
        /* 平面图视口：锁住浏览器手势（touch-action），避免页面抢触摸导致图片乱跑 */
        .map-viewport {
            flex: 1; position: relative; overflow: hidden;
            background: var(--bg-secondary);
            touch-action: none; overscroll-behavior: contain;
            -webkit-user-select: none; user-select: none; -webkit-touch-callout: none;
        }
        .map-transform {
            position: absolute; top: 50%; left: 50%;
            transform-origin: center center;
            will-change: transform;
        }
        .map-transform.animate { transition: transform 0.18s ease-out; }
        /* ========== 楼层切换淡入淡出动画 ========== */
        .floor-svg, #floorMap {
            transition: opacity 0.25s ease-in-out;
        }
        .floor-svg.fade-out, #floorMap.fade-out {
            opacity: 0;
        }
        .floor-svg.fade-in, #floorMap.fade-in {
            opacity: 1;
        }
        /* ========== S2.2 分层叠加：五层结构，独立显隐（.off） ========== */
        .map-layer { position: absolute; inset: 0; width: 100%; height: 100%; }
        .map-layer.off { display: none; }
        .layer-base  { z-index: 0; }
        .layer-rooms { z-index: 1; pointer-events: none; }
        .layer-poi   { z-index: 2; }
        .layer-route { z-index: 3; pointer-events: none; }
        .layer-guide { z-index: 4; pointer-events: none; }
        .layer-base img, .layer-base svg.floor-svg {
            width: 100%; height: 100%; display: block;
            user-select: none; -webkit-user-drag: none;
        }
        /* S2.1 平面图缺失/加载失败：渐变兜底占位（不静默留白） */
        .layer-base.plan-missing {
            background:
                radial-gradient(rgba(100,116,139,.20) 1px, transparent 1px) 0 0/20px 20px,
                linear-gradient(135deg, #e8eef6 0%, #cfdcea 55%, #e2eaf4 100%);
        }
        .layer-base.plan-missing::after {
            content: attr(data-missing);
            position: absolute; left: 50%; top: 50%; transform: translate(-50%,-50%);
            padding: 10px 18px; border-radius: 10px; white-space: nowrap;
            background: rgba(255,255,255,.88); color: #475569; font-size: 14px; font-weight: 600;
            border: 1px dashed rgba(100,116,139,.55); box-shadow: 0 6px 18px rgba(15,23,42,.12);
        }
        .map-anchor { pointer-events: none; }
        #routeCanvas { position: absolute; top: 0; left: 0; }
        /* ========== S2.4 房间标记：SVG 图钉 + 44pt 触控热区 ========== */
        .room-marker {
            position: absolute; width: 0; height: 0; cursor: pointer;
            pointer-events: auto; -webkit-tap-highlight-color: transparent;
            transform-origin: center center;
        }
        /* 触控热区 ≥44×44pt（视觉元素小，热区不缩水；applyMarkerScale 反向补偿后屏幕恒定） */
        .room-marker::before {
            content: ""; position: absolute; left: -22px; top: -22px;
            width: 44px; height: 44px;
        }
        .room-marker .rm-dot {
            position: absolute; left: -6px; top: -6px; width: 12px; height: 12px;
            border-radius: 50%; background: var(--accent); border: 2px solid #fff;
            box-shadow: 0 0 4px rgba(0,0,0,0.5);
            transition: transform .12s ease;
            display: none; /* S3.2a：常态不显示圆点，选中/起点时才显示图钉，避免满屏碍眼 */
        }
        .room-marker .rm-pin {
            position: absolute; left: -14px; top: -30px; width: 28px; height: 30px;
            display: none; overflow: visible;
            filter: drop-shadow(0 2px 5px rgba(0,0,0,.45));
        }
        .room-marker .rm-pin path { fill: var(--danger); stroke: #fff; stroke-width: 1.2; }
        .room-marker .rm-pin circle { fill: #fff; }
        .room-marker.is-start .rm-pin { display: block; }
        .room-marker.is-start .rm-pin path { fill: var(--success); }
        .room-marker.selected .rm-pin { display: block; }
        .room-marker.is-start .rm-dot, .room-marker.selected .rm-dot { display: none; }
        /* 选中/起点时图钉放大突出，其余标记完全隐藏（S3.2a） */
        .room-marker.is-start .rm-pin, .room-marker.selected .rm-pin { transform: scale(1.2); }
        .room-marker:active .rm-dot { transform: scale(1.3); }
        .room-marker:active .rm-pin { transform: translateY(2px); }
        .room-marker span {
            position: absolute; left: 16px; top: -8px; padding: 2px 6px;
            font-size: 12px; font-weight: 600; color: #000;
            background: rgba(255,255,255,0.95); border-radius: 4px;
            white-space: nowrap; opacity: 0; visibility: hidden;
            transition: opacity 0.15s;
        }
        .room-marker:hover span, .room-marker.selected span, .room-marker.is-start span {
            opacity: 1; visibility: visible;
        }
        /* 指示层：电梯/楼梯跨层指引徽标（DOM 渲染，文字随平面图旋自动对齐） */
        .elev-badge {
            position: absolute; transform: translate(-50%, -50%);
            padding: 4px 10px; border-radius: 14px; white-space: nowrap;
            background: rgba(245,158,11,.96); color: #1c1005;
            font-size: 12px; font-weight: 700; letter-spacing: .3px;
            border: 1.5px solid #fff; box-shadow: 0 2px 8px rgba(0,0,0,.35);
        }
        /* 楼层锁遮罩：完全遮蔽平面图/标记/路线（100% 不透明），带密码解锁入口 */
        .map-locked {
            position: absolute; inset: 0; z-index: 25; display: none;
            align-items: center; justify-content: center;
            background: var(--bg-primary); color: var(--text-primary);
            padding: 20px;
        }
        .map-locked.show { display: flex; }
        .map-locked-card {
            max-width: 320px; width: 100%;
            padding: 28px 24px;
            text-align: center;
            background: var(--bg-secondary);
            border: 1px solid var(--border);
            border-radius: 16px;
            box-shadow: 0 12px 32px rgba(0,0,0,.18);
        }
        .ml-icon { font-size: 40px; line-height: 1; margin-bottom: 12px; }
        .ml-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
        .ml-desc { font-size: 13px; color: var(--text-secondary); line-height: 1.6; margin-bottom: 18px; }
        .ml-btn {
            min-height: 44px; padding: 12px 24px;
            font: inherit; font-size: 15px; font-weight: 600;
            color: #fff; background: var(--primary);
            border: none; border-radius: 10px; cursor: pointer;
            transition: background .15s ease, transform .12s ease;
        }
        .ml-btn:hover { background: var(--primary-hover); }
        .ml-btn:active { transform: scale(.97); }
        .zoom-btns {
            position: absolute; z-index: 10;
            right: calc(16px + env(safe-area-inset-right, 0px));
            bottom: calc(100px + env(safe-area-inset-bottom, 0px));
            display: flex; flex-direction: column; gap: 8px;
        }
        .zoom-btns button {
            width: 44px; height: 44px; border-radius: 50%;
            background: var(--bg-secondary); border: 1px solid var(--border);
            color: var(--text-primary); font-size: 20px; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: transform .12s ease, background .15s ease;
        }
        .zoom-btns button:active { transform: scale(.92); background: var(--bg-tertiary); }
        /* 楼内控制栏 */
        .indoor-controls {
            position: relative;
            display: flex; align-items: center; gap: 8px; padding: 12px 16px;
            padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px));
            background: var(--bg-secondary); border-top: 1px solid var(--border);
        }
        .indoor-controls select {
            flex: 1; min-width: 0; padding: 10px 12px; border-radius: var(--radius-sm);
            background: var(--bg-tertiary); border: 1px solid var(--border);
            color: var(--text-primary); font-size: 14px; min-height: 44px;
        }
        .arrow { color: var(--text-tertiary); font-size: 18px; }
        /* 路线面板：浮在地图下缘的半屏 Sheet，自身滚动，不挤压地图高度 */
        .route-info {
            position: absolute; left: 0; right: 0; bottom: 100%; z-index: 30;
            max-height: 42vh; overflow-y: auto; -webkit-overflow-scrolling: touch;
            padding: 12px 16px; font-size: 13px; color: var(--success);
            display: none; text-align: left;
            background: var(--bg-secondary);
            border-top: 1px solid var(--border);
            border-radius: var(--radius-lg) var(--radius-lg) 0 0;
            box-shadow: 0 -10px 28px rgba(0,0,0,.28);
        }
        /* Toast */
        #campusToast {
            position: fixed; top: 70px; left: 50%; transform: translateX(-50%) translateY(-10px);
            background: var(--bg-tertiary); color: var(--text-primary);
            padding: 12px 20px; border-radius: var(--radius-md); font-size: 14px;
            opacity: 0; transition: opacity 0.2s, transform 0.2s; z-index: 200;
            border: 1px solid var(--border); pointer-events: none;
        }
        #campusToast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        /* 管理员模式 */
        body.is-admin .campus-ui, body.is-admin #indoorView { display: none !important; }
        body.is-admin #lock-bar { display: block !important; position: fixed; top: 60px; left: 0; right: 0; bottom: 0; background: var(--bg-primary); z-index: 80; padding: 20px; overflow-y: auto; }
        #admin-hint, #admin-back { position: fixed; top: 70px; right: 16px; z-index: 101; font-size: 12px; }
        #admin-hint a, #admin-back a { color: var(--primary); text-decoration: none; }
        /* floor-lock 深色主题适配：模块变量已别名到主主题，此处只保留少量补丁。
         * 本块在模块样式之后加载，同优先级靠源码顺序生效，无需 !important。 */
        .fl-root .fl-btn-ghost { background: var(--bg-secondary); border-color: var(--border); color: var(--text-secondary); }
        /* ===== 密码弹窗保持白底深字，保证对比度 ===== */
        .fl-dialog { background: #ffffff; color: #0b1220; }
        .fl-dialog * { color: #0b1220; }
        .fl-dialog .fl-dialog-title { color: #1d4ed8; font-weight: 800; }
        .fl-dialog input { background: #ffffff; color: #0b1220; font-weight: 600; }
        .fl-dialog input::placeholder { color: #94a3b8; }
        .fl-dialog .fl-dialog-msg { color: #dc2626; }
        .fl-dialog .fl-btn-primary { background: var(--primary); color: #ffffff; }
        .fl-dialog .fl-btn-ghost { background: #f1f5f9; border-color: #cbd5e1; color: #0b1220; }
        #keyModalOverlay, #keyModalOverlay h3, #keyModalOverlay p, #keyModalOverlay label,
        #keyModalOverlay input, #keyModalOverlay div { color: #0b1220 !important; }
        #keyModalOverlay h3 { color: #1d4ed8 !important; font-weight: 800 !important; }
        #keyModalOverlay label { font-weight: 600 !important; }
        #keyModalOverlay #keySaveBtn { color: #ffffff !important; }
        /* 高德地图自带的白底信息窗 / 标记文字也强制深色，避免浅字看不清 */
        .amap-info-content, .amap-info-content *, .amap-info-window, .amap-marker-label,
        .amap-lib-info-window, .amap-lib-info-window * { color: #0b1220 !important; }
        /* 房间标记气泡：白底深色字，加粗更清晰 */
        .room-marker span { color: #0b1220 !important; font-weight: 700; }

        /* ===== 楼内平面图：缩放/旋转视图（浅色图纸底，杜绝黑边） ===== */
        .map-viewport {
            background:
                radial-gradient(rgba(100,116,139,.14) 1px, transparent 1px) 0 0/22px 22px,
                linear-gradient(180deg, #eef2f8 0%, #dbe4f0 100%);
        }
        .map-transform { transform-style: flat; }
        .map-transform::after {
            content: ""; position: absolute; left: 0; top: 0; width: 100%; height: 100%;
            border-radius: 6px; pointer-events: none; z-index: 0;
            box-shadow: 0 18px 44px rgba(15,23,42,.28), 0 0 0 1px rgba(100,116,139,.45) inset;
        }
        .view-btns {
            position: absolute; z-index: 10; display: flex; flex-direction: column; gap: 8px;
            top: calc(12px + env(safe-area-inset-top, 0px));
            right: calc(16px + env(safe-area-inset-right, 0px));
        }
        .view-btns button {
            min-width: 44px; height: 44px; padding: 0 12px; border-radius: 22px;
            background: var(--bg-secondary); border: 1px solid var(--border);
            color: var(--text-primary); font-size: 15px; cursor: pointer;
            display: flex; align-items: center; justify-content: center; white-space: nowrap;
            transition: transform .12s ease, background .15s ease;
        }
        .view-btns button:active { transform: scale(.92); background: var(--bg-tertiary); }
        .view-btns button.active { background: var(--primary); border-color: var(--primary); color: #fff; }

        /* ===== 内嵌高德导航：我的位置 + 导航面板 ===== */
        .amap-myloc {
            position: absolute; z-index: 20;
            left: calc(16px + env(safe-area-inset-left, 0px));
            bottom: calc(96px + env(safe-area-inset-bottom, 0px));
            padding: 10px 14px; border-radius: 22px; border: 1px solid var(--border);
            background: var(--bg-secondary); color: var(--text-primary);
            font-size: 14px; cursor: pointer; box-shadow: 0 6px 16px rgba(0,0,0,.35);
        }
        .amap-myloc.on { background: var(--success); border-color: var(--success); color: #fff; }
        .amap-nav-panel {
            position: fixed; left: 0; right: 0; bottom: 0; z-index: 70;
            background: var(--bg-secondary); border-top: 1px solid var(--border);
            border-radius: var(--radius-lg) var(--radius-lg) 0 0;
            padding: 14px 16px calc(14px + env(safe-area-inset-bottom, 0px));
            max-height: 56vh; display: flex; flex-direction: column; gap: 10px;
            transform: translateY(120%); transition: transform .28s ease;
        }
        .amap-nav-panel.show { transform: translateY(0); }
        /* 上拉展开档：面板可长到 90vh，便于看清完整路线指引（内容超高时内部列表可滚） */
        .amap-nav-panel.tall { max-height: 90vh; }
        .amap-nav-head { display: flex; align-items: center; gap: 10px; }
        .amap-nav-title { font-size: 16px; font-weight: 700; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .amap-nav-close { background: none; border: none; color: var(--text-secondary); font-size: 24px; line-height: 1; cursor: pointer; padding: 0 4px; }
        .amap-mode-chips { display: flex; gap: 8px; }
        .amap-mode-chips button {
            flex: 1; padding: 8px 0; border-radius: var(--radius-sm); font-size: 13px;
            background: var(--bg-tertiary); border: 1px solid var(--border); color: var(--text-secondary); cursor: pointer;
        }
        .amap-mode-chips button.active { background: var(--primary); border-color: var(--primary); color: #fff; }
        /* 路线方案芯片：多方案可切换 */
        .amap-route-chips { display: flex; gap: 6px; flex-wrap: wrap; }
        .amap-route-chips button {
            flex: 1; min-width: 0; padding: 7px 6px; border-radius: 8px; text-align: center;
            background: var(--bg-tertiary); border: 1px solid var(--border); color: var(--text-primary);
            cursor: pointer; line-height: 1.35;
        }
        .amap-route-chips button b { display: block; font-size: 12px; }
        .amap-route-chips button i { display: block; font-style: normal; font-size: 11px; color: var(--text-tertiary); }
        .amap-route-chips button.active { background: var(--primary); border-color: var(--primary); color: #fff; }
        .amap-route-chips button.active i { color: rgba(255,255,255,.85); }
        /* 方案优劣对比（依据高德返回的距离/耗时自动生成） */
        .amap-route-chips button u {
            display: block; font-size: 10px; line-height: 1.3; text-decoration: none;
            color: var(--text-tertiary); opacity: .9;
        }
        .amap-route-chips button.active u { color: rgba(255,255,255,.85); }
        .amap-route-note { font-size: 12px; color: var(--text-tertiary); }
        /* 实时引导卡：突出"下一步该做什么"，随定位自动推进 */
        .amap-nav-next {
            margin-top: 8px; padding: 10px 12px; border-radius: 10px;
            background: linear-gradient(135deg, #1d4ed8, #2563eb); color: #fff;
            box-shadow: 0 4px 14px rgba(37, 99, 235, .26);
        }
        .amap-nav-next-label { font-size: 11px; opacity: .85; letter-spacing: .5px; }
        .amap-nav-next-text { font-size: 15px; font-weight: 700; line-height: 1.45; margin-top: 2px; }

        /* ========== S0.1 统一轻提示 Toast（替代 alert） ========== */
        .app-toast {
            position: fixed; left: 50%; top: calc(64px + env(safe-area-inset-top, 0px));
            transform: translateX(-50%) translateY(-8px);
            max-width: min(86vw, 420px); padding: 10px 16px;
            background: var(--bg-tertiary); color: var(--text-primary);
            border: 1px solid var(--border-light); border-radius: 10px;
            font-size: 14px; line-height: 1.5; text-align: center;
            opacity: 0; pointer-events: none; z-index: 400;
            box-shadow: 0 8px 24px rgba(0,0,0,.35);
            transition: opacity .22s ease, transform .22s ease;
        }
        .app-toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .app-toast.error { border-color: var(--danger); }
        .app-toast.success { border-color: var(--success); }

        /* ========== S0.1 可访问性：键盘焦点可见 ========== */
        :focus-visible {
            outline: 2px solid var(--primary); outline-offset: 2px;
            border-radius: 4px;
        }

        /* ========== S0.1 浅色主题（跟随系统 prefers-color-scheme） ==========
         * 只覆盖变量；所有组件统一走 var() 引用，明暗切换零组件改动。
         * 注意：楼内加密弹窗/Key 设置弹窗本身固定白底（保证可读性），不受影响。 */
        @media (prefers-color-scheme: light) {
            :root {
                color-scheme: light;
                --primary: #2563eb; --primary-hover: #1d4ed8;
                --accent: #d97706; --success: #15803d; --danger: #dc2626;
                --bg-primary: #eef2f8; --bg-secondary: #ffffff; --bg-tertiary: #e2e8f0;
                --bg-primary-rgb: 238,242,248;
                --text-primary: #0f172a; --text-secondary: #475569; --text-tertiary: #64748b;
                --border: #cbd5e1; --border-light: #e2e8f0;
            }
        }
        .amap-nav-next-meta { font-size: 12px; opacity: .9; margin-top: 4px; }
        /* 白话方位注释（括号内）视觉弱化，与高德原始描述区分开 */
        .amap-nav-next-text .nav-note,
        .amap-nav-step .nav-note { color: var(--text-secondary); font-weight: 400; }
        /* 实时定位标记：箭头形状，transform: rotate 指示行进/朝向方向（尖朝上=正北） */
        .loc-dot {
            position: relative; width: 32px; height: 32px;
            transform-origin: center center; will-change: transform;
            filter: drop-shadow(0 2px 4px rgba(0,0,0,0.3));
        }
        .loc-dot svg { width: 32px; height: 32px; display: block; }
        .loc-halo {
            position: absolute; left: 50%; top: 50%; width: 16px; height: 16px;
            margin: -8px 0 0 -8px; border-radius: 50%;
            background: rgba(37,99,235,.28); animation: locPulse 2s ease-out infinite;
        }
        @keyframes locPulse { 0% { transform: scale(.5); opacity: 1; } 100% { transform: scale(1.7); opacity: 0; } }
        .amap-myloc.tracking { border-color: #2563eb; color: #1d4ed8; background: #eff6ff; }
        .amap-start-chips { display: flex; flex-wrap: wrap; gap: 6px; }
        .amap-start-chips button {
            padding: 6px 10px; border-radius: 16px; font-size: 12px;
            background: var(--bg-tertiary); border: 1px solid var(--border); color: var(--text-secondary); cursor: pointer;
        }
        .amap-start-chips button.active { background: var(--success); border-color: var(--success); color: #fff; }
        .amap-start-tip { font-size: 12px; color: var(--text-tertiary); }
        /* 起点文字输入：输入地点名设为起点（本地楼栋优先，高德地理编码兜底） */
        .amap-start-search { display: flex; gap: 6px; margin-top: 6px; }
        .amap-start-search input {
            flex: 1; min-width: 0; padding: 7px 10px; border-radius: 16px; font-size: 12px;
            background: var(--bg-tertiary); border: 1px solid var(--border);
            color: var(--text-primary); outline: none;
        }
        .amap-start-search input::placeholder { color: var(--text-tertiary); }
        .amap-start-search input:focus { border-color: var(--primary); }
        .amap-start-search button {
            flex: 0 0 auto; padding: 7px 12px; border-radius: 16px; font-size: 12px;
            background: var(--primary); border: none; color: #fff; cursor: pointer;
        }
        .amap-start-search button:disabled { opacity: .6; }
        /* 课间高峰提示：上下课时段提醒避开教学区人流，改走校外路线 */
        .amap-peak-tip {
            font-size: 12px; line-height: 1.5; padding: 8px 10px; border-radius: 10px;
            border: 1px solid #fcd34d; background: #fffbeb; color: #92400e;
        }
        .amap-peak-tip.ok { border-color: #86efac; background: #f0fdf4; color: #166534; }
        .amap-nav-summary { font-size: 14px; color: var(--text-primary); line-height: 1.5; }
        .amap-nav-summary b { color: var(--accent); }
        .amap-nav-steps {
            flex: 1; min-height: 0; overflow-y: auto; font-size: 13px; color: var(--text-secondary);
            border-top: 1px solid var(--border); padding-top: 8px; -webkit-overflow-scrolling: touch;
        }
        .amap-nav-step { padding: 6px 0; border-bottom: 1px dashed var(--border); line-height: 1.5; display: flex; gap: 6px; align-items: baseline; }
        .amap-nav-step small { display: block; font-weight: 400; opacity: .78; font-size: 11px; margin-top: 2px; }
        .amap-nav-step i { color: var(--primary); font-style: normal; font-weight: 700; margin-right: 6px; flex: 0 0 auto; }
        .amap-nav-step span { flex: 1; }
        .amap-nav-step em { font-style: normal; color: var(--text-tertiary); font-size: 12px; flex: 0 0 auto; }
        .amap-nav-step.current { background: #eff6ff; border-radius: 6px; padding: 6px 8px; }
        .amap-nav-step.current i { color: #1d4ed8; }
        .amap-nav-steps-head { font-size: 12px; color: var(--text-tertiary); font-weight: 600; padding-bottom: 6px; position: sticky; top: 0; background: var(--bg-primary); }
        .amap-nav-actions { display: flex; gap: 8px; }
        .amap-nav-actions button { flex: 1; padding: 12px; border-radius: var(--radius-sm); font-size: 15px; font-weight: 600; border: none; cursor: pointer; }
        .amap-arrive-btn { background: var(--success); color: #fff; }
        .amap-arrive-btn.pulse { animation: amapPulse 1.4s infinite; }
        @keyframes amapPulse { 0%,100% { box-shadow: 0 0 0 0 rgba(16,185,129,.6); } 50% { box-shadow: 0 0 0 10px rgba(16,185,129,0); } }
        .amap-fallback-btn { background: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border) !important; }
        /* ===== 到达提示条（楼内导航） ===== */
        .arrival-banner {
            display: none; padding: 10px 16px; font-size: 13px; line-height: 1.6;
            color: #ecfdf5; font-weight: 600; letter-spacing: .2px;
            background: linear-gradient(90deg, #0b3b2e 0%, #10513c 60%, #0b3b2e 100%);
            border-bottom: 1px solid rgba(16,185,129,.45);
        }
        .arrival-banner.show { display: block; }
        .arrival-banner b { color: #fbbf24; }
        /* ===== 楼内导航指示层：策略/方案 chips + 逐段指引（S1.3） ===== */
        .rt-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 8px; }
        .rt-chip {
            padding: 5px 12px; border-radius: 14px; font-size: 12px; font-weight: 500;
            background: var(--bg-tertiary); border: 1px solid var(--border);
            color: var(--text-secondary); cursor: pointer; min-height: 28px;
            -webkit-tap-highlight-color: transparent;
        }
        .rt-chip.on { background: var(--primary); border-color: var(--primary); color: #fff; }
        .rt-chip:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
        .rt-chip.alt.on { background: var(--accent); border-color: var(--accent); color: #000; }
        .rt-head { font-size: 14px; font-weight: 600; color: var(--text-primary); margin-bottom: 8px; }
        .rt-steps { margin: 0 0 8px; padding-left: 20px; font-size: 13px; color: var(--text-secondary); line-height: 1.7; }
        .rt-steps li { margin-bottom: 2px; }
        .rt-steps li.cur { color: var(--text-primary); }
        .rt-steps li.cur b { color: var(--accent); margin-right: 4px; }
        .rt-warn { font-size: 13px; color: var(--text-secondary); padding: 4px 0; }
        .rt-jump {
            width: 100%; padding: 11px; border: none; border-radius: var(--radius-sm);
            background: var(--accent); color: #000; font-size: 14px; font-weight: 600; cursor: pointer;
            -webkit-tap-highlight-color: transparent; min-height: 44px;
        }
        .rt-jump:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
        .rt-jump:active { filter: brightness(.92); }
        /* ===== S2.3 下一步口播引导卡（可点读） ===== */
        .rt-next {
            display: flex; align-items: center; gap: 10px; text-align: left;
            margin: 0 0 10px; padding: 10px 12px; border-radius: 10px;
            background: linear-gradient(135deg, #1d4ed8, #2563eb); color: #fff;
            box-shadow: 0 4px 14px rgba(37,99,235,.26); cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .rt-next:active { filter: brightness(1.12); }
        .rt-next-label {
            flex: 0 0 auto; font-size: 11px; opacity: .9; letter-spacing: .5px;
            border: 1px solid rgba(255,255,255,.55); border-radius: 8px; padding: 2px 6px;
        }
        .rt-next-text { flex: 1; min-width: 0; font-size: 14px; font-weight: 700; line-height: 1.45; }
        .rt-next-speak { flex: 0 0 auto; font-size: 16px; opacity: .9; }

        /* ========== S2.4 全局触控优化 ========== */
        * { -webkit-tap-highlight-color: transparent; }
        .floor-tab { min-height: 36px; transition: transform .12s ease, background .15s ease, color .15s ease; }
        .floor-tab:active { transform: scale(.93); }
        .rt-chip { min-height: 32px; }
        .rt-chip:active { transform: scale(.94); }
        @media (prefers-reduced-motion: reduce) {
            .map-transform.animate, .room-marker .rm-dot, .floor-tab, .rt-chip,
            .zoom-btns button, .view-btns button { transition: none; }
        }

        /* =====================================================================
         * S3.2 统一 Bottom Sheet 手势体系
         * ===================================================================== */
        .sheet-grip {
            margin: 0 auto 8px;
        }
        /* 校园楼栋抽屉：peek / half / full 三档（inline 拖拽后由类接管吸附位） */
        .bottom-sheet { transition: transform .3s cubic-bezier(.22,.9,.3,1); }
        .bottom-sheet.expanded { transform: translateY(calc(100% - 45vh)); }
        .bottom-sheet.expanded.sheet-full { transform: translateY(0); }
        /* 楼内路线面板：peek 档（露出把手 + 总览 + 下一步卡） */
        .route-info {
            transition: transform .26s cubic-bezier(.22,.9,.3,1), max-height .26s ease;
            touch-action: pan-y;
        }
        .route-info.peek { max-height: 158px; transform: translateY(calc(100% - 150px)); }
        /* 路线面板收起后的"路线"浮标（点按重新展开） */
        .route-peek {
            position: absolute; right: 10px; bottom: 100%; margin-bottom: 10px;
            padding: 10px 14px; border-radius: 20px; border: none; cursor: pointer;
            background: var(--primary); color: #fff; font-size: 13px; font-weight: 600;
            box-shadow: 0 4px 12px rgba(0,0,0,.3); z-index: 31; display: none;
            -webkit-tap-highlight-color: transparent; min-height: 38px;
        }
        .route-peek.show { display: block; }
        /* 室外导航面板关闭后的「继续导航」浮标：点按重新打开面板，避免导航状态丢失找不回 */
        .amap-nav-peek {
            position: fixed; right: 12px; z-index: 60;
            bottom: calc(88px + env(safe-area-inset-bottom, 0px));
            padding: 10px 16px; border-radius: 22px; border: none; cursor: pointer;
            background: var(--primary); color: #fff; font-size: 13px; font-weight: 600;
            box-shadow: 0 4px 14px rgba(0,0,0,.32); display: none; min-height: 40px;
            -webkit-tap-highlight-color: transparent;
        }
        .amap-nav-peek.show { display: block; }
        /* 房间信息卡 Sheet（点地图标记弹出，可嵌套关闭） */
        .room-backdrop {
            position: fixed; inset: 0; z-index: 90;
            background: rgba(2,6,23,.45);
            opacity: 0; pointer-events: none; transition: opacity .22s ease;
        }
        .room-backdrop.show { opacity: 1; pointer-events: auto; }
        .room-sheet {
            position: fixed; left: 0; right: 0; bottom: 0; z-index: 95;
            background: var(--bg-secondary);
            border-radius: var(--radius-lg) var(--radius-lg) 0 0;
            border-top: 1px solid var(--border);
            padding: 12px 16px calc(16px + env(safe-area-inset-bottom, 0px));
            transform: translateY(110%);
            transition: transform .26s cubic-bezier(.22,.9,.3,1);
            box-shadow: 0 -12px 32px rgba(0,0,0,.35);
        }
        .room-sheet.show { transform: translateY(0); }
        .room-sheet-title { font-size: 17px; font-weight: 700; margin: 2px 0 4px; }
        .room-sheet-sub { font-size: 13px; color: var(--text-secondary); margin-bottom: 14px; }
        .room-sheet-actions { display: flex; gap: 8px; }
        .rs-btn {
            flex: 1; min-height: 44px; border: none; border-radius: var(--radius-sm);
            font-size: 14px; font-weight: 600; cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }
        .rs-btn:active { filter: brightness(.92); }
        .rs-start { background: var(--success); color: #fff; }
        .rs-dest { background: var(--primary); color: #fff; }
        .rs-close { background: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border); }

        /* =====================================================================
         * S3.3 Mini-map（左下角总览 + 视口框）：操作时浮现，停止后淡出
         * ===================================================================== */
        .mini-map {
            position: absolute;
            left: calc(12px + env(safe-area-inset-left, 0px));
            bottom: calc(100px + env(safe-area-inset-bottom, 0px));
            width: 120px; height: 85px; border-radius: 10px;
            border: 1px solid rgba(100,116,139,.55);
            box-shadow: 0 6px 18px rgba(15,23,42,.25);
            opacity: 0; pointer-events: none; transform: translateY(6px);
            transition: opacity .3s ease, transform .3s ease; z-index: 9;
        }
        .mini-map.on { opacity: 1; transform: translateY(0); }
        /* 搜索清空按钮 */
        .header-search-box { position: relative; }
        .search-clear {
            position: absolute; right: 8px; top: 50%; transform: translateY(-50%);
            width: 26px; height: 26px; border-radius: 50%; border: none;
            background: var(--bg-tertiary); color: var(--text-secondary);
            font-size: 15px; line-height: 1; cursor: pointer; display: none;
        }
        /* 键盘避让：软键盘弹出（visualViewport 变矮）时把底部控件顶起 */
        .indoor-controls {
            transform: translateY(calc(-1 * var(--kb, 0px)));
            transition: transform .2s ease-out;
        }
        /* 动效开关按钮状态 */
        #fxBtn.off { opacity: .55; }

        /* =====================================================================
         * S3.4 低端机降级（body.low-perf）与用户关动效（body.no-motion）
         * ===================================================================== */
        body.no-motion *, body.no-motion *::before, body.no-motion *::after {
            transition: none !important; animation: none !important;
        }
        body.low-perf .app-header, body.low-perf .room-sheet { backdrop-filter: none; }
        body.low-perf .map-transform::after { box-shadow: 0 8px 20px rgba(15,23,42,.22); }
        body.low-perf .loc-halo { animation: none; }

        /* =====================================================================
         * S3.3 小屏断点 + 横竖屏适配
         * ===================================================================== */
        @media (max-width: 380px) {
            .app-header { gap: 8px; padding-left: 10px; padding-right: 10px; }
            .header-search-box input { padding: 9px 34px 9px 12px; font-size: 14px; }
            .floor-tab { padding: 5px 10px; font-size: 13px; }
            .indoor-controls select { font-size: 13px; padding: 9px 8px; }
            .amap-myloc { padding: 8px 10px; font-size: 13px; }
            .bld-btn { padding: 10px 12px; font-size: 13px; }
        }
        @media (orientation: landscape) and (max-height: 500px) {
            .indoor-topbar { padding: 6px 12px; padding-top: calc(6px + env(safe-area-inset-top, 0px)); }
            .floor-tab { padding: 4px 10px; min-height: 30px; }
            .indoor-controls { padding: 8px 12px; padding-bottom: calc(8px + env(safe-area-inset-bottom, 0px)); gap: 6px; }
            .route-info { max-height: 58vh; }
            .zoom-btns { bottom: 76px; gap: 6px; }
            .view-btns { top: calc(8px + env(safe-area-inset-top, 0px)); gap: 6px; }
            .mini-map { display: none; }   /* 横屏小屏隐藏小地图，给路线腾视野 */
            .arrival-banner { font-size: 12px; padding: 6px 12px; }
        }
    
/* ================= S4.5 统一导航：分段条（路线面板 / 室外导航面板共用） ================= */
#uniLegStrip:empty { display: none; }
.uni-legs { display: flex; flex-direction: column; gap: 6px; margin: 8px 0 2px; }
.uni-leg { display: flex; align-items: center; gap: 8px; padding: 8px 12px; border-radius: 10px;
  background: rgba(15, 23, 42, .05); font-size: 12px; color: #334155; min-height: 44px; box-sizing: border-box; }
.uni-leg i { font-style: normal; flex: none; }
.uni-leg b { font-weight: 600; color: #0f172a; white-space: nowrap; }
.uni-leg span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.uni-leg em { font-style: normal; flex: none; color: #64748b; }
.uni-leg[data-unileg] { cursor: pointer; transition: background .15s; }
.uni-leg[data-unileg]:active { background: rgba(15, 23, 42, .1); }
.uni-leg.active { background: var(--primary, #1d4ed8); color: #fff; }
.uni-leg.active b, .uni-leg.active em { color: #fff; }
.uni-leg.done { opacity: .55; }
.uni-leg.xfer { justify-content: center; background: transparent; border: 1px dashed rgba(15, 23, 42, .28);
  color: #475569; font-size: 11px; padding: 5px 12px; min-height: 0; }
.rt-jump.uni-exit { width: 100%; margin-top: 8px; }
@media (prefers-reduced-motion: reduce) {
    .uni-leg[data-unileg] { transition: none; }
}

/* ================= S5.2 骨架屏：首屏地图 + 切层平面图（杜绝白屏） ================= */
/* 首屏：AMap 脚本加载/初始化期间，#amapNoKey 变为骨架占位 */
.amap-skeleton { align-items: stretch; justify-content: flex-start; gap: 14px; padding: 18px; }
.amap-skeleton .sk-block {
    background: linear-gradient(100deg, var(--bg-tertiary) 40%, var(--border) 50%, var(--bg-tertiary) 60%);
    background-size: 200% 100%;
    animation: skShimmer 1.3s ease-in-out infinite;
    border-radius: 10px;
}
.amap-skeleton .sk-map { width: 100%; flex: 1; min-height: 120px; }
.amap-skeleton .sk-rows { display: flex; flex-direction: column; gap: 10px; }
.amap-skeleton .sk-line { height: 14px; }
.amap-skeleton .sk-line.w60 { width: 60%; }
.amap-skeleton .sk-line.w40 { width: 40%; }
.amap-skeleton .sk-hint { font-size: 13px; color: var(--text-secondary); }
.amap-skeleton .sk-hint.dim { font-size: 12px; color: var(--text-tertiary); }
@keyframes skShimmer { 0% { background-position: 120% 0; } 100% { background-position: -80% 0; } }
body.no-motion .amap-skeleton .sk-block { animation: none; }
@media (prefers-reduced-motion: reduce) {
    .amap-skeleton .sk-block { animation: none; }
}
/* 切层：平面图异步解码期间 layerBase 显示 shimmer，位图就绪后移除 */
.layer-base { position: relative; }
.layer-base.plan-loading::after {
    content: ""; position: absolute; inset: 0; border-radius: 12px; pointer-events: none;
    background: linear-gradient(100deg, var(--bg-secondary) 40%, var(--bg-tertiary) 50%, var(--bg-secondary) 60%);
    background-size: 200% 100%; animation: skShimmer 1.3s ease-in-out infinite;
}
body.no-motion .layer-base.plan-loading::after { animation: none; }
@media (prefers-reduced-motion: reduce) {
    .layer-base.plan-loading::after { animation: none; }
}
/* 离线提示条（S5.1）：地图加载区顶部 */
.amap-offline {
    position: absolute; top: 10px; left: 50%; transform: translateX(-50%);
    z-index: 30; display: flex; align-items: center; gap: 8px;
    background: rgba(15, 23, 42, .92); color: #fde68a; border: 1px solid #b45309;
    border-radius: 999px; padding: 8px 14px; font-size: 12px; white-space: nowrap;
    max-width: calc(100% - 24px); box-shadow: 0 4px 14px rgba(0, 0, 0, .3);
}
/* ================= S5.3 埋点管理面板（?admin=1 内） ================= */
.trk-overlay { position: fixed; inset: 0; background: rgba(0, 0, 0, .45); z-index: 99997;
    display: flex; align-items: center; justify-content: center; padding: 20px; }
.trk-box { background: var(--bg-secondary); border: 1px solid var(--border); border-radius: 14px;
    padding: 18px; width: 100%; max-width: 460px; max-height: 82vh; overflow-y: auto; color: var(--text-primary); }
.trk-box h3 { margin: 0 0 4px; font-size: 17px; }
.trk-box .trk-sub { font-size: 12px; color: var(--text-tertiary); margin-bottom: 12px; }
.trk-sec { background: var(--bg-primary); border: 1px solid var(--border); border-radius: 10px;
    padding: 10px 12px; margin-bottom: 10px; }
.trk-sec b { display: block; font-size: 13px; margin-bottom: 6px; color: var(--text-secondary); }
.trk-sec .trk-line { font-size: 13px; line-height: 1.9; color: var(--text-primary); word-break: break-all; }
.trk-btns { display: flex; gap: 10px; flex-wrap: wrap; }
.trk-btns button { flex: 1; min-height: 44px; padding: 10px 14px; border: none; border-radius: 9px;
    font-size: 14px; cursor: pointer; font-weight: 500; }
.trk-btns .trk-dl { background: var(--primary); color: #fff; }
.trk-btns .trk-cp { background: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border); }
.trk-btns .trk-cl { background: transparent; color: var(--danger); border: 1px solid var(--border); }
.trk-btns .trk-x { background: var(--bg-tertiary); color: var(--text-primary); border: 1px solid var(--border); }

</style>

<body>
    <!-- 顶部导航栏（固定） -->
    <header class="app-header" id="appHeader">
        <div class="header-left">
            <button type="button" class="header-back" id="backCampus" style="display:none" aria-label="返回校园地图">←</button>
            <h1 class="header-title">湖南大学</h1>
        </div>
        <div class="header-search-box">
            <input id="bldNameInput" type="search" placeholder="搜索楼栋、办公室、设施..." aria-label="搜索楼栋、办公室、设施" autocomplete="off">
            <button type="button" id="searchClear" class="search-clear" aria-label="清空搜索">×</button>
        </div>
        <button type="button" id="bTableBtn" class="header-icon-btn" title="我的课表" aria-label="打开我的课表">📅</button>
        <button type="button" id="amapKeyBtn" class="header-icon-btn" title="设置" aria-label="打开设置">⚙</button>
    </header>

    <!-- 搜索结果面板 -->
    <div id="searchResults" class="search-results" style="display:none" role="region" aria-label="搜索结果"></div>

    <!-- 校园视图 -->
    <section id="campusView" class="view active">
        <div id="amapBox" class="amap-box">
            <!-- S5.2 首屏骨架屏：AMap 脚本加载/初始化期间的占位，杜绝白屏 -->
            <div id="amapNoKey" class="amap-nokey amap-skeleton">
                <div class="sk-block sk-map"></div>
                <div class="sk-rows">
                    <div class="sk-block sk-line w60"></div>
                    <div class="sk-block sk-line w40"></div>
                </div>
                <p class="sk-hint">📍 校园地图加载中…</p>
                <p class="sk-hint dim">如长时间空白，请点右上角 ⚙ 填入高德 Key</p>
            </div>
        </div>
        <!-- 下一节课悬浮卡：录入课表后按周次/节次自动显示最近一节课，一键触发现有导航 -->
        <div id="nextClassCard" class="next-class-card" style="display:none">

                <b id="ncName"></b>
                <i id="ncMeta"></i>
            </div>
            <button type="button" class="nc-go" id="ncGoBtn">去上课</button>
        </div>
        <div id="pickedBuilding" class="picked-card campus-ui"></div>
        <div class="bottom-sheet campus-ui" id="bottomSheet">
            <div class="sheet-handle" id="sheetHandle"></div>
            <div class="sheet-body">
                <div id="hotBuilding"></div>
                <div id="bldList"></div>
            </div>
        </div>
    </section>

    <!-- 楼内视图 -->
    <section id="indoorView" class="view">
        <div class="indoor-topbar">
            <span class="indoor-bld-name" id="indoorBldName">综合楼</span>
            <div class="floor-tabs" id="floorTabs" role="tablist" aria-label="楼层切换"></div>

                <div class="map-layer layer-base" id="layerBase">
                    <img id="floorMap" src="data:image/gif;base64,R0lGODlhAQABAAAAACH5BAEKAAEALAAAAAABAAEAAAICTAEAOw==" alt="平面图" loading="lazy" decoding="async">
                </div>
                <div class="map-layer layer-rooms" id="layerRooms" aria-hidden="true"></div>
                <div class="map-layer layer-poi map-anchor" id="mapAnchor"></div>

            </div>

      return out.slice(-LOG_MAX);
    } catch (err) {
      if (window.console && console.warn) console.warn('[floor-lock] 安全日志解析失败，已忽略：', err);
      return [];
    }
  }

  /** 追加一条密码错误记录，返回最新的日志数组 */
  function appendSecurityLog(floor) {
    var entry = { time: nowHms(), floor: String(floor), at: Date.now() };
    var logs = readSecurityLog();
    logs.push(entry);
    if (logs.length > LOG_MAX) logs = logs.slice(logs.length - LOG_MAX);   // 只留最近 10 条
    try {
      window.localStorage.setItem(LOG_KEY, JSON.stringify(logs));
    } catch (err) {
      if (window.console && console.warn) console.warn('[floor-lock] 安全日志写入失败：', err);
    }
    return logs;
  }

  /** 读日志并返回"最新在最前面"的数组（给管理员面板展示用） */
  function getSecurityLog() {
    return readSecurityLog()
      .map(function (item, index) { return { item: item, index: index }; })
      .sort(function (a, b) {
        var d = (b.item.at || 0) - (a.item.at || 0);
        return d !== 0 ? d : (b.index - a.index);
      })
      .map(function (x) { return x.item; });
  }

  function clearSecurityLog() {
    try { window.localStorage.removeItem(LOG_KEY); } catch (err) { /* 忽略 */ }
    return [];
  }

  /* ========================================================================
   * 事件广播：永远在 window 上派发，便于队友的地图代码监听
   * ====================================================================== */

  function emit(type, detail) {
    // 密码错误（wrong-password）自动记一条安全日志。放在 emit 里可覆盖所有 DENIED 分支：
    //   - askPassword 钩子自己校验并返回 false（例如走后端接口）
    //   - 模块内部比对密码失败
    // 注意：'empty-password'（配了加密却没设密码）是配置问题，不算"输错密码"，不记日志。
    if (type === EVENT_DENIED && detail && detail.reason === 'wrong-password' && detail.floor) {
      appendSecurityLog(detail.floor);
    }
    var payload = { config: getConfig() };
    for (var k in detail) {
      if (Object.prototype.hasOwnProperty.call(detail, k)) payload[k] = detail[k];
    }
    window.dispatchEvent(new CustomEvent(type, { detail: payload }));
    return payload;
  }

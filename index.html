  function ensureStyle() {
    if (document.getElementById(STYLE_ID)) return;
    var style = h('style', { attrs: { id: STYLE_ID, type: 'text/css' } });
    style.textContent = FALLBACK_CSS;
    (document.head || document.documentElement).appendChild(style);
  }

  /* ========================================================================
   * 密码输入弹窗（极简自定义 div；可用 prompt:true 退回原生 prompt）
   * ====================================================================== */

  function createDialog() {
    var state = { open: false, current: null };
    var overlay = h('div', {
      className: 'fl-overlay', attrs: { role: 'dialog', 'aria-modal': 'true' },
      props: { hidden: true }
    });
    var titleEl = h('p', { className: 'fl-dialog-title' });
    var input = h('input', {
      attrs: { type: 'password', inputmode: 'numeric', autocomplete: 'off', placeholder: '请输入密码' }
    });
    var msgEl = h('p', { className: 'fl-dialog-msg', attrs: { role: 'alert' } });
    var okBtn = h('button', { className: 'fl-btn fl-btn-primary', text: '确认', attrs: { type: 'button' } });
    var cancelBtn = h('button', { className: 'fl-btn fl-btn-ghost', text: '取消', attrs: { type: 'button' } });
    var card = h('div', { className: 'fl-dialog', children: [titleEl, input, msgEl, h('div', { className: 'fl-dialog-actions', children: [cancelBtn, okBtn] })] });
    overlay.appendChild(card);

    function finish(result) {
      if (!state.open) return;
      var resolver = state.current;
      state.open = false;
      state.current = null;
      overlay.hidden = true;
      if (overlay.parentNode) overlay.parentNode.removeChild(overlay);
      if (resolver) resolver(result);
    }

    function submit() {
      var value = input.value;
      if (value === '') { msgEl.textContent = '请输入密码'; input.focus(); return; }
      finish(value);   // 校验交给调用方，校验失败会再次 open 并显示错误
    }

    okBtn.addEventListener('click', submit);
    cancelBtn.addEventListener('click', function () { finish(null); });
    overlay.addEventListener('mousedown', function (e) { if (e.target === overlay) finish(null); });
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter') { e.preventDefault(); submit(); }
      else if (e.key === 'Escape') { e.preventDefault(); finish(null); }
    });

    return {
      open: function (floor, errorText) {
        return new Promise(function (resolve) {
          if (state.open && state.current) state.current(null);   // 关掉上一个未完成的弹窗
          state.open = true;
          state.current = resolve;
          titleEl.textContent = floor + ' 层需要密码';
          msgEl.textContent = errorText || '';
          input.value = '';
          input.type = 'password';
          overlay.hidden = false;
          document.body.appendChild(overlay);
          setTimeout(function () { input.focus(); }, 0);
        });
      },
      close: function () { finish(null); },
      showError: function (text) { msgEl.textContent = text; }
    };
  }

  /* ========================================================================
   * 控制器：渲染 + 交互
   * ====================================================================== */

  function createController(container, options) {
    var opts = options || {};
    var askPassword = isFunction(opts.askPassword) ? opts.askPassword : null;
    var onUnlock = isFunction(opts.onUnlock) ? opts.onUnlock : null;
    var useNativePrompt = !!opts.prompt;
    var rememberUnlocked = !!opts.rememberUnlocked;
    var title = opts.title === undefined ? '楼层列表' : opts.title;
    var showLockBadge = opts.showLockBadge !== false;

    var id = 'fl-' + (++instanceSeq);
    var root = h('div', { className: 'fl-root', attrs: { id: id, 'data-floor-lock': 'true' } });
    if (container.__floorLockRoot && container.__floorLockRoot.parentNode === container) {
      container.removeChild(container.__floorLockRoot);
    }
    container.appendChild(root);
    container.__floorLockRoot = root;

    var dialog = useNativePrompt ? null : createDialog();
    var unlockedSet = loadUnlocked();
    var asking = false;

    function loadUnlocked() {
      if (!rememberUnlocked) return {};
      try {
        return JSON.parse(window.sessionStorage.getItem(UNLOCK_KEY) || '{}') || {};
      } catch (err) { return {}; }
    }

    function markUnlocked(floor) {
      unlockedSet[floor] = true;
      if (rememberUnlocked) {
        try { window.sessionStorage.setItem(UNLOCK_KEY, JSON.stringify(unlockedSet)); } catch (err) { /* 忽略 */ }
      }
    }

    /* ---------------- 普通用户视图：楼层列表 ---------------- */

    function renderUser() {
      clearElement(root);
      var config = getConfig();
      var floors = Object.keys(config);

      if (title) root.appendChild(h('p', { className: 'fl-title', text: title }));

      if (!floors.length) {
        root.appendChild(h('p', { className: 'fl-note', text: '暂无可访问楼层。' }));
        return;
      }

      var list = h('ul', { className: 'fl-list' });
      floors.forEach(function (floor) {
        var entry = config[floor];
        var btn = h('button', {
          className: 'fl-floor-btn' + (entry.locked ? ' fl-floor-btn-locked' : ''),
          attrs: {
            type: 'button',
            'data-floor': floor,
            'aria-label': floor + (entry.locked ? '（需密码）' : '（可直接进入）')
          },
          children: [
            h('span', { className: 'fl-floor-label', text: floor }),
            (showLockBadge && entry.locked) ? h('span', { className: 'fl-badge', attrs: { 'aria-hidden': 'true' }, text: '🔒' }) : null
          ]
        });
        btn.addEventListener('click', function () { requestFloor(floor); });
        list.appendChild(h('li', { className: 'fl-item', children: [btn] }));
      });
      root.appendChild(list);

      if (unlockedSet && Object.keys(unlockedSet).length) {
        root.appendChild(h('p', {
          className: 'fl-note',
          text: '本次会话已解锁：' + Object.keys(unlockedSet).join('、')
        }));
      }
    }

    /* ---------------- 点击楼层：判断 + 验证 + 广播 ---------------- */

    function requestFloor(floor, source) {
      var config = getConfig();
      var entry = config[floor];

      if (!entry) {   // 配置里没有这个楼层：报错而不静默失败
        emit(EVENT_DENIED, { floor: floor, locked: false, reason: 'unknown-floor' });
        notify('未找到 ' + floor + ' 的配置，请联系管理员。', true);
        return;
      }

      if (unlockedSet[floor]) { broadcast(floor, entry, source || 'click'); return; }
      if (!entry.locked) { broadcast(floor, entry, source || 'click'); return; }

      // 需要密码
      emit(EVENT_LOCKED, { floor: floor, reason: 'password-required' });
      if (asking) { notify('请先完成当前密码输入。', true); return; }
      asking = true;

      askLoop(floor).then(function (ok) {
        asking = false;
        if (ok) {
          markUnlocked(floor);
          broadcast(floor, entry, 'password');
          notify(floor + ' 层已解锁。', false);
          if (!isAdminMode()) render();   // 刷新"本次会话已解锁"提示
        }
      }).catch(function (err) {
        asking = false;
        if (window.console && console.warn) console.warn('[floor-lock] 密码验证流程异常：', err);
      });
    }

    /** 循环询问直到密码正确或用户取消（错误信息在弹窗内就地提示，最多问 3 次） */
    function askLoop(floor) {
      var errorText = '';
      var attempts = 0;
      var MAX_ATTEMPTS = 3;
      function attempt() {
        if (attempts >= MAX_ATTEMPTS) {
          notify('密码错误次数过多，请稍后再试。', true);
          return Promise.resolve(false);
        }
        attempts++;
        return askForPassword(floor, errorText).then(function (result) {
          // 两种写法都支持：
          //   返回 boolean → 调用方自己完成了校验，直接用它的结论（false 不再重试）
          //   返回字符串   → 交给模块去比对密码
          //   返回 null/undefined → 用户取消
          if (typeof result === 'boolean') {
            if (!result) emit(EVENT_DENIED, { floor: floor, locked: true, reason: 'wrong-password' });
            return result;
          }
          if (result == null) return false;            // 用户取消
          return verify(floor, result, getConfig()[floor]).then(function (ok) {
            if (ok) return true;
            emit(EVENT_DENIED, { floor: floor, locked: true, reason: 'wrong-password' });
            errorText = '密码错误，请重试（还可尝试 ' + (MAX_ATTEMPTS - attempts) + ' 次）';
            notify(errorText, true);
            return attempt();
          });
        });
      }
      return attempt();
    }

    /**
     * 取用户输入的密码。
     * askPassword / prompt 允许返回：
     *   字符串        → 模块负责比对
     *   boolean       → 调用方已完成校验（true 放行 / false 拒绝，不再重试）
     *   null/undefined → 取消
     */
    function askForPassword(floor, errorText) {
      if (askPassword) {                       // 队友自定义弹窗 / 自定义校验
        try {
          return Promise.resolve(askPassword(floor, errorText || ''));
        } catch (err) {
          if (window.console && console.warn) console.warn('[floor-lock] askPassword 抛出异常：', err);
          return Promise.resolve(null);
        }
      }
      if (dialog) return dialog.open(floor, errorText);
      var answer = window.prompt(errorText ? errorText + '\n请输入 ' + floor + ' 层密码：' : '请输入 ' + floor + ' 层密码：');
      return Promise.resolve(answer);
    }

    /** 校验密码：sha256 用 WebCrypto，plain/明文直接比较 */
    function verify(floor, input, entry) {
      var stored = (entry && entry.password) || '';
      if (stored === '') {   // 标记加密却没设密码：视为配置错误，拒绝解锁
        emit(EVENT_DENIED, { floor: floor, locked: true, reason: 'empty-password' });
        return Promise.resolve(false);
      }
      var quick = passwordMatches(input, stored);
      if (quick !== null) return Promise.resolve(quick);
      return hashAsync(input).then(function (digest) { return digest === stored; });
    }

    /** 广播解锁结果 */
    function broadcast(floor, entry, source) {
      var detail = emit(EVENT_UNLOCKED, {
        floor: floor,
        locked: !!entry.locked,
        source: source || 'click'
      });
      if (onUnlock) {
        try { onUnlock(floor, detail); } catch (err) {
          if (window.console && console.warn) console.warn('[floor-lock] onUnlock 回调异常：', err);
        }
      }
      // 楼层公告：解锁即展示该层公告（无公告则撤掉上一条的残留）
      applyNotice(floor);
      return detail;
    }

    /* ---------------- 楼层公告条 ---------------- */

    var noticeContainerRef = opts && opts.noticeContainer ? opts.noticeContainer : null;
    var noticeState = { floor: null, text: '' };
    var noticeEl = null;
    var lastEmittedNotice = { floor: null, text: '' };

    /** 取某楼层的公告文字（没有就是空串） */
    function noticeOf(floor) {
      var entry = getConfig()[floor];
      return entry && typeof entry.notice === 'string' ? entry.notice : '';
    }

    /** 公告条该挂到哪个元素上（默认模块根节点，可由 opts.noticeContainer 指定地图容器） */
    function noticeHost() {
      var host = asElement(noticeContainerRef);
      return host || root;
    }

    /** 移除当前公告条 */
    function removeNotice() {
      if (noticeEl && noticeEl.parentNode) noticeEl.parentNode.removeChild(noticeEl);
      noticeEl = null;
      var host = noticeHost();
      if (host) host.classList.remove('fl-notice-host');
      noticeState = { floor: null, text: '' };
    }

    /**
     * 显示/更新/清除公告条。每次解锁楼层都会调用：
     * 有公告就显示，没有就把上一条撤掉（避免残留别的楼层的公告）。
     */
    function applyNotice(floor) {
      var text = noticeOf(floor);
      var host = noticeHost();
      if (!host) return null;
      if (noticeEl && noticeEl.parentNode && noticeState.floor === floor && noticeState.text === text) {
        return noticeEl;   // 内容没变，不重建
      }
      removeNotice();
      // 先记状态：即使这层没有公告，也要记住"当前楼层已无公告"，避免重复广播
      noticeState = { floor: floor, text: text };
      if (!text) return null;

      var closeBtn = h('button', {
        className: 'fl-notice-close',
        attrs: { type: 'button', 'aria-label': '关闭公告', title: '关闭公告' }
      });
      closeBtn.addEventListener('click', function () { removeNotice(); });

      var bar = h('div', {
        className: 'fl-notice',
        attrs: { role: 'status' },
        children: [
          h('span', { className: 'fl-notice-icon', attrs: { 'aria-hidden': 'true' }, text: '📢' }),
          h('span', { className: 'fl-notice-floor', text: floor }),
          h('span', { className: 'fl-notice-text', text: text }),
          closeBtn
        ]
      });
      host.classList.add('fl-notice-host');
      // 挂在容器顶部
      if (host.firstChild) host.insertBefore(bar, host.firstChild);
      else host.appendChild(bar);
      noticeEl = bar;

      // 只在内容变化时广播，避免重复 render 刷屏
      if (lastEmittedNotice.floor !== floor || lastEmittedNotice.text !== text) {
        lastEmittedNotice = { floor: floor, text: text };
        emit(EVENT_NOTICE, { floor: floor, notice: text });
      }
      return bar;
    }

    /* ---------------- 管理员视图：纯配置面板 ---------------- */

    // 渲染会重建整棵面板 DOM，所以"待恢复的状态"和"当前状态栏节点"都挂在控制器上，
    // 而不是某个闭包里——否则重建后 say() 会写进已经脱离文档的旧节点。
    var adminState = { status: '', error: false, pending: {}, gateTries: 0 };
    var adminStatusEl = null;

    /* ---------------- 管理员密码门：?admin=1 的第一道门槛 ---------------- */

    function renderAdminGate() {
      clearElement(root);
      var gate = h('div', { className: 'fl-gate' });
      gate.appendChild(h('p', { className: 'fl-title', text: '管理员模式' }));
      gate.appendChild(h('p', { className: 'fl-note', text: '此页面可修改楼层加密配置，需要验证管理员密码。' }));

      var existing = readAdminHash();
      var firstTime = !existing;
      var msg = h('p', { className: 'fl-dialog-msg', attrs: { role: 'alert' } });

      function mkInput(placeholder) {
        return h('input', {
          className: 'fl-gate-input',
          attrs: { type: 'password', autocomplete: 'new-password', placeholder: placeholder }
        });
      }

      var done = function () { adminState.gateTries = 0; markAdminSession(); renderAdmin(); };

      if (firstTime) {
        // 首次进入：强制设置管理员密码（两次一致，≥4 位）
        gate.appendChild(h('p', { className: 'fl-note fl-gate-hint', text: '首次使用：请先设置管理员密码（至少 4 位）。' }));
        var i1 = mkInput('设置管理员密码');
        var i2 = mkInput('再次输入确认');
        gate.appendChild(i1); gate.appendChild(i2);
        var okBtn = h('button', { className: 'fl-btn fl-btn-primary', text: '保存并进入', attrs: { type: 'button' } });
        okBtn.addEventListener('click', function () {
          var a = i1.value, b = i2.value;
          if (a.length < 4) { msg.textContent = '密码至少 4 位。'; i1.focus(); return; }
          if (a !== b) { msg.textContent = '两次输入不一致，请重试。'; i2.select(); return; }
          okBtn.disabled = true;
          hashAsync(a).then(function (digest) {
            if (writeAdminHash(digest)) {
              done();
            } else {
              okBtn.disabled = false;
              msg.textContent = '保存失败（浏览器存储不可用）。';
            }
          });
        });
        gate.appendChild(h('div', { className: 'fl-actions', children: [okBtn] }));
      } else {
        // 已设置：验证密码（最多 5 次）
        var pin = mkInput('输入管理员密码');
        gate.appendChild(pin);
        var goBtn = h('button', { className: 'fl-btn fl-btn-primary', text: '进入管理面板', attrs: { type: 'button' } });
        function deny() {
          adminState.gateTries++;
          if (adminState.gateTries >= 5) {
            goBtn.disabled = true; pin.disabled = true;
            msg.textContent = '错误次数过多，请关闭页面后重试。';
            return;
          }
          msg.textContent = '密码错误，还可尝试 ' + (5 - adminState.gateTries) + ' 次。';
          pin.value = ''; pin.focus();
        }
        function submitPin() {
          var v = pin.value;
          if (!v) { msg.textContent = '请输入管理员密码。'; pin.focus(); return; }
          goBtn.disabled = true;
          hashAsync(v).then(function (digest) {
            if (digest === existing) { done(); }
            else { goBtn.disabled = false; deny(); }
          });
        }
        goBtn.addEventListener('click', submitPin);
        pin.addEventListener('keydown', function (e) {
          if (e.key === 'Enter') { e.preventDefault(); submitPin(); }
        });
        gate.appendChild(h('div', { className: 'fl-actions', children: [goBtn] }));
      }

      gate.appendChild(msg);
      gate.appendChild(h('p', {
        className: 'fl-note',
        text: '管理员密码独立于各楼层密码，仅保存在本机浏览器中；忘记密码可清除浏览器的 localStorage（键 ' + ADMIN_KEY + '）重置。'
      }));
      root.appendChild(gate);
    }

    function renderAdmin() {
      clearElement(root);
      var config = getConfig();
      var floors = Object.keys(config);

      root.appendChild(h('p', { className: 'fl-title', text: '楼层密码配置（管理员模式）' }));

      var rows = {};   // floor -> { locked: checkbox, passWrap, passInput }
      var body = h('div', { className: 'fl-admin-list' });

      floors.forEach(function (floor) {
        var entry = config[floor];
        var pending = adminState.pending[floor] || {};
        var checked = pending.checked !== undefined ? pending.checked : !!entry.locked;
        var passInput = h('input', {
          className: 'fl-admin-pass',
          attrs: {
            type: 'text',                       // 非 type=password：管理员需要看清自己设的密码
            placeholder: '设置密码（留空=保持原密码）',
            autocomplete: 'off',
            'data-floor-pass': floor
          },
          props: { disabled: !checked }
        });
        if (pending.value !== undefined) passInput.value = pending.value;   // 重渲染后恢复未保存的输入
        if (entry.password && pending.value === undefined) {
          // 已存在密码时不回显明文/摘要，仅提示；留空则保留原密码
          passInput.setAttribute('placeholder', '已设置密码（留空=不修改）');
        }
        var toggle = h('input', {
          attrs: { type: 'checkbox', 'data-floor-toggle': floor },
          props: { checked: checked }
        });
        toggle.addEventListener('change', function () {
          passInput.disabled = !toggle.checked;
          adminState.pending[floor] = { checked: toggle.checked, value: passInput.value };
          if (toggle.checked) passInput.focus();
        });

        // 楼层公告输入框：解锁该层后显示在地图顶部
        var noticeInput = h('input', {
          className: 'fl-admin-notice',
          attrs: {
            type: 'text',
            placeholder: '楼层公告（解锁后显示在地图顶部，留空=无公告）',
            autocomplete: 'off',
            'data-floor-notice': floor
          }
        });
        if (pending.notice !== undefined) noticeInput.value = pending.notice;
        else if (entry.notice) noticeInput.value = entry.notice;

        var row = h('div', { className: 'fl-admin-row' });
        row.appendChild(h('span', { className: 'fl-admin-floor', text: floor }));
        row.appendChild(h('label', {
          className: 'fl-admin-switch',
          children: [toggle, h('span', { text: '是否加密' })]
        }));
        row.appendChild(passInput);
        row.appendChild(noticeInput);
        body.appendChild(row);
        rows[floor] = { toggle: toggle, passInput: passInput, noticeInput: noticeInput, existing: entry.password };
      });

      root.appendChild(body);

      var status = h('p', { className: 'fl-status' + (adminState.error ? ' fl-status-error' : ''), attrs: { role: 'status' } });
      status.textContent = adminState.status || '';
      adminStatusEl = status;   // 让 say() 始终指向当前存活的状态栏
      var saveBtn = h('button', { className: 'fl-btn fl-btn-primary', text: '保存', attrs: { type: 'button' } });
      var resetBtn = h('button', { className: 'fl-btn fl-btn-ghost', text: '恢复默认', attrs: { type: 'button' } });
      var logoutBtn = h('button', { className: 'fl-btn fl-btn-ghost', text: '退出管理员会话', attrs: { type: 'button' } });

      function say(text, isError) {
        adminState.status = text;
        adminState.error = !!isError;
        if (!adminStatusEl) return;
        adminStatusEl.textContent = text;
        adminStatusEl.className = 'fl-status' + (isError ? ' fl-status-error' : '');
      }

      function collect() {
        var next = {};
        var errors = [];
        Object.keys(rows).forEach(function (floor) {
          var row = rows[floor];
          var locked = !!row.toggle.checked;
          var typed = row.passInput.value;
          var password = row.existing;
          if (typed !== '') password = hashPassword(typed);        // 新密码（保存时异步换成 sha256）
          if (!locked) { password = ''; }                          // 关闭加密即清空密码
          else if (password === '') errors.push(floor);
          next[floor] = { locked: locked, password: password, notice: (row.noticeInput ? row.noticeInput.value : '') };
        });
        return { config: next, missing: errors, typedPasswords: rows };
      }

      saveBtn.addEventListener('click', function () {
        Object.keys(rows).forEach(function (floor) {   // 记住本次编辑，重渲染后不丢
          adminState.pending[floor] = { checked: !!rows[floor].toggle.checked, value: rows[floor].passInput.value, notice: rows[floor].noticeInput ? rows[floor].noticeInput.value : '' };
        });
        var result = collect();
        if (result.missing.length) {
          say('这些楼层已开启加密但还没有密码：' + result.missing.join('、'), true);
          return;
        }
        // 明文 -> sha256（WebCrypto 可用时），保证不把明文长期留在 localStorage
        var pending = Object.keys(rows).map(function (floor) {
          var typed = rows[floor].passInput.value;
          if (typed === '') return Promise.resolve();
          return hashAsync(typed).then(function (digest) {
            if (result.config[floor].locked) result.config[floor].password = digest;
          });
        });
        Promise.all(pending).then(function () {
          setConfig(result.config);
          adminState.pending = {};        // 已落盘，清掉草稿
          renderAdmin();                  // 重建后 adminState.status 会被自动回填到新的状态栏
          say('已保存到 localStorage（key: ' + STORAGE_KEY + '）。', false);
          emit('floor-lock-config-saved', { floorCount: Object.keys(result.config).length });
        });
      });

      resetBtn.addEventListener('click', function () {
        adminState.pending = {};
        resetConfig();
        renderAdmin();
        say('已恢复默认配置。', false);
      });

      logoutBtn.addEventListener('click', function () {
        clearAdminSession();
        adminState.status = ''; adminState.error = false; adminState.pending = {};
        renderAdminGate();
      });

      root.appendChild(h('div', { className: 'fl-actions', children: [saveBtn, resetBtn, logoutBtn] }));
      root.appendChild(status);

      /* ---- 安全日志（管理员可查看/清空）：记录密码错误尝试 ---- */
      (function renderSecurityLog() {
        var logSection = h('div', { className: 'fl-log-section' });
        var logs = getSecurityLog();
        var head = h('div', { className: 'fl-log-head' });
        var title = h('span', { className: 'fl-log-title', text: '安全日志' });
        var clearBtn = h('button', { className: 'fl-btn fl-btn-ghost fl-log-btn', text: '清空日志', attrs: { type: 'button' } });
        clearBtn.disabled = logs.length === 0;
        clearBtn.addEventListener('click', function () {
          clearSecurityLog();
          say('安全日志已清空。', false);
          renderAdmin();
        });
        head.appendChild(title);
        head.appendChild(h('span', { className: 'fl-log-count', text: logs.length ? logs.length + ' 条' : '暂无' }));
        head.appendChild(clearBtn);
        logSection.appendChild(head);

        if (!logs.length) {
          logSection.appendChild(h('p', { className: 'fl-log-empty', text: '暂无安全事件（密码错误尝试会记录在这里）。' }));
        } else {
          var list = h('div', { className: 'fl-log-list' });
          logs.slice().reverse().forEach(function (entry) {   // 倒序：最新的在最上面
            list.appendChild(h('div', { className: 'fl-log-item', children: [
              h('span', { className: 'fl-log-time', text: entry.time }),
              h('span', { className: 'fl-log-floor', text: entry.floor + ' 层' }),
              h('span', { className: 'fl-log-text', text: entry.text })
            ]}));
          });
          logSection.appendChild(list);
        }
        root.appendChild(logSection);
      })();

      root.appendChild(h('p', {
        className: 'fl-note',
        text: '提示：配置保存在本机浏览器 localStorage 的 "' + STORAGE_KEY + '" 键中；去掉网址的 ?admin=1 即回到普通用户视图。'
      }));
    }

    function notify(text, isError) {
      if (isFunction(opts.onNotify)) { opts.onNotify(text, !!isError); return; }
      if (window.console && console.log) console.log('[floor-lock] ' + text);
    }

    /* ---------------- 渲染入口 ---------------- */

    function render() {
      ensureStyle();
      if (isAdminMode()) {
        // 管理员密码门：会话内验证通过才进配置面板
        if (adminSessionOk()) renderAdmin();
        else renderAdminGate();
      }
      else renderUser();
    }

    var controller = {
      id: id,
      container: container,
      isAdmin: isAdminMode,
      /** 打开自定义密码输入弹窗，返回 Promise<string|null>（null=取消）。供宿主复用统一样式 */
      promptPassword: dialog ? function (floor, errorText) { return dialog.open(floor, errorText); } : null,
      /** 退出管理员会话：下次 ?admin=1 需重新输入管理员密码 */
      adminLogout: function () { clearAdminSession(); render(); },
      getConfig: getConfig,
      setConfig: function (cfg) { var next = setConfig(cfg); render(); return next; },
      resetConfig: function () { var cfg = resetConfig(); render(); return cfg; },
      /** 外部直接解锁某楼层（比如地图上点了某栋楼），同样会广播事件 */
      unlockFloor: function (floor, source) { requestFloor(floor, source || 'api'); },
      isUnlocked: function (floor) { return !!unlockedSet[floor]; },
      getUnlockedFloors: function () { return Object.keys(unlockedSet); },
      /** 读取楼层公告文本（无公告返回 ''） */
      noticeOf: noticeOf,
      /** 安全日志：读取 / 清空（密码错误尝试记录） */
      getSecurityLog: getSecurityLog,
      clearSecurityLog: clearSecurityLog,
      /** 统一楼层锁状态快照：每层的 locked / unlocked / available（未加密或已解锁即可用） */
      getState: function () {
        var config = getConfig();
        var floors = {};
        Object.keys(config).forEach(function (f) {
          floors[f] = {
            locked: !!config[f].locked,
            unlocked: !!unlockedSet[f],
            available: !config[f].locked || !!unlockedSet[f]
          };
        });
        return { floors: floors };
      },
      render: render,
      destroy: function () {
        if (dialog) dialog.close();
        if (root.parentNode) root.parentNode.removeChild(root);
        if (container.__floorLockRoot === root) container.__floorLockRoot = null;
        delete registry[container.id || id];
      }
    };

    render();
    return controller;
  }

  /* ========================================================================
   * 对外 API
   * ====================================================================== */

  /**
   * 初始化楼层锁。
   * @param {string|HTMLElement} containerId 容器 id（或元素本身）
   * @param {object} [options]
   *   title            {string}  列表标题，传 '' 隐藏。默认 '楼层列表'
   *   showLockBadge    {boolean} 是否显示 🔒 角标。默认 true
   *   prompt           {boolean} true=用原生 prompt 代替自定义弹窗。默认 false
   *   rememberUnlocked {boolean} true=解锁状态存 sessionStorage。默认 false（仅内存）
   *   askPassword      {function(floor, errorText):string|null|Promise} 自定义密码输入
   *   onUnlock         {function(floor, detail)} 解锁成功回调（事件之外的便捷写法）
   *   onNotify         {function(text, isError)} 自定义提示展示
   * @returns {object|null} 控制器实例（失败返回 null）
   */
  function initFloorLock(containerId, options) {
    if (typeof document === 'undefined') return null;
    var container = asElement(containerId);
    if (!container) {
      if (window.console && console.error) {
        console.error('[floor-lock] 找不到容器：', containerId, '（请在页面里准备一个 <div id="...">）');
      }
      return null;
    }
    var controller = createController(container, options);
    registry[container.id || controller.id] = controller;
    return controller;
  }

  function getFloorLock(containerId) {
    if (containerId == null) {
      var keys = Object.keys(registry);
      return keys.length ? registry[keys[0]] : null;
    }
    var el = asElement(containerId);
    return registry[(el && el.id) || containerId] || null;
  }

  /** 可选：<script src="floor-lock.js" data-floor-lock-auto="#lock-panel"> 自动初始化 */
  function autoInit() {
    if (typeof document === 'undefined') return;
    var script = document.currentScript;
    var sel = script && script.getAttribute && script.getAttribute('data-floor-lock-auto');
    if (sel) initFloorLock(sel);
  }

  if (typeof document !== 'undefined') {
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', autoInit);
    } else {
      setTimeout(autoInit, 0);
    }
  }

  return {
    initFloorLock: initFloorLock,
    getFloorLock: getFloorLock,
    // 常量与工具，供队友按需使用
    STORAGE_KEY: STORAGE_KEY,
    EVENTS: { UNLOCKED: EVENT_UNLOCKED, LOCKED: EVENT_LOCKED, DENIED: EVENT_DENIED, NOTICE: EVENT_NOTICE },
    getConfig: getConfig,
    setConfig: setConfig,
    resetConfig: resetConfig,
    isAdminMode: isAdminMode,
    adminSessionOk: adminSessionOk,
    clearAdminSession: clearAdminSession,
    normalizeConfig: normalizeConfig,
    hashPassword: hashAsync
  };
});


</script>

    { patterns: ["考研", "复习", "刷题"], terms: ["自习", "自习室", "学习"] }
];

/* =====================================================================
 * core/theme.js — 主题取色工具（S0.1）
 * ---------------------------------------------------------------------
 * 单一事实来源 = css/main.css 的 :root CSS 变量（含 prefers-color-scheme
 * 明暗双主题）。Canvas 2D 无法解析 var()，所有 JS 侧取色统一走
 * THEME.cssVar('--primary')，禁止再硬编码 #3b7ddd 之类的色值。
 * 主题切换（系统明暗切换）后调用 THEME.invalidate() 清缓存。
 * ===================================================================== */
var THEME = (function () {
    'use strict';
    var cache = {};
    function cssVar(name, fallback) {
        try {
            if (cache[name] !== undefined) return cache[name];
            var v = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
            if (v) { cache[name] = v; return v; }
        } catch (e) { /* 非浏览器环境自测时静默走 fallback */ }
        return fallback || '#3b82f6';
    }
    function invalidate() { cache = {}; }
    return { cssVar: cssVar, invalidate: invalidate };
})();

/* =====================================================================
 * ui/toast.js — 统一轻提示（S0.1，替代所有 alert）
 * ---------------------------------------------------------------------
 * 用法：
 *   Toast.show('已切换到 3F')            // 常规提示，2.6s 自动消失
 *   Toast.error('密码错误，请重试。')      // 错误提示（红色描边），3.2s
 *   Toast.success('解锁成功')             // 成功提示（绿色描边）
 * 不打断操作流（alert 会阻塞 JS 与渲染，已全部移除）。
 * 样式见 css/main.css 的 .app-toast，带 role=status + aria-live。
 * ===================================================================== */
var Toast = (function () {
    'use strict';
    var el = null, timer = 0;
    function ensure() {
        if (el && el.isConnected) return el;
        el = document.createElement('div');
        el.id = 'appToast';
        el.className = 'app-toast';
        el.setAttribute('role', 'status');
        el.setAttribute('aria-live', 'polite');
        document.body.appendChild(el);
        return el;
    }
    function show(msg, type, ms) {
        var e = ensure();
        clearTimeout(timer);
        e.textContent = String(msg);
        e.className = 'app-toast show' + (type ? ' ' + type : '');
        timer = setTimeout(function () { e.className = 'app-toast'; }, ms || 2600);
    }
    return {
        show: show,
        error:   function (m, d) { show(m, 'error',   d || 3200); },
        success: function (m, d) { show(m, 'success', d || 2200); }
    };
})();

/* =====================================================================
 * core/analytics.js — 本地埋点（S5.3，零依赖 · 不接第三方）
 * ---------------------------------------------------------------------
 * 设计：
 *   - 事件写入 localStorage 环形缓冲（key=hnuNavEvents，默认保留最近 2000 条，
 *     超限丢最旧），无网络依赖，离线可用，不上传任何数据。
 *   - 事件结构：{ t: 时间戳ISO, e: 事件名, d: 附加数据 }
 *   - 四类核心事件（阶段5需求）：
 *       search        搜索热词      { kw }            —— searchFor / 回车提交
 *       route_result  路线成功率    { ok, kind, ... }  —— 楼内/室外/统一导航
 *       floor_switch  楼层切换      { floor, locked }  —— 切层 / 锁定层视图
 *       funnel        出口漏斗      { stage }          —— campus→indoor→route→arrive
 * 对外 API（window.Track）：
 *   Track.log(event, data)      记一条
 *   Track.all()                 取全部（旧→新）
 *   Track.summary()             聚合统计（热词TopN / 成功率 / 漏斗）
 *   Track.exportText()          导出 JSON 文本（含元信息）
 *   Track.clear()               清空
 * ===================================================================== */
var Track = (function () {
    'use strict';
    var KEY = "hnuNavEvents";
    var CAP = 2000;
    var _buf = null;

    function load() {
        if (_buf) return _buf;
        try {
            var raw = localStorage.getItem(KEY);
            var arr = raw ? JSON.parse(raw) : [];
            _buf = Array.isArray(arr) ? arr : [];
        } catch (e) { _buf = []; }
        return _buf;
    }
    function save() {
        try { localStorage.setItem(KEY, JSON.stringify(_buf.slice(-CAP))); } catch (e) { /* 存储满/隐私模式：静默 */ }
    }
    function log(event, data) {
        try {
            var buf = load();
            buf.push({ t: new Date().toISOString(), e: String(event || ""), d: data || {} });
            if (buf.length > CAP) buf.splice(0, buf.length - CAP);
            save();
        } catch (e) { /* 埋点永不影响主流程 */ }
    }
    function all() { return load().slice(); }

    /* 聚合统计：给管理面板直接渲染用 */
    function summary() {
        var buf = all();
        var hot = {}, route = { ok: 0, fail: 0 }, routeFailWhy = {},
            floors = {}, funnel = { campus: 0, indoor: 0, route: 0, arrive: 0 };
        buf.forEach(function (ev) {
            var d = ev.d || {};
            if (ev.e === "search" && d.kw) {
                hot[d.kw] = (hot[d.kw] || 0) + 1;
            } else if (ev.e === "route_result") {
                if (d.ok) route.ok++; else {
                    route.fail++;
                    var why = d.reason || "unknown";
                    routeFailWhy[why] = (routeFailWhy[why] || 0) + 1;
                }
            } else if (ev.e === "floor_switch" && d.floor) {
                floors[d.floor] = (floors[d.floor] || 0) + 1;
            } else if (ev.e === "funnel" && d.stage in funnel) {
                funnel[d.stage]++;
            }
        });
        var hotArr = Object.keys(hot).map(function (k) { return { kw: k, n: hot[k] }; })
            .sort(function (a, b) { return b.n - a.n; }).slice(0, 10);
        var total = route.ok + route.fail;
        return {
            total: buf.length,
            range: buf.length ? { from: buf[0].t, to: buf[buf.length - 1].t } : null,
            hot: hotArr,
            route: { ok: route.ok, fail: route.fail, total: total,
                     rate: total ? Math.round(route.ok / total * 100) : null, failWhy: routeFailWhy },
            floors: Object.keys(floors).map(function (k) { return { floor: k, n: floors[k] }; })
                     .sort(function (a, b) { return b.n - a.n; }),
            funnel: funnel
        };
    }
    function exportText() {
        return JSON.stringify({
            exportedAt: new Date().toISOString(),
            schema: "hnu-nav-analytics/1",
            count: all().length,
            events: all()
        }, null, 2);
    }
    function clear() {
        _buf = [];
        try { localStorage.removeItem(KEY); } catch (e) { /* 忽略 */ }
    }
    return { log: log, all: all, summary: summary, exportText: exportText, clear: clear };
})();
window.Track = Track;

/* =====================================================================
 * core/coords.js — 四坐标系定义与互转（S0.2）
 * ---------------------------------------------------------------------
 * 1) LL    经纬度坐标  {lng, lat}   GCJ-02 火星坐标（与高德一致）
 * 2) FR    楼层相对坐标 {x, y}      700×500 参考平面图坐标（原点=左上角）
 * 3) World 世界坐标    {wx, wy}    平面图经缩放(s)/旋转(θ)后、相对视口中心的像素偏移
 * 4) Screen 屏幕像素   {sx, sy}    浏览器视口像素（含视口中心 + 拖拽平移 tx/ty）
 *
 * 变换链（与 app.js applyTransform 的 CSS 完全一致）：
 *   Screen = 视口中心 + (tx,ty) + R(θ)·S(s)·(FR→平面图显示像素 - 平面图中心)
 *   其中 FR→平面图显示像素 = (x/REF_W·planW, y/REF_H·planH)
 *
 * 楼栋锚点规范（FR↔LL 的桥）：
 *   每栋开放楼内导航的楼在 BUILDINGS 配置可选 anchor 字段：
 *     anchor: { floor:'1', x:222, y:454, metersPerUnit:0.1 }
 *   含义：该楼 1F 平面图上 (x,y) 这一点对应 BUILDINGS 的 lat/lng（GCJ-02）；
 *   metersPerUnit = 1 个参考像素对应多少米（0.1 → 700 纵向参考像素 ≈ 70m 楼长）。
 *   未配置 anchor 时回退：平面图中心 ↔ 楼栋 lat/lng，比例 0.1 m/像素，
 *   标注为估算值，实测校准后只需改 BUILDINGS 配置，无需动源码。
 *
 * 自测：URL 带 ?selftest 时自动跑 Coordinates.selfTest()（纯数学断言，
 * 不依赖 DOM/地图），结果同时打印到 console 并用 Toast 摘要提示。
 * ===================================================================== */
var Coordinates = (function () {
    'use strict';
    var D2R = Math.PI / 180;
    // 经纬度每米近似（WGS-84/GCJ-02 在中纬度误差可忽略）
    var M_PER_DEG_LAT = 110540;

    /* ---------- 读取 app.js 的实时视图状态（缺失时用默认值，保证可单测） ---------- */
    function liveOpt() {
        var box = (typeof document !== 'undefined') && document.getElementById('mapBox');
        var rect = box && box.getBoundingClientRect ?
            box.getBoundingClientRect() : { left: 0, top: 0, width: 800, height: 600 };
        var ms = (typeof mapState !== 'undefined') ? mapState : {};
        return {
            planW: (typeof planW !== 'undefined' && planW) || REF_W,
            planH: (typeof planH !== 'undefined' && planH) || REF_H,
            rotZ:  ms.rotZ || 0,
            scale: ms.scale || 1,
            tx:    ms.translateX || 0,
            ty:    ms.translateY || 0,
            cx:    rect.left + rect.width / 2,
            cy:    rect.top + rect.height / 2
        };
    }

    /* ---------- FR → World（缩放旋转后的世界坐标，相对视口中心） ---------- */
    function frToWorld(p, opt) {
        opt = opt || liveOpt();
        var lx = p.x / REF_W * opt.planW - opt.planW / 2;   // 平面图显示像素 → 盒中心相对
        var ly = p.y / REF_H * opt.planH - opt.planH / 2;
        var a = (opt.rotZ || 0) * D2R, c = Math.cos(a), s = Math.sin(a);
        var rx = (lx * c - ly * s) * (opt.scale || 1);      // CSS rotateZ：顺时针为正（屏幕 y 向下）
        var ry = (lx * s + ly * c) * (opt.scale || 1);
        return { wx: rx, wy: ry };
    }

    /* ---------- World → FR（worldTo 的逆变换） ---------- */
    function worldToFr(w, opt) {
        opt = opt || liveOpt();
        var sc = (opt.scale || 1);
        if (!sc) throw new Error('scale 为 0，无法反算楼层坐标');
        var a = -(opt.rotZ || 0) * D2R, c = Math.cos(a), s = Math.sin(a);
        var lx = (w.wx / sc * c - w.wy / sc * s) + opt.planW / 2;
        var ly = (w.wx / sc * s + w.wy / sc * c) + opt.planH / 2;
        return { x: lx / opt.planW * REF_W, y: ly / opt.planH * REF_H };
    }

    /* ---------- Screen 像素 ←→ FR ---------- */
    function frToScreen(p, opt) {
        opt = opt || liveOpt();
        var w = frToWorld(p, opt);
        return { sx: opt.cx + w.wx + (opt.tx || 0), sy: opt.cy + w.wy + (opt.ty || 0) };
    }
    function screenToFr(sp, opt) {
        opt = opt || liveOpt();
        return worldToFr({ wx: sp.sx - opt.cx - (opt.tx || 0), wy: sp.sy - opt.cy - (opt.ty || 0) }, opt);
    }

    /* ---------- 楼栋锚点（FR↔LL 的桥） ---------- */
    function buildingAnchor(bld) {
        var a = (bld && bld.anchor) || {};
        return {
            floor: a.floor || '1',
            x: (a.x !== undefined) ? a.x : REF_W / 2,
            y: (a.y !== undefined) ? a.y : REF_H / 2,
            lng: bld ? bld.lng : a.lng,
            lat: bld ? bld.lat : a.lat,
            metersPerUnit: a.metersPerUnit || 0.1,
            approx: !bld || !bld.anchor     // 未显式配置=估算锚点
        };
    }

    /* ---------- FR → LL（GCJ-02）。x 向东、y 向南 ---------- */
    function frToLL(p, anchor) {
        var dxm = (p.x - anchor.x) * anchor.metersPerUnit;          // 东向米
        var dym = -(p.y - anchor.y) * anchor.metersPerUnit;         // 北向米
        return {
            lng: anchor.lng + dxm / (111320 * Math.cos(anchor.lat * D2R)),
            lat: anchor.lat + dym / M_PER_DEG_LAT
        };
    }
    function llToFr(ll, anchor) {
        var dxm = (ll.lng - anchor.lng) * 111320 * Math.cos(anchor.lat * D2R);
        var dym = (ll.lat - anchor.lat) * M_PER_DEG_LAT;
        return { x: anchor.x + dxm / anchor.metersPerUnit, y: anchor.y - dym / anchor.metersPerUnit };
    }

    /* ---------- 单测：纯数学断言，不依赖 DOM ---------- */
    function selfTest() {
        var results = [], pass = 0, fail = 0;
        function ok(name, cond, detail) {
            if (cond) { pass++; results.push('PASS  ' + name); }
            else { fail++; results.push('FAIL  ' + name + (detail ? '  [' + detail + ']' : '')); }
        }
        function near(a, b, eps) { return Math.abs(a - b) <= (eps || 1e-6); }
        var base = { planW: 700, planH: 500, rotZ: 0, scale: 1, tx: 0, ty: 0, cx: 400, cy: 300 };

        // 1. 恒等往返：FR→World→FR
        var p1 = { x: 413, y: 222 };
        var w1 = frToWorld(p1, base), r1 = worldToFr(w1, base);
        ok('FR→World→FR 恒等', near(r1.x, p1.x, 1e-6) && near(r1.y, p1.y, 1e-6),
            r1.x.toFixed(4) + ',' + r1.y.toFixed(4));

        // 2. 中心不变性：旋转任意角，平面图中心的世界坐标恒为 0
        var c0 = frToWorld({ x: REF_W / 2, y: REF_H / 2 }, { planW: 700, planH: 500, rotZ: 37, scale: 2, tx: 0, ty: 0, cx: 0, cy: 0 });
        ok('旋转缩放下中心不变', near(c0.wx, 0, 1e-6) && near(c0.wy, 0, 1e-6));

        // 3. 90° 顺时针：中心右侧的点转到中心正下方（屏幕 y 向下）
        var pr = frToWorld({ x: REF_W, y: REF_H / 2 }, { planW: 700, planH: 500, rotZ: 90, scale: 1, tx: 0, ty: 0, cx: 0, cy: 0 });
        ok('90°旋转方向正确(顺时针)', near(pr.wx, 0, 1e-6) && pr.wy > 300,
            'wx=' + pr.wx.toFixed(3) + ',wy=' + pr.wy.toFixed(3));

        // 4. 缩放：s=2 时到中心距离加倍（s=1 时右边缘点距中心 350px → s=2 时 700px）
        var pd = frToWorld({ x: REF_W, y: REF_H / 2 }, { planW: 700, planH: 500, rotZ: 0, scale: 2, tx: 0, ty: 0, cx: 0, cy: 0 });
        ok('缩放距离加倍', near(pd.wx, 700, 1e-6));

        // 5. Screen 合成：视口中心 + 世界偏移 + 拖拽平移
        var ps = frToScreen({ x: 0, y: 0 }, { planW: 700, planH: 500, rotZ: 0, scale: 1, tx: 10, ty: -20, cx: 400, cy: 300 });
        ok('Screen=中心+平移+世界', near(ps.sx, 400 + 10 - 350) && near(ps.sy, 300 - 20 - 250),
            ps.sx + ',' + ps.sy);

        // 6. Screen→FR 往返（含旋转+缩放+平移）
        var opt6 = { planW: 700, planH: 500, rotZ: 25, scale: 1.6, tx: 33, ty: -47, cx: 390, cy: 310 };
        var s6 = frToScreen({ x: 285, y: 86 }, opt6), r6 = screenToFr(s6, opt6);
        ok('Screen→FR 复合往返', near(r6.x, 285, 1e-4) && near(r6.y, 86, 1e-4),
            r6.x.toFixed(5) + ',' + r6.y.toFixed(5));

        // 7. FR→LL→FR 往返（锚点在平面图中心，0.1m/像素）
        var anchor = buildingAnchor({ lng: 112.9458, lat: 28.1695 });
        ok('锚点回退=平面图中心', anchor.x === 250 && anchor.y === 350 && anchor.metersPerUnit === 0.1);
        var ll7 = frToLL({ x: 420, y: 147 }, anchor), r7 = llToFr(ll7, anchor);
        ok('FR→LL→FR 往返', near(r7.x, 420, 1e-6) && near(r7.y, 147, 1e-6),
            r7.x.toFixed(4) + ',' + r7.y.toFixed(4));

        // 8. 方向语义：东向 +x → lng 增大；北向 -y → lat 增大
        var llE = frToLL({ x: 450, y: 250 }, anchor), llW = frToLL({ x: 250, y: 250 }, anchor);
        var llN = frToLL({ x: 350, y: 150 }, anchor), llS = frToLL({ x: 350, y: 350 }, anchor);
        ok('x向东 → lng增大', llE.lng > llW.lng);
        ok('-y向北 → lat增大', llN.lat > llS.lat);

        // 9. 比例合理性：0.1 m/像素 × 700 ≈ 70m 楼长（估算值校准入口）
        ok('楼长估算≈70m', near(REF_H * anchor.metersPerUnit, 70, 1e-9));

        var summary = '坐标单测: ' + pass + ' 通过 / ' + fail + ' 失败';
        try { console.log('%c[coords.selfTest] ' + summary, 'font-weight:bold'); results.forEach(function (l) { console.log(l); }); } catch (e) {}
        return { pass: pass, fail: fail, results: results, summary: summary };
    }

    // URL 带 ?selftest 时自动运行（boot 后 300ms，避免与首屏渲染抢帧）
    if (typeof location !== 'undefined' && /[?&]selftest\b/.test(location.search)) {
        setTimeout(function () {
            var r = selfTest();
            try { if (typeof Toast !== 'undefined') Toast.show(r.summary, r.fail ? 'error' : 'success', 5000); } catch (e) {}
        }, 300);
    }

    return {
        frToWorld: frToWorld, worldToFr: worldToFr,
        frToScreen: frToScreen, screenToFr: screenToFr,
        buildingAnchor: buildingAnchor,
        frToLL: frToLL, llToFr: llToFr,
        selfTest: selfTest, liveOpt: liveOpt
    };
})();

/* =====================================================================
 * core/pathfinder.js — 楼内导航核心引擎（S1.1 路网建模 + S1.2 寻路算法）
 * ---------------------------------------------------------------------
 * 路网建模（数据全部来自 config/network.js 的实测坐标）：
 *   节点：房间/门（floorCoordinates 每条）、房间在走廊上的投影点、
 *         横廊两端点（H-R/H-L）、垂直交通节点（电梯厅/楼梯口）
 *   边：  { meters, sec, penalty, kind, accessible }
 *         kind = walk | elevator | stairs | escalator
 * 跨楼层：BUILDING_NET[bld].vertical 定义垂直交通，在节点存在的楼层间
 *         生成垂直边（电梯：waitSec + rideSecPerFloor×层数）。
 * 寻路：  A*（启发式 = 欧氏距离 + 层高×层差，对各策略均可采纳/admissible）
 * 策略：  distance 距离优先 / time 最快到达 / accessible 无障碍（轮椅
 *         自动避开楼梯）/ transfers 少换乘（每次乘坐附加米当量惩罚）
 * 多方案：最优路线 + 边惩罚重跑最多 2 次 → 2~3 条互异备选
 * 就近查询：nearest("综合楼", 起点, "厕所") 基于 ROOM_TYPES 实测标注
 * 自测：  URL 带 ?selftest 时自动跑 selfTest()（真实数据断言 + A星与Dijkstra
 *         交叉验证），console + Toast 摘要。
 * ===================================================================== */
var IndoorRouter = (function () {
    'use strict';

    /* ---------- 路网参数 ---------- */
    function netFor(bldName) {
        var n = (typeof BUILDING_NET !== 'undefined') && BUILDING_NET[bldName];
        return n || { metersPerUnit: 0.1, floorHeightM: 4.2, walkSpeed: 1.2, vertical: [] };
    }

    /* ---------- 单层图（走廊投影建模，坐标实测于真实平面图） ---------- */
    function buildFloorGraph(floor) {
        var data = floorCoordinates[floor] || {};
        var nodes = {}, adj = {};
        function addNode(id, x, y) {
            if (!nodes[id]) { nodes[id] = { x: x, y: y }; adj[id] = []; }
        }
        var HR = "H-R", HL = "H-L";
        var cor = corridorFor(floor);
        // 横廊枢纽：H-L 位于 (leftX, linkY)，H-R 位于 (rightX, horizonY)。
        // 两者衔接：F1/F2 有干净折角 H-L → H-P(linkX,linkY) → H-Q(linkX,linkYB) → H-R；
        // F3/4/5 图纸中横廊行无干净直线（门洞以弧线表达），退化为 H-L↔H-R 直连并豁免墙检。
        addNode(HR, cor.rightX, cor.horizonY);
        addNode(HL, cor.leftX, cor.linkY);
        var hasBend = !(cor.linkX === cor.rightX && cor.linkY === cor.horizonY);
        if (hasBend) {
            addNode("H-P", cor.linkX, cor.linkY);
            addNode("H-Q", cor.linkX, cor.linkYB);
            addEdge(floor, HL, "H-P");
            addEdge(floor, "H-P", "H-Q");
            addEdge(floor, "H-Q", HR);
        } else {
            addEdge(floor, HL, HR);
        }
        var rightProjs = [], leftProjs = [];
        var midX = (cor.rightX + cor.leftX) / 2;
        for (var name in data) {
            var pt = data[name];
            addNode(name, pt.x, pt.y);
            var onHorizon = Math.abs(pt.y - cor.horizonY) <= 6 &&
                            pt.x >= cor.leftX && pt.x <= cor.rightX;
            if (HALL_NAMES[name] || onHorizon) {
                // 横廊区域：直连最近横廊节点，不进入纵向链（避免生成「房间 ↔ 其他房间投影点」的非法边）
                continue;
            }
            var zone = (ZONE_OVERRIDE[floor] && ZONE_OVERRIDE[floor][name]) ||
                       (pt.x >= midX ? "R" : "L");
            var projId = (zone === "R" ? "H-R@" : "H-L@") + name;
            addNode(projId, zone === "R" ? cor.rightX : cor.leftX, pt.y);
            (zone === "R" ? rightProjs : leftProjs).push({ id: projId, y: pt.y });
            rightProjs.push(null); leftProjs.push(null);   // 占位，下面重建时剔除
        }
        // 房间 → 走廊连接边
        for (var nm in data) {
            var p = data[nm];
            var z = (ZONE_OVERRIDE[floor] && ZONE_OVERRIDE[floor][nm]) ||
                    (p.x >= midX ? "R" : "L");
            var pid = (z === "R" ? "H-R@" : "H-L@") + nm;
            if (HALL_NAMES[nm] || (Math.abs(p.y - cor.horizonY) <= 6 &&
                p.x >= cor.leftX && p.x <= cor.rightX)) {
                // 横廊区房间/大厅：连最近的横廊节点（枢纽或折角点），避免长斜线穿墙
                var best = null, bestD = Infinity;
                var hubs = hasBend ? ["H-R", "H-L", "H-P", "H-Q"] : ["H-R", "H-L"];
                for (var hi = 0; hi < hubs.length; hi++) {
                    var hn = nodes[hubs[hi]]; if (!hn) continue;
                    var dd = (hn.x - p.x) * (hn.x - p.x) + (hn.y - p.y) * (hn.y - p.y);
                    if (dd < bestD) { bestD = dd; best = hubs[hi]; }
                }
                if (best) addEdge(floor, nm, best);
            } else {
                addEdge(floor, nm, pid);
            }
        }
        // 走廊纵向链：投影点 + 横廊端点按 y 排序串联
        [{ list: rightProjs, end: "H-R", endY: cor.horizonY },
         { list: leftProjs, end: "H-L", endY: cor.linkY }].forEach(function (c) {
            var chain = [];
            c.list.forEach(function (it) { if (it) chain.push(it); });
            chain.push({ id: c.end, y: c.endY });
            chain.sort(function (a, b) { return a.y - b.y; });
            for (var i = 0; i + 1 < chain.length; i++) addEdge(floor, chain[i].id, chain[i + 1].id);
        });
        return { nodes: nodes, adj: adj };

        function addEdge(fl, a, b) {
            var n1 = nodes[a], n2 = nodes[b];
            if (!n1 || !n2 || a === b) return;
            // 墙体几何校验（兜底）：走廊内部边（双端均为 H- 走廊节点）不得穿墙；
            // H-L↔H-R 直连段豁免（F3/4/5 门洞衔接段，图纸中门洞以弧线表达、墙矩形无缺口）。
            // 房间↔投影点 / 房间↔枢纽边豁免：房间标签点常被自身墙体包围，校验会误杀。
            if (a.indexOf("H-") === 0 && b.indexOf("H-") === 0 &&
                !((a === "H-L" && b === "H-R") || (a === "H-R" && b === "H-L")) &&
                segHitsWalls(fl, n1, n2)) {
                _wallRejects[fl] = (_wallRejects[fl] || 0) + 1;
                return;
            }
            var px = Math.hypot(n1.x - n2.x, n1.y - n2.y);
            var net = netFor(currentBuilding());
            var m = px * net.metersPerUnit, s = m / net.walkSpeed;
            adj[a].push({ to: b, meters: m, sec: s, penalty: 0, kind: "walk", accessible: true, floor: fl });
            adj[b].push({ to: a, meters: m, sec: s, penalty: 0, kind: "walk", accessible: true, floor: fl });
        }
    }
    // buildFloorGraph 运行期的楼栋上下文（由 buildBuildingGraph 设置）
    var _bldCtx = null;
    // 建模期被墙体校验拒绝的走廊边计数（按层），selfTest 断言其恒为 0
    var _wallRejects = {};
    function currentBuilding() { return _bldCtx || "综合楼"; }

    /* ---------- 整楼图（含跨楼层垂直边），带缓存 ---------- */
    var _cache = {};
    function buildBuildingGraph(bldName) {
        if (_cache[bldName]) return _cache[bldName];
        _bldCtx = bldName;
        var net = netFor(bldName);
        var G = { floors: {}, nodes: {}, adj: {} };
        // 1) 各层子图，节点 id 前缀 F{层}:
        for (var fl in floorCoordinates) {
            var sub = buildFloorGraph(fl);
            G.floors[fl] = sub;
            for (var id in sub.nodes) {
                var gid = "F" + fl + ":" + id;
                G.nodes[gid] = { x: sub.nodes[id].x, y: sub.nodes[id].y, floor: fl, name: id };
                G.adj[gid] = [];
            }
            for (var from in sub.adj) {
                sub.adj[from].forEach(function (e) {
                    G.adj["F" + fl + ":" + from].push({
                        to: "F" + fl + ":" + e.to, meters: e.meters, sec: e.sec,
                        penalty: 0, kind: "walk", accessible: true, floor: fl
                    });
                });
            }
        }
        // 2) 垂直交通边（节点实测坐标存在的楼层间两两互连）
        (net.vertical || []).forEach(function (v) {
            var fls = [];
            for (var fl2 in floorCoordinates) {
                if (floorCoordinates[fl2][v.node]) fls.push(fl2);
            }
            fls.sort(function (a, b) { return Number(a) - Number(b); });
            for (var i = 0; i < fls.length; i++) {
                for (var j = 0; j < fls.length; j++) {
                    if (i === j) continue;
                    var df = Math.abs(Number(fls[i]) - Number(fls[j]));
                    var m, s, secPer = v.secPerFloor || v.rideSecPerFloor || 0;
                    if (v.kind === "stairs") {
                        m = net.floorHeightM * 1.5 * df;            // 楼梯斜向实际路径更长
                        s = (v.secPerFloor || 45) * df;
                    } else {                                         // elevator / escalator
                        m = net.floorHeightM * df;
                        s = (v.waitSec || 0) + (v.rideSecPerFloor || 6) * df;
                    }
                    var a2 = "F" + fls[i] + ":" + v.node, b2 = "F" + fls[j] + ":" + v.node;
                    G.adj[a2].push({ to: b2, meters: m, sec: s, penalty: v.transferPenalty || 0,
                        kind: v.kind, accessible: !!v.accessible, floor: fls[i], toFloor: fls[j] });
                }
            }
        });
        _bldCtx = null;
        _cache[bldName] = G;
        return G;
    }

    /* ---------- 策略：边代价 + 可采纳启发式 ---------- */
    function edgeCost(e, strategy) {
        if (strategy === "time") return e.sec;
        if (strategy === "accessible") return e.accessible ? e.sec : Infinity;
        if (strategy === "transfers") return e.meters + (e.penalty || 0);
        /* distance：垂直边加微小换乘当量，同距离时直达电梯胜过多次换乘（仅影响选路，不计入上报里程） */
        return e.meters + (e.kind === "walk" ? 0 : 1e-3);
    }
    function heuristic(G, aId, bId, net, strategy) {
        var a = G.nodes[aId], b = G.nodes[bId];
        var px = Math.hypot(a.x - b.x, a.y - b.y);
        var df = Math.abs(Number(a.floor) - Number(b.floor));
        if (strategy === "time" || strategy === "accessible") {
            return px * net.metersPerUnit / net.walkSpeed;
        }
        return px * net.metersPerUnit + net.floorHeightM * df;   // distance / transfers
    }

    /* ---------- A* 核心 ---------- */
    function astar(G, startId, goalId, strategy, net) {
        net = net || netFor(currentBuilding());
        var g = {}, prev = {}, closed = {};
        g[startId] = 0;
        var open = [startId];
        function f(id) {
            return g[id] + heuristic(G, id, goalId, net, strategy);
        }
        while (open.length) {
            var bi = 0;
            for (var i = 1; i < open.length; i++) if (f(open[i]) < f(open[bi])) bi = i;
            var cur = open.splice(bi, 1)[0];
            if (cur === goalId) break;
            if (closed[cur]) continue;
            closed[cur] = true;
            (G.adj[cur] || []).forEach(function (e) {
                var c = edgeCost(e, strategy);
                if (!isFinite(c)) return;
                var ng = g[cur] + c;
                if (g[e.to] === undefined || ng < g[e.to]) {
                    g[e.to] = ng; prev[e.to] = { from: cur, edge: e };
                    if (open.indexOf(e.to) < 0) open.push(e.to);
                }
            });
        }
        if (g[goalId] === undefined) return null;
        var path = [], at = goalId;
        while (at !== startId) { path.unshift(prev[at]); at = prev[at].from; }
        return { ids: [startId].concat(path.map(function (p) { return p.edge.to; })), edges: path.map(function (p) { return p.edge; }), cost: g[goalId] };
    }

    /* ---------- 路径 → 分段（walk 按层聚合，垂直交通独立段） ---------- */
    function toSegments(G, res) {
        var segs = [];
        var walk = null;
        for (var i = 0; i < res.edges.length; i++) {
            var e = res.edges[i], node = G.nodes[res.ids[i]];
            if (e.kind === "walk") {
                if (!walk || walk.floor !== e.floor) {
                    walk = { kind: "walk", floor: e.floor, pts: [], meters: 0, sec: 0, names: [] };
                    if (node) { walk.pts.push({ x: node.x, y: node.y }); walk.names.push(node.name); }
                    segs.push(walk);
                }
                walk.meters += e.meters; walk.sec += e.sec;
                var nx = G.nodes[res.ids[i + 1]];
                if (nx) { walk.pts.push({ x: nx.x, y: nx.y }); if (walk.names[walk.names.length - 1] !== nx.name) walk.names.push(nx.name); }
            } else {
                walk = null;
                segs.push({ kind: e.kind, floor: e.floor, toFloor: e.toFloor, node: G.nodes[res.ids[i]].name,
                            nextName: G.nodes[res.ids[i + 1]].name, meters: e.meters, sec: e.sec,
                            accessible: e.accessible,
                            at: G.nodes[res.ids[i]] });
            }
        }
        return segs;
    }

    /* ---------- 指引文本（逐段，口播式） ---------- */
    function steps(segs, goalName, curFloor) {
        var out = [];
        for (var i = 0; i < segs.length; i++) {
            var s = segs[i];
            if (s.kind === "walk") {
                var next = segs[i + 1];
                var tail = next ? "至『" + next.node + "』" : "到达『" + goalName + "』";
                out.push({ floor: s.floor, kind: "walk", text: "沿走廊前行 " + Math.round(s.meters) + " 米" + tail });
            } else if (s.kind === "elevator") {
                out.push({ floor: s.floor, kind: "elevator",
                    text: "乘电梯" + (Number(s.toFloor) > Number(s.floor) ? "上" : "下") + "至 " + s.toFloor + " 层（约 " + Math.round(s.sec) + " 秒）" });
            } else if (s.kind === "stairs") {
                out.push({ floor: s.floor, kind: "stairs",
                    text: "走楼梯" + (Number(s.toFloor) > Number(s.floor) ? "上" : "下") + "至 " + s.toFloor + " 层（约 " + Math.round(s.sec) + " 秒）" });
            }
        }
        if (!out.length && segs.length) out.push({ floor: segs[0].floor, kind: "walk", text: "到达『" + goalName + "』" });
        return out;
    }

    /* ---------- 对外主入口：单次寻路 ---------- */
    function route(bldName, start, goal, opts) {
        opts = opts || {};
        var strategy = opts.strategy || "distance";
        var G = buildBuildingGraph(bldName);
        var sId = "F" + start.floor + ":" + start.node;
        var gId = "F" + goal.floor + ":" + goal.node;
        if (!G.nodes[sId]) return { error: "missing_start" };
        if (!G.nodes[gId]) return { error: "missing_goal" };
        if (sId === gId) return { error: "same" };
        var net = netFor(bldName);
        var res = astar(G, sId, gId, strategy, net);
        if (!res) return { error: "no_path" };
        var segs = toSegments(G, res);
        var meters = 0, sec = 0, transfers = 0;
        res.edges.forEach(function (e) { meters += e.meters; sec += e.sec; if (e.kind !== "walk") transfers++; });
        return {
            strategy: strategy, ids: res.ids, segments: segs,
            meters: meters, sec: sec, transfers: transfers,
            steps: steps(segs, goal.node, opts.curFloor),
            sig: res.ids.join("|")
        };
    }

    /* ---------- 多方案：最优 + 边惩罚重跑（≤3 条，互异） ---------- */
    function inflate(G, ids, mul, add) {
        var used = {};
        for (var i = 0; i + 1 < ids.length; i++) { used[ids[i] + ">" + ids[i + 1]] = 1; used[ids[i + 1] + ">" + ids[i]] = 1; }
        var G2 = { floors: G.floors, nodes: G.nodes, adj: {} };
        for (var id in G.adj) {
            G2.adj[id] = G.adj[id].map(function (e) {
                return used[id + ">" + e.to] ? Object.assign({}, e, { meters: e.meters * mul + add, sec: e.sec * mul + add / 1.2 })
                                             : e;
            });
        }
        return G2;
    }
    function alternatives(bldName, start, goal, opts) {
        var first = route(bldName, start, goal, opts);
        if (first.error) return first;
        var alts = [first];
        var G = buildBuildingGraph(bldName);
        var net = netFor(bldName);
        var Gi = inflate(G, first.ids, 1.7, 30);
        var sigs = {}; sigs[first.sig] = 1;
        for (var k = 0; k < 2; k++) {
            var strategy = (opts && opts.strategy) || "distance";
            var r = astar(Gi, "F" + start.floor + ":" + start.node, "F" + goal.floor + ":" + goal.node, strategy, net);
            if (!r) break;
            /* r.edges 是膨胀副本；按原始图 G 逐对取回真实边，再算里程/分段/指引 */
            var origEdges = [];
            for (var i = 0; i + 1 < r.ids.length; i++) {
                var cand = (G.adj[r.ids[i]] || []).filter(function (e) { return e.to === r.ids[i + 1]; });
                var ik = r.edges[i].kind;
                origEdges.push(cand.filter(function (e) { return e.kind === ik; })[0] || cand[0]);
            }
            var segs = toSegments(G, { ids: r.ids, edges: origEdges });
            var meters = 0, sec = 0, transfers = 0;
            origEdges.forEach(function (e) { meters += e.meters; sec += e.sec; if (e.kind !== "walk") transfers++; });
            var item = { strategy: strategy, ids: r.ids, segments: segs, meters: meters, sec: sec,
                transfers: transfers, steps: steps(segs, goal.node, opts && opts.curFloor), sig: r.ids.join("|") };
            if (sigs[item.sig]) break;
            sigs[item.sig] = 1; alts.push(item);
            Gi = inflate(G, r.ids, 1.7, 30);
        }
        return alts;
    }

    /* ---------- 就近设施（基于 ROOM_TYPES 实测标注） ---------- */
    function nearest(bldName, from, type) {
        var found = [];
        for (var fl in (typeof ROOM_TYPES !== "undefined" ? ROOM_TYPES : {})) {
            var rooms = ROOM_TYPES[fl];
            for (var nm in rooms) {
                if (rooms[nm].indexOf(type) >= 0 || type.indexOf(rooms[nm]) >= 0) {
                    found.push({ floor: fl, node: nm });
                }
            }
        }
        if (!found.length) return null;
        var best = null;
        found.forEach(function (c) {
            var r = route(bldName, from, c, { strategy: "distance" });
            if (!r.error && (!best || r.meters < best.meters)) {
                best = { floor: c.floor, node: c.node, meters: r.meters, sec: r.sec };
            }
        });
        return best;
    }

    /* ---------- 单测（真实数据断言 + A星与Dijkstra 交叉验证） ---------- */
    function selfTest() {
        var results = [], pass = 0, fail = 0;
        function ok(name, cond, detail) {
            if (cond) { pass++; results.push("PASS  " + name); }
            else { fail++; results.push("FAIL  " + name + (detail ? "  [" + detail + "]" : "")); }
        }
        var S = { floor: "1", node: "门厅" }, G5 = { floor: "5", node: "501" };

        // 1. 跨楼层：1F门厅 → 5F501，必经电梯
        var r1 = route("综合楼", S, G5, { strategy: "distance" });
        ok("跨楼层可达(1F门厅→5F501)", !r1.error, r1.error || "");
        var hasElev = !r1.error && r1.segments.some(function (s) { return s.kind === "elevator" && s.floor === "1" && s.toFloor === "5"; });
        ok("垂直段为电梯(1→5)", !!hasElev);
        ok("逐段指引≥3条", !r1.error && r1.steps.length >= 3, r1.error || r1.steps.length);

        // 2. 同层：1F 101 → 115，纯步行
        var r2 = route("综合楼", { floor: "1", node: "101" }, { floor: "1", node: "115" }, { strategy: "distance" });
        var pureWalk = !r2.error && r2.segments.every(function (s) { return s.kind === "walk"; });
        ok("同层纯步行(101→115)", !!pureWalk, r2.error || "");

        // 3. A* 与 Dijkstra 交叉验证（distance 策略代价一致）
        var G = buildBuildingGraph("综合楼");
        var dj = (function dijkstra(g, s, t) {
            var dist = {}, done = {}; dist[s] = 0;
            while (true) {
                var cur = null, best = Infinity;
                for (var id in dist) if (!done[id] && dist[id] < best) { best = dist[id]; cur = id; }
                if (cur === null || cur === t) break;
                done[cur] = true;
                (g.adj[cur] || []).forEach(function (e) {
                    if (!isFinite(e.meters)) return;
                    var nd = best + e.meters;
                    if (dist[e.to] === undefined || nd < dist[e.to]) dist[e.to] = nd;
                });
            }
            return dist[t];
        })(G, "F1:门厅", "F5:501");
        ok("A*=Dijkstra交叉验证", !r1.error && Math.abs(r1.meters - dj) < 1e-6, r1.error || (r1.meters + " vs " + dj));

        // 4. 四策略均可出解；无障碍=时间（当前垂直交通仅电梯）
        var rT = route("综合楼", S, G5, { strategy: "time" });
        var rA = route("综合楼", S, G5, { strategy: "accessible" });
        var rX = route("综合楼", S, G5, { strategy: "transfers" });
        ok("时间策略出解", !rT.error, rT.error || "");
        ok("无障碍策略出解", !rA.error, rA.error || "");
        ok("少换乘策略出解且≥距离策略", !rX.error && rX.meters >= r1.meters - 1e-6, rX.error || "");

        // 5. 多方案：2~3 条互异，全部可达
        var alts = alternatives("综合楼", S, G5, { strategy: "distance" });
        ok("多方案1~3条", !alts.error && alts.length >= 1 && alts.length <= 3, alts.error || alts.length);
        ok("方案互异", !alts.error && alts.every(function (a, i) { return alts.findIndex(function (b) { return b.sig === a.sig; }) === i; }));
        ok("方案均到达终点", !alts.error && alts.every(function (a) { return a.ids[a.ids.length - 1] === "F5:501"; }));

        // 6. 兜底：缺坐标 → 明确 error，不静默
        var r6 = route("综合楼", S, { floor: "1", node: "999" }, {});
        ok("缺坐标返回missing_goal", r6.error === "missing_goal");
        var r7 = route("综合楼", S, S, {});
        ok("起终点相同返回same", r7.error === "same");

        // 7. 就近查询：无标注 → null（明确提示由上层给出）
        ok("就近查询无标注返回null", nearest("综合楼", S, "厕所") === null);

        /* 8. 路径不穿墙校验：每条 walk 边必须满足走廊投影建模规则，从数据层面保证不穿墙。
           合法边类型：
           a) 房间 ↔ 该房间的走廊投影点（如 101 ↔ H-R@101）
           b) 走廊投影点 ↔ 同侧走廊投影点 / 横廊节点（沿纵廊）
           c) 横廊节点互连（H-R/H-L/H-P/H-Q，沿横廊或折角衔接段）
           d) 横廊区房间（门厅/电梯厅/onHorizon）↔ 横廊节点
           其它组合（房间↔房间、房间↔非自身投影点、异侧投影点↔投影点等）均为穿墙。 */
        function _projSide(id) { return id.slice(0, 3); }        // "H-R@" → "H-R"
        function _projRoom(id) { return id.slice(4); }
        function _isProj(id)   { return id.indexOf("H-R@") === 0 || id.indexOf("H-L@") === 0; }
        function _isHub(id)    { return id === "H-R" || id === "H-L" || id === "H-P" || id === "H-Q"; }
        function _isRoom(id)   { return !_isProj(id) && !_isHub(id); }
        function _isOnHorizonCorridor(name, floor) {
            if (HALL_NAMES[name]) return true;
            var pt = (floorCoordinates[floor] || {})[name];
            if (!pt) return false;
            var cor = corridorFor(floor);
            return Math.abs(pt.y - cor.horizonY) <= 6 &&
                   pt.x >= cor.leftX && pt.x <= cor.rightX;
        }
        function isWalkEdgeLegal(aId, bId, floor) {
            var aP = _isProj(aId), bP = _isProj(bId);
            var aH = _isHub(aId),  bH = _isHub(bId);
            var aR = _isRoom(aId), bR = _isRoom(bId);
            // 房间 ↔ 房间：仅当两端都在横廊上（沿横廊）才算合法，否则必穿墙
            if (aR && bR) return _isOnHorizonCorridor(aId, floor) && _isOnHorizonCorridor(bId, floor);
            // 房间 ↔ 投影点：投影点必须属于该房间
            if (aR && bP) return _projRoom(bId) === aId;
            if (bR && aP) return _projRoom(aId) === bId;
            // 房间 ↔ 横廊端点：房间必须在横廊上

                if (l.kind === "outdoor" && l.routes && l.routes[0]) m += l.routes[0].dist || 0;
            });
            return m;
        }
        function uniUpdatePanel(leg) {
            var strip = document.getElementById("uniLegStrip");
            if (strip) { strip.innerHTML = uniLegStripHTML(); bindUniLegStrip(strip); }
            var s = document.getElementById("amapNavSummary");
            if (s && uniRoute) {
                var cur = uniRoute.legs[uniRoute.idx];
                var nm = cur ? (cur.kind === "outdoor" ? "室外步行" : "楼内 " + cur.bld) : "";
                s.innerHTML = "统一导航 · 全程约 <b>" + fmtDist(uniTotals()) + "</b> · 第 " +
                    (uniRoute.idx + 1) + "/" + uniRoute.legs.length + " 段（" + nm + "）";
            }
        }
        function bindUniLegStrip(root) {
            if (!root) return;
            root.querySelectorAll("[data-unileg]").forEach(function (el) {
                el.addEventListener("click", function () {
                    renderUniLeg(Number(el.getAttribute("data-unileg")));

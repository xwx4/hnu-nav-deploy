        /* ---------------- 室外导航面板手势（面板为动态创建，惰性挂手势） ---------------- */
        /* 导航面板：上拉=长到 90vh 看完整指引，下拉=收半屏或关闭，轻点把手=半屏/全屏切换。
           早前只吸附「完全展开/关闭」两档，且把手只有 42×5px，手机上一拉不动也抓不住。 */
        function attachNavPanelSheet() {
            var np = document.getElementById("amapNavPanel");
            if (!np || np.dataset.sheetDrag) return;
            np.dataset.sheetDrag = "1";
            var grip = np.querySelector(".sheet-grip") || np;
            function halfH() { return Math.min(window.innerHeight * 0.56, 520); }
            function tallH() { return Math.min(window.innerHeight * 0.9, 820); }
            np.style.transform = "";
            var st = null;
            grip.addEventListener("pointerdown", function (e) {
                if (e.pointerType === "mouse" && e.button !== 0) return;
                st = { y0: e.clientY, h0: np.offsetHeight, lastDy: 0, vy: 0, lastT: e.timeStamp, moved: false };
                np.style.transition = "none";
                try { grip.setPointerCapture(e.pointerId); } catch (err) {}
                e.preventDefault();
            });
            grip.addEventListener("pointermove", function (e) {
                if (!st) return;
                var dy = st.y0 - e.clientY;                        // 手指上拖为正 → 面板变高
                if (Math.abs(dy) > 6) st.moved = true;
                var dt = Math.max(1, e.timeStamp - st.lastT);
                st.vy = 0.7 * st.vy + 0.3 * ((dy - st.lastDy) / dt);
                st.lastDy = dy; st.lastT = e.timeStamp;
                var h = st.h0 + dy, min = 120, max = tallH();
                if (h < min) h = min + (h - min) * 0.25;           // 越界橡皮筋
                if (h > max) h = max + (h - max) * 0.25;
                np.style.maxHeight = h + "px";
                e.preventDefault();
            });
            function finish(e) {
                if (!st) return;
                var s = st; st = null;
                np.style.transition = "max-height .24s ease";
                if (!s.moved && e.type === "pointerup") {           // 轻点把手：半屏 ⇄ 全屏
                    var toTall = np.offsetHeight < (halfH() + tallH()) / 2;
                    np.classList.toggle("tall", toTall);
                    np.style.maxHeight = (toTall ? tallH() : halfH()) + "px";
                    return;
                }
                var proj = np.offsetHeight + s.vy * 130;            // 松手速度投影
                if (proj < halfH() * 0.5) {                          // 下滑不再一键关闭：吸到 mini 高度，指引始终一键可回
                    np.classList.remove("tall");
                    np.style.maxHeight = "140px";
                    return;
                }
                var useTall = proj > (halfH() + tallH()) / 2;
                np.classList.toggle("tall", useTall);
                np.style.maxHeight = (useTall ? tallH() : halfH()) + "px";
            }
            grip.addEventListener("pointerup", finish);
            grip.addEventListener("pointercancel", finish);
        }

        /* ---------------- 统一装配：各面板手势 + 方案左右滑 + 嵌套关闭 ---------------- */
        function initSheets() {
            /* 1) 校园楼栋抽屉：peek / half / full 三档吸附 */
            var sheet = document.getElementById("bottomSheet");
            if (sheet) {
                attachSheetDrag(sheet, document.getElementById("sheetHandle"), {
                    snaps: function (d) {
                        var vh = window.innerHeight;
                        var out = [{ name: "full", ty: 0 }];
                        if (d.H > vh * 0.45 + 12) out.push({ name: "half", ty: d.H - vh * 0.45 });
                        out.push({ name: "peek", ty: d.H - 80 });
                        return out;
                    },
                    onSnap: function (name) {
                        sheet.classList.toggle("expanded", name !== "peek");
                        sheet.classList.toggle("sheet-full", name === "full");
                    },
                    onTap: function () {
                        if (!sheet.classList.contains("expanded")) sheet.classList.add("expanded");
                        else if (!sheet.classList.contains("sheet-full")) sheet.classList.add("sheet-full");
                        else sheet.classList.remove("expanded", "sheet-full");
                    }
                });
            }
            /* 2) 楼内路线面板：full / peek / close；把手上拖拽，其余区域正常滚动 */
            var ri = document.getElementById("routeInfo");
            if (ri) {
                attachSheetDrag(ri, ri, {
                    hit: function (t) { return !!(t.closest && t.closest(".sheet-grip")); },
                    snaps: function (d) {
                        var out = [{ name: "full", ty: 0 }];
                        if (d.H > 170) out.push({ name: "peek", ty: d.H - 150 });
                        out.push({ name: "close", ty: d.H + 60 });
                        return out;
                    },
                    onSnap: function (name) {
                        if (name === "peek") ri.classList.add("peek");
                        else if (name === "full") ri.classList.remove("peek");
                        else hideRoutePanel(true);
                    }
                });
                /* 3) 路线方案左右滑切换（纵向滚动不受影响：仅横向大幅位移触发） */
                var swp = null;
                ri.addEventListener("touchstart", function (e) {
                    if (e.touches.length !== 1) { swp = null; return; }
                    swp = { x: e.touches[0].clientX, y: e.touches[0].clientY, done: false };
                }, { passive: true });
                ri.addEventListener("touchmove", function (e) {
                    if (!swp || swp.done) return;
                    var dx = e.touches[0].clientX - swp.x, dy = e.touches[0].clientY - swp.y;
                    if (Math.abs(dx) > 56 && Math.abs(dx) > 1.8 * Math.abs(dy)) {
                        swp.done = true;
                        if (lastAlts && !lastAlts.error && lastAlts.length > 1) {
                            currentScheme = (currentScheme + (dx < 0 ? 1 : -1) + lastAlts.length) % lastAlts.length;
                            redrawRoute();
                            renderRouteUI();
                            Toast.success("已切换到方案 " + (currentScheme + 1));
                        }
                    }
                }, { passive: true });
                ri.addEventListener("touchend", function () { swp = null; }, { passive: true });
            }
            /* 4) 路线面板收起后的"路线"浮标：点按重新展开 */
            var pill = document.getElementById("routePeek");
            if (pill) {
                pill.addEventListener("click", function () {
                    var box = document.getElementById("routeInfo");
                    box.style.display = "block";
                    box.classList.remove("peek");
                    pill.classList.remove("show");
                });
            }
            /* 5) 嵌套关闭：Esc 依次关最上层浮层 */
            document.addEventListener("keydown", function (e) {
                if (e.key !== "Escape") return;
                if (roomSheetEl && roomSheetEl.classList.contains("show")) { closeRoomSheet(); return; }
                if (ri && ri.style.display === "block") { hideRoutePanel(true); return; }
                var np = document.getElementById("amapNavPanel");
                if (np && np.classList.contains("show")) { hideAmapNavPanel(false); return; }
            });
        }

        /* ---------------- S3.3 键盘避让：软键盘弹出时把底部控件顶起来 ---------------- */
        function initKeyboardAvoid() {
            var vv = window.visualViewport;
            if (!vv) return;
            function apply() {
                var kb = Math.max(0, window.innerHeight - vv.height - vv.offsetTop);
                document.body.style.setProperty("--kb", kb.toFixed(1) + "px");
            }
            vv.addEventListener("resize", apply);
            vv.addEventListener("scroll", apply);
            apply();
        }

        /* ---------------- 两段式切换 ---------------- */
        function showIndoor() {
            Track.log("funnel", { stage: "indoor" });   // S5.3 漏斗：进入楼内视图

        /* =====================================================================

        function selfTest() {

                BUILDINGS.forEach(function (b) {

                    if (b.indoor && (!b.floors || b.floors < 1)) warns.push("楼内导航楼栋 floors 未配置：" + b.name);
                    if (CAT_ORDER.indexOf(b.cat) < 0) warns.push("楼栋分类不在 CAT_ORDER：" + b.name + " → " + b.cat);
                });
                BUILDINGS.forEach(function (b) {
                    if (!b.indoor) return;
                    if (!indoorAvailableFor(b.name)) {

                    }
                    var fco = (typeof floorCoordinates === "object") ? floorCoordinates : {};
                    for (var f = 1; f <= (b.floors || 0); f++) {

                        else if (!fco[String(f)]["电梯厅"]) {

                    }

                (typeof POI_DATA !== "undefined" ? POI_DATA : []).forEach(function (p) {

            }

/* =====================================================================
 * S6 研究生楼 A/B/C/D —— 平面图接入（运行时解析 SVG 生成路网 + 导航）
 * ---------------------------------------------------------------------
 * 设计要点：
 *  1) 平面图以 <script type="text/plain" id="plan-svg-<楼>-<层>"> 内嵌，
 *     运行时解析房间多边形 / 走廊 / 楼梯 / 电梯厅，无需离线坐标表。
 *  2) 走廊区域栅格化 → A* 寻路，房间以"门口短接"接入走廊，路线不穿墙。
 *  3) 图结构与 IndoorRouter 一致（节点 + 边 → segments/steps），
 *     直接复用现有路线渲染 / 语音 / 逐段指引。
 *  4) 疏散（火灾）模式只走楼梯，禁止电梯。
 * ===================================================================== */
var PlanBuildings = (function () {
    "use strict";

    var REG = {
        graA: { id: "graA", name: "研究生楼A栋", floors: 4 },
        graB: { id: "graB", name: "研究生楼B栋", floors: 4 },
        graC: { id: "graC", name: "研究生楼C栋", floors: 4 },
        graD: { id: "graD", name: "研究生楼D栋", floors: 3 }
    };
    var BY_NAME = {};
    for (var _k in REG) BY_NAME[REG[_k].name] = REG[_k];

    var DATA = {};          // id -> { floors:{fl:meta}, coords:{fl:{}}, graph, W, H }
    var activeId = null;
    var ORIG = null;        // 综合楼原始全局数据快照
    var curFloor = "1";

    /* 米/图面单位：按走廊净宽 ~2.6m 反推（A4F 走廊带宽 140 单位） */
    var MPU = 0.019;
    var FLOOR_H = 4.0;      // 层高（米）
    var WALK_SPEED = 1.2;   // 步行速度 m/s

    var ROOM_FILL = { "#ffffff": 1, "#fef9e7": 1, "#dde8f0": 1, "#f7e2a8": 1,
                      "#f2f2f2": 1, "#eeeeee": 1, "#f0f0f0": 1, "#f3f3f3": 1 };
    var CORR_FILL = { "#e0edf7": 1 };
    var NOISE_LABEL = /^(屋面|平台|上空|大厅上空|电井|天井|内天井|toilet|elevator|empty\s*space|上|下|空|门厅上空)$/i;

    /* ---------------- 基础几何 ---------------- */
    function normFill(el) {
        var f = el.getAttribute("fill");
        if (!f && el.style) f = el.style.fill;
        if (!f || f === "none") return "";
        f = String(f).trim().toLowerCase();
        if (f === "white") return "#ffffff";
        var m = /^rgb\(\s*(\d+)\s*,\s*(\d+)\s*,\s*(\d+)\s*\)$/.exec(f);
        if (m) {
            var hex = "#";
            for (var i = 1; i <= 3; i++) hex += ("0" + Number(m[i]).toString(16)).slice(-2);
            return hex;
        }
        if (f.charAt(0) !== "#") return "";
        if (f.length === 4) f = "#" + f[1] + f[1] + f[2] + f[2] + f[3] + f[3];
        return f;
    }

    /* 解析 CAD 导出的绝对路径（M/L/H/V/Z），其余指令忽略 */
    function pathPoly(d) {
        if (!d) return null;
        var toks = String(d).match(/[MLHVZmlhvz]|[-+]?[0-9]*\.?[0-9]+/g);
        if (!toks) return null;
        var pts = [], i = 0, cmd = null, x = 0, y = 0;
        while (i < toks.length) {
            var t = toks[i];
            if (/^[MLHVZmlhvz]$/.test(t)) {
                cmd = t.toUpperCase();
                i++;
                if (cmd === "Z") break;
                continue;
            }
            if (cmd === "M" || cmd === "L") {
                if (i + 1 >= toks.length) break;
                x = +toks[i]; y = +toks[i + 1]; i += 2;
                pts.push([x, y]);
                if (cmd === "M") cmd = "L";
            } else if (cmd === "H") {
                x = +toks[i]; i += 1; pts.push([x, y]);
            } else if (cmd === "V") {
                y = +toks[i]; i += 1; pts.push([x, y]);
            } else { i++; }
        }
        return pts.length >= 3 ? pts : null;
    }

    function polyOf(el) {
        var tag = el.tagName ? el.tagName.toLowerCase() : "";
        if (tag === "rect") {
            var x = +el.getAttribute("x") || 0, y = +el.getAttribute("y") || 0,
                w = +el.getAttribute("width") || 0, h = +el.getAttribute("height") || 0;
            if (!w || !h) return null;
            return [[x, y], [x + w, y], [x + w, y + h], [x, y + h]];
        }
        if (tag === "polygon" || tag === "polyline") {
            var arr = (el.getAttribute("points") || "").trim().split(/[\s,]+/);
            var p = [];
            for (var i = 0; i + 1 < arr.length; i += 2) p.push([+arr[i], +arr[i + 1]]);
            return p.length >= 3 ? p : null;
        }
        return pathPoly(el.getAttribute("d"));
    }

    function bbOf(p) {
        var x1 = 1e9, y1 = 1e9, x2 = -1e9, y2 = -1e9;
        for (var i = 0; i < p.length; i++) {
            if (p[i][0] < x1) x1 = p[i][0];
            if (p[i][0] > x2) x2 = p[i][0];
            if (p[i][1] < y1) y1 = p[i][1];
            if (p[i][1] > y2) y2 = p[i][1];
        }
        return { x: x1, y: y1, w: x2 - x1, h: y2 - y1, cx: (x1 + x2) / 2, cy: (y1 + y2) / 2, area: (x2 - x1) * (y2 - y1) };
    }

    /* 任意元素的包围盒：自身是形状时取自身，否则取子元素并集 */
    function bboxOfEl(el) {
        var tag = el.tagName ? el.tagName.toLowerCase() : "";
        if (tag === "rect" || tag === "polygon" || tag === "path" || tag === "polyline") {
            var p0 = polyOf(el);
            return p0 ? bbOf(p0) : null;
        }
        var kids = el.querySelectorAll ? el.querySelectorAll("rect,path,polygon,polyline,line") : [];
        var x1 = 1e9, y1 = 1e9, x2 = -1e9, y2 = -1e9, any = false;
        function acc(px, py) {
            any = true;
            if (px < x1) x1 = px; if (px > x2) x2 = px;
            if (py < y1) y1 = py; if (py > y2) y2 = py;
        }
        for (var i = 0; i < kids.length; i++) {
            var c = kids[i];
            if (c.tagName.toLowerCase() === "line") {
                acc(+c.getAttribute("x1") || 0, +c.getAttribute("y1") || 0);
                acc(+c.getAttribute("x2") || 0, +c.getAttribute("y2") || 0);
                continue;
            }
            var pp = polyOf(c);
            if (!pp) continue;
            for (var j = 0; j < pp.length; j++) acc(pp[j][0], pp[j][1]);
        }
        if (!any) return null;
        return { x: x1, y: y1, w: x2 - x1, h: y2 - y1, cx: (x1 + x2) / 2, cy: (y1 + y2) / 2, area: (x2 - x1) * (y2 - y1) };
    }

    function inPoly(x, y, p) {
        var inside = false;
        for (var i = 0, j = p.length - 1; i < p.length; j = i++) {
            var xi = p[i][0], yi = p[i][1], xj = p[j][0], yj = p[j][1];
            if ((yi > y) !== (yj > y) && (x < (xj - xi) * (y - yi) / (yj - yi) + xi)) inside = !inside;
        }
        return inside;
    }

    /* ---------------- SVG 资产 ---------------- */
    function svgEl(id, fl) { return document.getElementById("plan-svg-" + id + "-" + fl); }
    function svgText(id, fl) {
        var el = svgEl(id, fl);
        return el ? el.textContent : null;
    }

    /* ---------------- 单层解析 ---------------- */
    function parseFloor(id, fl) {
        var text = svgText(id, fl);
        if (!text) return null;
        var host = document.getElementById("planParseHost");
        if (!host) {
            host = document.createElement("div");
            host.id = "planParseHost";
            host.style.cssText = "position:fixed;left:-10000px;top:0;width:600px;height:600px;" +
                "visibility:hidden;pointer-events:none;overflow:hidden";
            document.body.appendChild(host);
        }
        host.innerHTML = text;
        var svg = host.querySelector("svg");
        if (!svg) { host.innerHTML = ""; return null; }
        var vb = (svg.getAttribute("viewBox") || "").replace(/,/g, " ").trim().split(/\s+/);
        var W = (vb.length === 4 && +vb[2]) ? +vb[2] : (+svg.getAttribute("width") || 1000);
        var H = (vb.length === 4 && +vb[3]) ? +vb[3] : (+svg.getAttribute("height") || 1000);

        /* 1) 标签 */
        var labels = [], tEls = svg.querySelectorAll("text");
        for (var ti = 0; ti < tEls.length; ti++) {
            var tEl = tEls[ti];
            var s = (tEl.textContent || "").replace(/\s+/g, "").trim();
            if (!s) continue;
            var ts = tEl.querySelector("tspan") || tEl;
            var lx = parseFloat(ts.getAttribute("x") || tEl.getAttribute("x") || "0");
            var ly = parseFloat(ts.getAttribute("y") || tEl.getAttribute("y") || "0");
            var fs = parseFloat(tEl.getAttribute("font-size") || "18");
            if (isNaN(lx) || isNaN(ly)) continue;
            labels.push({ name: s, x: lx, y: ly - fs * 0.35, fs: fs });
        }

        /* 2) 形状 */
        var shapes = [], els = svg.querySelectorAll("path,rect,polygon");
        for (var si = 0; si < els.length; si++) {
            var el = els[si];
            var fill = normFill(el);
            if (!fill) continue;
            if (fill === "#f5f5f5") continue;                       // 图纸底色
            if (el.getAttribute("stroke-dasharray")) continue;       // 虚线外框
            var poly = polyOf(el);
            if (!poly) continue;
            var bb = bbOf(poly);
            if (bb.w < 12 || bb.h < 12) continue;
            if (bb.w > W * 0.97 && bb.h > H * 0.97) continue;        // 满幅底图
            shapes.push({
                el: el, poly: poly, bb: bb, fill: fill,
                corridor: !!CORR_FILL[fill],
                room: !!ROOM_FILL[fill],
                label: "", node: false
            });
        }

        /* 3) 标签归属：取包含它的最小形状 */
        for (var li = 0; li < labels.length; li++) {
            var lb = labels[li], best = null;
            for (var qi = 0; qi < shapes.length; qi++) {
                var sh = shapes[qi];
                if (lb.x < sh.bb.x || lb.x > sh.bb.x + sh.bb.w || lb.y < sh.bb.y || lb.y > sh.bb.y + sh.bb.h) continue;
                if (!inPoly(lb.x, lb.y, sh.poly)) continue;
                if (!best || sh.bb.area < best.bb.area) best = sh;
            }
            if (best && !best.label) best.label = lb.name;
        }

        var coords = {}, blocks = [], corridors = [], stairs = [], elevs = [];
        var names = {};

        function uniqueName(base) {
            if (!names[base]) { names[base] = 1; return base; }
            names[base]++;
            return base + names[base];
        }

        /* 4) 分类：走廊 / 房间 / 楼梯 / 电梯 / 不可通行区域 */
        for (var k2 = 0; k2 < shapes.length; k2++) {
            var s2 = shapes[k2], nm = s2.label;
            if (s2.corridor) { corridors.push(s2.poly); continue; }
            if (!s2.room) continue;
            var isStair = /楼梯/.test(nm) || /^stair/i.test(s2.el.id || "");
            var isLift = /电梯/.test(nm) || /^elevator/i.test(s2.el.id || "");
            var isNoise = NOISE_LABEL.test(nm || "");
            if (isNoise && !isStair && !isLift) { blocks.push(s2.poly); continue; }   // 屋面/上空/电井
            if (isStair) {
                stairs.push({ x: s2.bb.cx, y: s2.bb.cy });
                continue;                                  // 楼梯本身可走，不进阻塞
            }
            if (isLift) {
                elevs.push({ x: s2.bb.cx, y: s2.bb.cy, name: nm || "电梯" });
                continue;
            }
            if (!nm) continue;
            var finalName = uniqueName(nm);
            coords[finalName] = { x: s2.bb.cx, y: s2.bb.cy };
            blocks.push(s2.poly);
            s2.node = true;
        }

        /* 5) 楼梯 / 电梯：补标签点（有的图纸只有文字没有独立填充） */
        for (var l2 = 0; l2 < labels.length; l2++) {
            var lb2 = labels[l2];
            if (/楼梯/.test(lb2.name) && !near(stairs, lb2.x, lb2.y, Math.max(48, W * 0.05))) {
                stairs.push({ x: lb2.x, y: lb2.y });
            }
            if (/电梯/.test(lb2.name) && !near(elevs, lb2.x, lb2.y, Math.max(60, W * 0.06))) {
                elevs.push({ x: lb2.x, y: lb2.y, name: lb2.name });
            }
            if (/^(出口|大门|正门)$/.test(lb2.name) && !coords[lb2.name]) {
                coords[lb2.name] = { x: lb2.x, y: lb2.y };
            }
        }

        /* 5b) 手绘示意图（D 栋）：楼梯/电梯以 id="stair_*" / id="elevator*" 命名，可能无填充也无文字 */
        var idEls = svg.querySelectorAll("[id]");
        for (var ii = 0; ii < idEls.length; ii++) {
            var ie = idEls[ii], iid = ie.id || "";
            var isSt = /^stair/i.test(iid), isEl = /^elevator/i.test(iid);
            if (!isSt && !isEl) continue;
            var ib = bboxOfEl(ie);
            if (!ib || ib.w < 8 || ib.h < 8) continue;
            if (isSt) {
                if (!near(stairs, ib.cx, ib.cy, 40)) stairs.push({ x: ib.cx, y: ib.cy });
            } else if (!near(elevs, ib.cx, ib.cy, 60)) {
                elevs.push({ x: ib.cx, y: ib.cy, name: "电梯" });
            }
        }

        /* 去重合并电梯（同一电梯厅两扇门合并为一个节点） */
        var lifts = [];
        for (var e1 = 0; e1 < elevs.length; e1++) {
            if (!near(lifts, elevs[e1].x, elevs[e1].y, Math.max(80, W * 0.1))) lifts.push(elevs[e1]);
        }
        lifts.forEach(function (p, i) { coords[i === 0 ? "电梯" : "电梯" + (i + 1)] = { x: p.x, y: p.y }; });
        stairs.forEach(function (p, i) { coords["楼梯" + (i + 1)] = { x: p.x, y: p.y }; });

        /* 6) 走廊缺省（D 栋为手绘示意，空白即通道）→ 用房间簇包围盒 */
        if (!corridors.length && shapes.length) {
            var x1 = 1e9, y1 = 1e9, x2 = -1e9, y2 = -1e9;
            shapes.forEach(function (s3) {
                if (!s3.node) return;
                x1 = Math.min(x1, s3.bb.x); y1 = Math.min(y1, s3.bb.y);
                x2 = Math.max(x2, s3.bb.x + s3.bb.w); y2 = Math.max(y2, s3.bb.y + s3.bb.h);
            });
            if (x2 > x1) corridors.push([[x1, y1], [x2, y1], [x2, y2], [x1, y2]]);
        }

        host.innerHTML = "";
        var meta = {
            id: id, floor: fl, W: W, H: H, coords: coords,
            blocks: blocks, corridors: corridors, stairs: stairs, lifts: lifts,
            grid: null
        };
        buildGrid(meta);
        return meta;
    }

    function near(list, x, y, d) {
        for (var i = 0; i < list.length; i++) {
            if (Math.hypot(list[i].x - x, list[i].y - y) < d) return true;
        }
        return false;
    }

    /* ---------------- 走廊栅格 ---------------- */
    function buildGrid(meta) {
        var W = meta.W, H = meta.H;
        var cell = Math.max(10, Math.min(W, H) / 58);
        var cols = Math.max(2, Math.floor(W / cell)), rows = Math.max(2, Math.floor(H / cell));
        var walk = new Uint8Array(cols * rows), block = new Uint8Array(cols * rows);
        var i, j, x, y, k;
        for (j = 0; j < rows; j++) {
            y = (j + 0.5) * cell;
            for (i = 0; i < cols; i++) {
                x = (i + 0.5) * cell;
                k = j * cols + i;
                var blocked = false;
                for (var bi = 0; bi < meta.blocks.length; bi++) {
                    if (inPoly(x, y, meta.blocks[bi])) { blocked = true; break; }
                }
                if (blocked) { block[k] = 1; continue; }
                var ok = false;
                for (var ci = 0; ci < meta.corridors.length; ci++) {
                    if (inPoly(x, y, meta.corridors[ci])) { ok = true; break; }
                }
                if (ok) walk[k] = 1;
            }
        }
        meta.grid = { cell: cell, cols: cols, rows: rows, walk: walk, block: block };
    }

    function cellAt(meta, x, y) {
        var g = meta.grid;
        var i = Math.floor(x / g.cell), j = Math.floor(y / g.cell);
        if (i < 0 || j < 0 || i >= g.cols || j >= g.rows) return -1;
        var k = j * g.cols + i;
        return g.walk[k] && !g.block[k] ? k : -1;
    }

    function walkAt(meta, x, y) { return cellAt(meta, x, y) >= 0; }

    function nearestCell(meta, x, y) {
        var g = meta.grid, best = -1, bd = 1e9;
        var i0 = Math.floor(x / g.cell), j0 = Math.floor(y / g.cell);
        for (var r = 1; r <= 26; r++) {
            for (var dj = -r; dj <= r; dj++) {
                for (var di = -r; di <= r; di++) {
                    if (Math.max(Math.abs(di), Math.abs(dj)) !== r) continue;
                    var i = i0 + di, j = j0 + dj;
                    if (i < 0 || j < 0 || i >= g.cols || j >= g.rows) continue;
                    var k = j * g.cols + i;
                    if (!g.walk[k] || g.block[k]) continue;
                    var d = Math.hypot((i + 0.5) * g.cell - x, (j + 0.5) * g.cell - y);
                    if (d < bd) { bd = d; best = k; }
                }
            }
            if (best >= 0 && bd < g.cell * (r + 1)) break;
        }
        return best >= 0 ? { k: best, d: bd } : null;
    }

    function cellPoint(meta, k) {
        var g = meta.grid;
        return { x: (k % g.cols + 0.5) * g.cell, y: (Math.floor(k / g.cols) + 0.5) * g.cell };
    }

    /* ---------------- 整楼数据 ---------------- */
    function build(id) {
        var reg = REG[id];
        var floors = {}, coords = {}, W = 0, H = 0;
        for (var f = 1; f <= reg.floors; f++) {
            var meta = parseFloor(id, String(f));
            if (!meta) continue;
            floors[String(f)] = meta;
            coords[String(f)] = meta.coords;
            W = Math.max(W, meta.W);
            H = Math.max(H, meta.H);
        }
        var d = { id: id, name: reg.name, floors: floors, coords: coords, W: W, H: H, graph: null };
        DATA[id] = d;
        return d;
    }

    function data(id) { return DATA[id] || build(id); }

    /* ---------------- 合并图（含跨层楼梯/电梯边） ---------------- */
    var NET = {};   // 兼容旧接口：buildBuildingGraph 若被调用

    function graph(id) {
        var d = data(id);
        if (d.graph) return d.graph;
        var G = { nodes: {}, adj: {} };
        var fls = Object.keys(d.floors).sort(function (a, b) { return +a - +b; });

        function addNode(nid, x, y, floor, name, type) {
            G.nodes[nid] = { x: x, y: y, floor: floor, name: name, type: type };
            G.adj[nid] = [];
        }
        function addEdge(a, b, kind) {
            if (!G.nodes[a] || !G.nodes[b]) return;
            var na = G.nodes[a], nb = G.nodes[b];
            var dist = Math.hypot(na.x - nb.x, na.y - nb.y) * MPU;
            G.adj[a].push({ to: b, meters: dist, sec: dist / WALK_SPEED, penalty: 0,
                            kind: "walk", accessible: true, floor: na.floor });
            G.adj[b].push({ to: a, meters: dist, sec: dist / WALK_SPEED, penalty: 0,
                            kind: "walk", accessible: true, floor: nb.floor });
        }

        fls.forEach(function (fl) {
            var meta = d.floors[fl], g = meta.grid;
            // 走廊栅格节点
            for (var k = 0; k < g.walk.length; k++) {
                if (!g.walk[k] || g.block[k]) continue;
                var p = cellPoint(meta, k);
                addNode("f" + fl + ":c" + k, p.x, p.y, fl, "", "cell");
            }
            for (var k2 = 0; k2 < g.walk.length; k2++) {
                if (!g.walk[k2] || g.block[k2]) continue;
                var cid = "f" + fl + ":c" + k2;
                var i = k2 % g.cols, j = Math.floor(k2 / g.cols);
                [[1, 0], [0, 1]].forEach(function (dv) {
                    var i2 = i + dv[0], j2 = j + dv[1];
                    if (i2 >= g.cols || j2 >= g.rows) return;
                    var k3 = j2 * g.cols + i2;
                    if (!g.walk[k3] || g.block[k3]) return;
                    addEdge(cid, "f" + fl + ":c" + k3);
                });
            }
            // 房间 / 楼梯 / 电梯节点（自动挂到最近走廊格）
            for (var nm in meta.coords) {
                var pt = meta.coords[nm];
                var nid = "f" + fl + ":r:" + nm;
                addNode(nid, pt.x, pt.y, fl, nm, "room");
                var nc = nearestCell(meta, pt.x, pt.y);
                if (!nc) continue;
                var cp = cellPoint(meta, nc.k);
                var dist = Math.hypot(cp.x - pt.x, cp.y - pt.y) * MPU;
                G.adj[nid].push({ to: "f" + fl + ":c" + nc.k, meters: dist,
                                  sec: dist / WALK_SPEED + 2, penalty: 0, kind: "walk",
                                  accessible: true, floor: fl });
                G.adj["f" + fl + ":c" + nc.k].push({ to: nid, meters: dist,
                                  sec: dist / WALK_SPEED + 2, penalty: 0, kind: "walk",
                                  accessible: true, floor: fl });
            }
        });

        // 跨层：楼梯全连（不同层图纸比例/裁切不同，按"楼梯组"整体互连）
        for (var fi = 0; fi < fls.length; fi++) {
            var flA = fls[fi], flB = fls[fi + 1];
            if (!flB) break;
            var df = Math.abs(Number(flB) - Number(flA));
            var stairIds = function (fl) {
                var out = [];
                for (var n in G.nodes) if (G.nodes[n].floor === fl && /^楼梯/.test(G.nodes[n].name)) out.push(n);
                return out;
            };
            var liftIds = function (fl) {
                var out = [];
                for (var n in G.nodes) if (G.nodes[n].floor === fl && /^电梯/.test(G.nodes[n].name)) out.push(n);
                return out;
            };
            stairIds(flA).forEach(function (a) {
                stairIds(flB).forEach(function (b) {
                    var m = FLOOR_H * 1.5 * df, sec = 42 * df;
                    G.adj[a].push({ to: b, meters: m, sec: sec, penalty: 10, kind: "stairs",
                                    accessible: false, floor: flA, toFloor: flB });
                    G.adj[b].push({ to: a, meters: m, sec: sec, penalty: 10, kind: "stairs",
                                    accessible: false, floor: flB, toFloor: flA });
                });
            });
            liftIds(flA).forEach(function (a) {
                liftIds(flB).forEach(function (b) {
                    var m = FLOOR_H * df, sec = 28 + 6 * df;
                    G.adj[a].push({ to: b, meters: m, sec: sec, penalty: 40, kind: "elevator",
                                    accessible: true, floor: flA, toFloor: flB });
                    G.adj[b].push({ to: a, meters: m, sec: sec, penalty: 40, kind: "elevator",
                                    accessible: true, floor: flB, toFloor: flA });
                });
            });
        }
        d.graph = G;
        return G;
    }

    /* ---------------- A* ---------------- */
    function edgeCost(e, opt) {
        if (opt.noElevator && e.kind === "elevator") return Infinity;
        if (opt.onlyStairs && e.kind === "elevator") return Infinity;
        if (opt.strategy === "time") return e.sec;
        if (opt.strategy === "accessible") return (e.accessible ? e.sec : Infinity);
        if (opt.strategy === "transfers") return e.meters + (e.penalty || 0);
        return e.meters + (e.kind === "walk" ? 0 : 1e-3) + (opt.elevatorPenalty && e.kind === "elevator" ? 400 : 0);
    }
    function heuristic(a, b) {
        return Math.hypot(a.x - b.x, a.y - b.y) * MPU + FLOOR_H * Math.abs(Number(a.floor) - Number(b.floor));
    }
    function astar(G, s, t, opt) {
        var g = {}, prev = {}, closed = {}, open = [s];
        g[s] = 0;
        function f(n) { return g[n] + heuristic(G.nodes[n], G.nodes[t]); }
        while (open.length) {
            var bi = 0;
            for (var i = 1; i < open.length; i++) if (f(open[i]) < f(open[bi])) bi = i;
            var cur = open.splice(bi, 1)[0];
            if (cur === t) break;
            if (closed[cur]) continue;
            closed[cur] = 1;
            (G.adj[cur] || []).forEach(function (e) {
                var c = edgeCost(e, opt);
                /* 备选方案：抬高主方案所用楼梯的代价，逼出一条走另一处楼梯的路线 */
                if (opt && opt.avoidStair && e.kind === "stairs") {
                    var tid = e.to.slice(e.to.lastIndexOf(":r:") + 3);
                    if (tid === opt.avoidStair) c *= 60;
                }
                /* 同层备选：给主方案经过的中间节点加价，逼出一条绕开它的路线 */
                if (opt && opt.avoidNodes && e.to !== t && opt.avoidNodes[e.to]) c *= 1.7;
                if (!isFinite(c)) return;
                var ng = g[cur] + c;
                if (g[e.to] === undefined || ng < g[e.to]) {
                    g[e.to] = ng; prev[e.to] = { from: cur, edge: e };
                    if (open.indexOf(e.to) < 0) open.push(e.to);
                }
            });
        }
        if (g[t] === undefined) return null;
        var path = [], at = t;
        while (at !== s) { path.unshift(prev[at]); at = prev[at].from; }
        return { ids: [s].concat(path.map(function (p) { return p.edge.to; })),
                 edges: path.map(function (p) { return p.edge; }), cost: g[t] };
    }

    /* ---------------- 路径 → 分段 + 简化 ---------------- */
    function los(meta, a, b) {
        var dx = b.x - a.x, dy = b.y - a.y, L = Math.hypot(dx, dy);
        var n = Math.max(2, Math.ceil(L / (meta.grid.cell * 0.5)));
        for (var i = 1; i < n; i++) {
            if (!walkAt(meta, a.x + dx * i / n, a.y + dy * i / n)) return false;
        }
        return true;
    }
    function simplify(pts, meta) {
        if (!meta || pts.length < 3) return pts;
        var out = [pts[0]], i = 0;
        while (i < pts.length - 1) {
            var j = pts.length - 1;
            while (j > i + 1 && !los(meta, pts[i], pts[j])) j--;
            out.push(pts[j]);
            i = j;
        }
        return out;
    }

    function toSegs(G, res, d) {
        var segs = [], walk = null;
        for (var i = 0; i < res.edges.length; i++) {
            var e = res.edges[i], na = G.nodes[res.ids[i]], nb = G.nodes[res.ids[i + 1]];
            if (!na || !nb) continue;
            if (e.kind === "walk") {
                if (!walk || walk.floor !== e.floor) {
                    walk = { kind: "walk", floor: e.floor, pts: [], names: [], meters: 0, sec: 0 };
                    segs.push(walk);
                    walk.pts.push({ x: na.x, y: na.y });
                    if (na.name) walk.names.push(na.name);
                }
                walk.meters += e.meters; walk.sec += e.sec;
                walk.pts.push({ x: nb.x, y: nb.y });
                if (nb.name && walk.names[walk.names.length - 1] !== nb.name) walk.names.push(nb.name);
            } else {
                walk = null;
                segs.push({ kind: e.kind, floor: e.floor, toFloor: e.toFloor,
                            node: na.name, nextName: nb.name, meters: e.meters,
                            sec: e.sec, accessible: e.accessible, at: na });
            }
        }
        segs.forEach(function (s) {
            if (s.kind === "walk" && d.floors[s.floor]) s.pts = simplify(s.pts, d.floors[s.floor]);
        });
        return segs;
    }

    function stepsOf(segs, goalName) {
        var out = [];
        segs.forEach(function (s, i) {
            if (s.kind === "walk") {
                var next = segs[i + 1];
                var to = next ? ("至『" + (next.node || next.nextName || "") + "』") : ("到达『" + goalName + "』");
                var from = s.names.length ? s.names[0] : "当前位置";
                out.push({ floor: s.floor, kind: "walk",
                    text: "从『" + from + "』出发，沿走廊前行约 " + Math.max(1, Math.round(s.meters)) + " 米" + to });
            } else if (s.kind === "stairs") {
                out.push({ floor: s.floor, kind: "stairs",
                    text: "走疏散楼梯" + (Number(s.toFloor) > Number(s.floor) ? "上" : "下") + "至 " + s.toFloor + " 层" +
                          "（约 " + Math.round(s.sec) + " 秒）" });
            } else if (s.kind === "elevator") {
                out.push({ floor: s.floor, kind: "elevator",
                    text: "乘电梯" + (Number(s.toFloor) > Number(s.floor) ? "上" : "下") + "至 " + s.toFloor + " 层" +
                          "（约 " + Math.round(s.sec) + " 秒）" });
            }
        });
        if (!out.length && segs.length) out.push({ floor: segs[0].floor, kind: "walk", text: "到达『" + goalName + "』" });
        return out;
    }

    /* ---------------- 对外：寻路 ---------------- */
    function routePts(d, start, goal, opt) {
        var G = graph(d.id);
        var sId = "f" + start.floor + ":r:" + start.node;
        var gId = "f" + goal.floor + ":r:" + goal.node;
        if (!G.nodes[sId]) return { error: "missing_start" };
        if (!G.nodes[gId]) return { error: "missing_goal" };
        if (sId === gId) return { error: "same" };
        var res = astar(G, sId, gId, opt || {});
        if (!res) return { error: "no_path" };
        var segs = toSegs(G, res, d);
        var meters = 0, sec = 0, transfers = 0;
        res.edges.forEach(function (e) {
            meters += e.meters; sec += e.sec;
            if (e.kind !== "walk") transfers++;
        });
        return { segments: segs, meters: meters, sec: sec, transfers: transfers,
                 steps: stepsOf(segs, goal.node), ids: res.ids, sig: res.ids.join("|"),
                 strategy: (opt && opt.strategy) || "distance" };
    }

    function route(start, goal, opt) {
        if (!activeId) return { error: "no_building" };
        return routePts(data(activeId), start, goal, opt || {});
    }

    function alternatives(start, goal, opt) {
        opt = opt || {};
        var d = data(activeId);
        var first = routePts(d, start, goal, opt);
        if (first.error) return first;
        var alts = [first];
        // 第二条：优先走楼梯（少坐电梯）的健康路线
        var second = routePts(d, start, goal, { strategy: opt.strategy, elevatorPenalty: 1 });
        if (!second.error && second.sig !== first.sig) alts.push(second);
        /* 第三条：与综合楼多方案对齐——主方案用的那部楼梯若被封堵，
         * 给出改走另一处楼梯的备选路线（抬高该楼梯的换层代价后重算） */
        if (alts.length < 2) {
            var usedStair = null;
            for (var si = 0; si < first.segments.length; si++) {
                var sg = first.segments[si];
                if (sg.kind === "stairs") { usedStair = sg.node; break; }
            }
            if (!usedStair) {
                // 同层路线：终点本身可能就是楼梯（疏散/去楼梯口）
                if (/^楼梯/.test(String(goal.node))) usedStair = goal.node;
            }
            if (usedStair) {
                var third = routePts(d, start, goal, { strategy: opt.strategy, elevatorPenalty: 1,
                                                       avoidStair: usedStair });
                if (!third.error && third.sig !== first.sig &&
                    alts.every(function (x) { return x.sig !== third.sig; })) alts.push(third);
            } else {
                // 同层：给主方案经过的走廊节点加价，尝试绕行方案
                var avoid = {};
                for (var ni = 1; ni < first.ids.length - 1; ni++) avoid[first.ids[ni]] = 1;
                var fourth = routePts(d, start, goal, { strategy: opt.strategy, avoidNodes: avoid });
                if (!fourth.error && fourth.sig !== first.sig) alts.push(fourth);
            }
        }
        return alts;
    }

    /* 1F 的"出入口节点"：优先真实门厅/出口，回退楼梯 */
    function hallNode() {
        if (!activeId) return "门厅";
        var d = data(activeId);
        var m = d.floors["1"];
        if (!m) return "门厅";
        var pref = ["门厅", "正门", "大厅", "出口", "连廊"];
        for (var pi = 0; pi < pref.length; pi++) if (m.coords[pref[pi]]) return pref[pi];
        var ex = exitsOnFirst(d);
        if (ex && ex.length) {
            // 有真实出口名优先；否则（示意图无出口标注）取最靠近图纸中心的楼梯作为进楼锚点
            for (var qi = 0; qi < ex.length; qi++) if (/出口|大门|正门|连廊/.test(ex[qi])) return ex[qi];
            var best = ex[0], bd = 1e9, cx = m.W / 2, cy = m.H / 2;
            for (var qj = 0; qj < ex.length; qj++) {
                var p = m.coords[ex[qj]];
                if (!p) continue;
                var dd = Math.hypot(p.x - cx, p.y - cy);
                if (dd < bd) { bd = dd; best = ex[qj]; }
            }
            return best;
        }
        for (var n in m.coords) if (/^楼梯/.test(n)) return n;
        return Object.keys(m.coords)[0] || "门厅";
    }

    /* ---------------- 疏散（火灾） ---------------- */
    function exitsOnFirst(d) {
        var m = d.floors["1"];
        if (!m) return null;
        var cands = [];
        for (var nm in m.coords) if (/出口|大门|正门|连廊/.test(nm)) cands.push(nm);
        if (!cands.length) for (var n2 in m.coords) if (/^楼梯/.test(n2)) cands.push(n2);
        return cands.length ? cands : null;
    }

    function evacuate(fromFloor, fromNode) {
        if (!activeId) return { error: "no_building" };
        var d = data(activeId);
        var fl = String(fromFloor || curFloor);
        var meta = d.floors[fl];
        if (!meta) return { error: "no_floor" };
        var start = fromNode || null;
        if (!start || !meta.coords[start]) {
            // 未选起点：取离楼层几何中心最近的楼梯
            var best = null, bd = 1e9, cx = meta.W / 2, cy = meta.H / 2;
            for (var nm in meta.coords) {
                if (!/^楼梯/.test(nm)) continue;
                var p = meta.coords[nm], dd = Math.hypot(p.x - cx, p.y - cy);
                if (dd < bd) { bd = dd; best = nm; }
            }
            start = best || (Object.keys(meta.coords)[0] || null);
        }
        if (!start) return { error: "no_start" };
        var exits = exitsOnFirst(d);
        var goalFloor = "1", goalNode = exits ? exits[0] : start;
        if (String(fl) === "1" && exits) {
            goalFloor = "1"; goalNode = exits[0];
            if (goalNode === start) {
                var altEx = null;
                for (var xi = 1; xi < exits.length; xi++) if (exits[xi] !== start) { altEx = exits[xi]; break; }
                if (altEx) goalNode = altEx;
                else return { segments: [], meters: 0, sec: 0, transfers: 0, exitName: goalNode,
                              steps: [{ floor: "1", kind: "walk",
                                       text: "您已在 1 层（" + start + "），请直接沿疏散指示前往室外安全出口" }] };
            }
        }

        var r = routePts(d, { floor: fl, node: start }, { floor: goalFloor, node: goalNode },
                         { strategy: "distance", onlyStairs: true, noElevator: true });
        if (r.error) {
            // 1F 找不到出口节点 → 退化为"到最近楼梯"
            if (!exits) return r;
            var stairGoal = null;
            for (var s in d.floors["1"].coords) if (/^楼梯/.test(s)) { stairGoal = s; break; }
            if (!stairGoal) return r;
            r = routePts(d, { floor: fl, node: start }, { floor: "1", node: stairGoal },
                         { strategy: "distance", noElevator: true });
        }
        if (!r.error) r.exitName = goalNode;
        return r;
    }

    /* ---------------- 全局数据切换 ---------------- */
    function active() { return !!activeId; }
    function currentId() { return activeId; }
    function floorMeta(fl) {
        if (!activeId) return null;
        return data(activeId).floors[String(fl)] || null;
    }
    /* ---- 视觉标准化：研究生楼底图向综合楼图纸标准看齐 ----
     * 综合楼标准：底图 #f0f4f8；墙体/线稿 #1a3a6b；房间 #e4ebf3 / #e8ecf1；
     * 走廊 #E0EDF7；房间号深蓝 + 白色描边。
     * 只改「渲染文本」，不改 SVG 资产本身，避免影响 PlanBuildings 的路径解析。 */
    function normalizePlanSvg(svg) {
        if (!svg) return svg;
        var s = svg;
        // 1) 背景：<svg> 后第一个铺满的矩形统一成综合楼底色
        s = s.replace(/(<svg\b[^>]*>\s*<rect\b[^>]*?)fill="(?:#F5F5F5|#FFFFFF|white)"/i, '$1fill="#f0f4f8"');
        // 2) 墙体/线稿：黑色系 → 综合楼深蓝
        s = s.replace(/(stroke=")(?:#333333|#333|black|#111111)(")/gi, '$1#1a3a6b$2');
        s = s.replace(/(<rect\b[^>]*?fill=")(?:black|#111111|#333333)(")/gi, '$1#1a3a6b$2');
        // 3) D 栋手绘示意图：暖棕墙体/线稿 → 综合楼深蓝（fill 与 stroke 都要覆盖，大小写不限）
        s = s.replace(/fill="(?:#5a3a10|#6b4423|#c97a2a|#c9a05a|#d4a86a)"/gi, 'fill="#1a3a6b"');
        s = s.replace(/(stroke=")(?:#5a3a10|#6b4423|#c97a2a|#c9a05a|#d4a86a)(")/gi, '$1#1a3a6b$2');
        // 3b) 家具/设备灰线 → 石板灰，保留「墙深、家具浅」的层级
        s = s.replace(/(stroke=")(?:#777|#777777|#666|#666666|#999|#999999)(")/gi, '$1#64748b$2');
        // 4) 房间填充统一为综合楼两档灰蓝（走廊 #E0EDF7 保持不变）
        s = s.replace(/fill="(?:white|#FFFFFF|#EEEEEE|#F2F2F2|#F3F3F3|#F5F5F5|#F0F0F0|#FEF9E7|#f7e2a8)"/gi,
                      'fill="#e4ebf3"');
        // 5) 房间号/设施文字：深蓝 + 白色描边（综合楼标签标准）
        s = s.replace(/(<text\b[^>]*?)fill="(?:black|#111111|#5a3a10|#6b4423|#c97a2a|#c9a05a|#d4a86a)"/gi,
                      '$1fill="#1a3a6b"');
        s = s.replace(/<text\b([^>]*)>/g, function (m, attrs) {
            if (/stroke=/.test(attrs)) return m;
            return '<text' + attrs + ' paint-order="stroke" stroke="#ffffff" stroke-width="2.5" stroke-linejoin="round">';
        });
        // 6) 兜底铺底：部分示意图（D 栋 1F）没有背景矩形，透明底会露出应用底色，
        //    这里统一垫一层综合楼图纸底色，保证各栋观感一致
        s = s.replace(/(<svg\b[^>]*>)/, '$1<rect width="100%" height="100%" fill="#f0f4f8"/>');
        return s;
    }

    function svgFor(fl) {
        if (!activeId) return null;
        return normalizePlanSvg(svgText(activeId, String(fl)));
    }
    function assetKey(fl) { return activeId ? ("plan:" + activeId + ":" + fl) : null; }

    function remember() {
        if (ORIG) return;
        ORIG = {
            coords: floorCoordinates, roomTypes: ROOM_TYPES,
            refW: REF_W, refH: REF_H
        };
    }

    function enter(id) {
        remember();
        var d = data(id);
        activeId = id;
        floorCoordinates = d.coords;
        ROOM_TYPES = {};
        curFloor = "1";
        var m = d.floors["1"] || d.floors[Object.keys(d.floors)[0]];
        if (m) { REF_W = m.W; REF_H = m.H; }
        if (typeof IndoorRouter !== "undefined" && IndoorRouter.clearCache) IndoorRouter.clearCache();
    }

    function leave() {
        if (!activeId) return;
        activeId = null;
        if (ORIG) {
            floorCoordinates = ORIG.coords;
            ROOM_TYPES = ORIG.roomTypes;
            REF_W = ORIG.refW;
            REF_H = ORIG.refH;
        }
    }

    /* 楼层切换前调用：按该层视图框调整参考尺寸（标记/路线百分比随之对齐） */
    function prepareFloor(num) {
        if (!activeId) return;
        var m = floorMeta(num);
        if (!m) return;
        curFloor = String(num);
        REF_W = m.W;
        REF_H = m.H;
    }

    /* 由 showIndoor() 统一调用：按当前楼栋切换数据域 */
    function sync(b) {
        var id = (b && BY_NAME[b.name]) ? BY_NAME[b.name].id : null;
        if (id) { if (id !== activeId) enter(id); }
        else leave();
    }

    function isPlanBuilding(b) { return !!(b && BY_NAME[b.name]); }
    function nameOf(id) { return REG[id] ? REG[id].name : ""; }
    function floorsOf(id) { return REG[id] ? REG[id].floors : 0; }
    function floorNow() { return curFloor; }

    /* 自检：每层房间数 / 走廊格数 */
    function selfTest() {
        var out = [];
        for (var id in REG) {
            var d = data(id);
            for (var fl in d.floors) {
                var m = d.floors[fl];
                var cells = 0;
                for (var i = 0; i < m.grid.walk.length; i++) if (m.grid.walk[i] && !m.grid.block[i]) cells++;
                out.push({ id: id, floor: fl, rooms: Object.keys(m.coords).length,
                           cells: cells, stairs: m.stairs.length, lifts: m.lifts.length });
            }
        }
        return out;
    }

    return {
        REG: REG, active: active, currentId: currentId, sync: sync, enter: enter, leave: leave,
        prepareFloor: prepareFloor, svgFor: svgFor, assetKey: assetKey, floorMeta: floorMeta,
        route: route, alternatives: alternatives, evacuate: evacuate,
        hallNode: function () { return hallNode(); },
        isPlanBuilding: isPlanBuilding, nameOf: nameOf, floorsOf: floorsOf,
        floorNow: floorNow, selfTest: selfTest,
        coordsOf: function (fl) { return activeId ? (data(activeId).coords[String(fl)] || {}) : {}; },
        coordsFor: function (id, fl) { return (REG[id] ? data(id).coords[String(fl)] : {}) || {}; }
    };
})();

/* =====================================================================
 * S6.2 火灾 / 应急疏散模式
 * ---------------------------------------------------------------------
 *  · 管理员（?admin=1）可一键开启全屏接管（演示 / 广播用）
 *  · 普通用户随时可从楼内视图顶部「应急疏散」进入
 *  · 疏散路线只用楼梯，禁止电梯；1F 直出最近出口
 * ===================================================================== */
var FireMode = (function () {
    "use strict";
    var on = false;
    var floorView = "1";
    var lastRoute = null;

    /* 同域广播：管理员开启后，其它已打开页面/标签页同步进入疏散态（5 分钟内有效，刷新不复活过期警报） */
    var LS_KEY = "hnuFireMode";
    var LS_TTL = 5 * 60 * 1000;
    var suppress = false, seenT = 0;

    function broadcast(onoff) {
        try {
            localStorage.setItem(LS_KEY, JSON.stringify({ on: !!onoff, floor: floorView, t: Date.now() }));
        } catch (e) {}
    }
    function applyRemote(v) {
        if (!v || (v.t && Date.now() - v.t > LS_TTL)) return;
        suppress = true;
        try {
            if (v.on && !on) open(v.floor || "1");
            else if (!v.on && on) close();
        } finally { suppress = false; }
    }

    function el(id) { return document.getElementById(id); }
    function curBuildingName() {
        /* 以实际加载的平面图数据为准，避免楼栋切换瞬间标题与图纸不一致 */
        if (planActive()) {
            var nm = PlanBuildings.nameOf(PlanBuildings.currentId());
            if (nm) return nm;
        }
        return (typeof currentIndoorBld !== "undefined" && currentIndoorBld && currentIndoorBld.name) || "综合楼";
    }
    function planActive() { return typeof PlanBuildings !== "undefined" && PlanBuildings.active(); }

    function ensureUI() {
        if (el("fireOverlay")) return;
        var wrap = document.createElement("div");
        wrap.id = "fireOverlay";
        wrap.innerHTML =
            '<div class="fire-sheet">' +
              '<div class="fire-head">' +
                '<div class="fire-badge">紧急</div>' +
                '<div class="fire-title-wrap"><div class="fire-title">火灾 · 应急疏散</div>' +
                '<div class="fire-sub" id="fireSub"></div></div>' +
                '<button type="button" class="fire-close" id="fireClose" aria-label="关闭">✕</button>' +
              '</div>' +
              '<div class="fire-alert">🔥 请立即撤离 · <b>严禁乘坐电梯</b> · 湿毛巾捂口鼻、低姿沿墙前行</div>' +
              '<div class="fire-plan" id="firePlan"></div>' +
              '<div class="fire-floors" id="fireFloors"></div>' +
              '<div class="fire-startbar"><label for="fireStartSel">我所在位置</label>' +
                '<select id="fireStartSel" aria-label="选择当前位置"></select></div>' +
              '<div class="fire-steps" id="fireSteps"></div>' +
              '<div class="fire-actions">' +
                '<a class="fire-119" href="tel:119">📞 拨打 119</a>' +
                '<button type="button" class="fire-btn" id="fireAltBtn">🔀 备用楼梯</button>' +
                '<button type="button" class="fire-btn" id="fireVoice">🔊 语音播报</button>' +
                '<button type="button" class="fire-btn" id="fireExit">关闭</button>' +
              '</div>' +
              '<div class="fire-foot">疏散路线由平面图自动计算，仅供参考；请服从现场消防指挥。' +
                '电梯在火灾时严禁使用，行动不便者请就近进入避难间等待救援。</div>' +
            '</div>';
        document.body.appendChild(wrap);
        el("fireClose").onclick = close;
        el("fireExit").onclick = close;
        el("fireVoice").onclick = speak;
        el("fireStartSel").onchange = function () {
            fireStart = this.value || null;
            showAlt = false;
            var ab = el("fireAltBtn"); if (ab) ab.classList.remove("on");
            render();
        };
        el("fireAltBtn").onclick = function () {
            var ev = lastRoute;
            if (!ev || ev.error) return;
            if (ev.exitFirst) { showAlt = false; render(); return; }
            if (!ev.altRoute) altEvacFor(ev);
            if (!ev.altRoute) { render(); return; }   // 单楼梯楼栋：无备用路线可画
            showAlt = !showAlt;
            this.classList.toggle("on", showAlt);
            render();
        };
        wrap.addEventListener("click", function (e) { if (e.target === wrap) close(); });
        document.addEventListener("keydown", function (e) {
            if (e.key === "Escape" && on) close();
        });
    }

    function speak() {
        try {
            if (!window.speechSynthesis) return;
            window.speechSynthesis.cancel();
            var ev = lastRoute;
            var txt = "火灾警报，请立即疏散，严禁乘坐电梯。";
            if (ev && !ev.error) {
                txt += "请从当前位置" + (ev.exitFirst
                    ? "沿走廊直接撤离到室外安全出口。"
                    : "沿走廊前往" + (ev.stair || "最近楼梯") + "，向下疏散至一层后从" + (ev.exitName || "门厅") + "撤离。");
            } else {
                txt += "请前往最近的疏散楼梯间，向下撤离至一层。";
            }
            var u = new SpeechSynthesisUtterance(txt);
            u.lang = "zh-CN"; u.rate = 1;
            window.speechSynthesis.speak(u);
        } catch (e) {}
    }

    function setBody(onoff) {
        document.body.classList.toggle("fire-mode", onoff);
    }

    function open(f) {
        ensureUI();
        on = true;
        floorView = String(f || (typeof currentFloor !== "undefined" ? currentFloor : "1") || "1");
        fireStart = null;
        showAlt = false;
        var ab = el("fireAltBtn"); if (ab) ab.classList.remove("on");
        setBody(true);
        render();
        speak();
        if (!suppress) broadcast(true);
    }
    function close() {
        on = false;
        setBody(false);
        try { if (window.speechSynthesis) window.speechSynthesis.cancel(); } catch (e) {}
        if (!suppress) broadcast(false);
    }
    function toggle(f) { on ? close() : open(f); }

    function roomsOf(fl) {
        if (planActive()) return PlanBuildings.coordsOf(fl);
        try { return (typeof floorCoordinates !== "undefined" ? floorCoordinates : {})[String(fl)] || {}; } catch (e) { return {}; }
    }

    function render() {
        if (!on) return;
        var bname = curBuildingName();
        var sub = el("fireSub");
        if (sub) sub.textContent = bname + " · 第 " + floorView + " 层 · 就近疏散";
        renderFloors();
        renderStartSel();
        renderPlan();
        renderSteps();
        var ab = el("fireAltBtn");
        if (ab) {
            var hasAlt = !!(lastRoute && !lastRoute.error && lastRoute.altRoute && !lastRoute.exitFirst);
            ab.style.display = (lastRoute && !lastRoute.error && !lastRoute.exitFirst) ? "" : "none";
            ab.classList.toggle("on", hasAlt && showAlt);
            ab.textContent = hasAlt ? (showAlt ? "🔀 隐藏备用路线" : "🔀 备用楼梯") : "🔀 备用楼梯";
        }
    }

    /* 「我所在位置」下拉：默认电梯厅/门厅，房间按名称排序；火场里也可选具体房间重新算路 */
    function renderStartSel() {
        var sel = el("fireStartSel");
        if (!sel) return;
        var coords = roomsOf(floorView);
        var keys = Object.keys(coords).filter(function (k) { return !/^楼梯/.test(k); });
        if (!keys.length) { sel.innerHTML = ""; sel.disabled = true; return; }
        sel.disabled = false;
        var pref = ["电梯厅", "门厅", "大厅", "正门", "出口"];
        keys.sort(function (a, b) {
            var ia = pref.indexOf(a), ib = pref.indexOf(b);
            if (ia < 0) ia = 99; if (ib < 0) ib = 99;
            if (ia !== ib) return ia - ib;
            return a.localeCompare(b, "zh");
        });
        if (!fireStart || !coords[fireStart]) fireStart = defaultStart(floorView, coords);
        var html = "";
        keys.forEach(function (k) {
            html += '<option value="' + k + '"' + (k === fireStart ? " selected" : "") + '>' + k + '</option>';
        });
        sel.innerHTML = html;
    }

    function renderFloors() {
        var box = el("fireFloors");
        if (!box) return;
        box.innerHTML = "";
        var n = 5;
        if (planActive()) n = PlanBuildings.floorsOf(PlanBuildings.currentId());
        else if (typeof currentIndoorBld !== "undefined" && currentIndoorBld && currentIndoorBld.floors) n = currentIndoorBld.floors;
        for (var i = 1; i <= n; i++) {
            (function (f) {
                var b = document.createElement("button");
                b.type = "button";
                b.className = "fire-floor" + (String(f) === String(floorView) ? " on" : "");
                b.textContent = f + "F";
                b.onclick = function () { floorView = String(f); render(); };
                box.appendChild(b);
            })(i);
        }
    }

    function planSvgText(fl) {
        if (planActive()) return PlanBuildings.svgFor(fl);
        var k = fl + "F";
        if (window.__FLOOR_SVG && window.__FLOOR_SVG[k]) return window.__FLOOR_SVG[k];
        if (window.__FLOOR_IMAGES && window.__FLOOR_IMAGES[k]) {
            /* 关键：综合楼底图是 base64 位图式 <image> 片段，必须包进 <svg> 才会渲染；
             * 直接把 <image> 塞进 div.innerHTML 会被当成未知 HTML 元素，表现为「疏散没有图」 */
            return '<svg xmlns="http://www.w3.org/2000/svg" width="' + REF_W + '" height="' + REF_H +
                   '" viewBox="0 0 ' + REF_W + ' ' + REF_H + '">' +
                   '<image href="' + window.__FLOOR_IMAGES[k] + '" x="0" y="0" width="' + REF_W +
                   '" height="' + REF_H + '"/></svg>';
        }
        return null;
    }

    /* ================= 疏散路径（两套楼栋统一） =================
     * 综合楼：走廊图由 IndoorRouter 提供；楼梯间未登记在 floorCoordinates，
     *   这里按底图标注坐标临时注入后寻路，算完移除。
     * 研究生楼：直接用 PlanBuildings 的运行时路网。
     * 统一输出 { start, stair, route, altStair, altRoute, steps, meters, sec } */
    var ZH_STAIRS = {
        "1": [{ n: "楼梯间A", x: 133, y: 70 }, { n: "楼梯间B", x: 130, y: 228 },
              { n: "楼梯间C", x: 320, y: 442 }, { n: "楼梯间D", x: 316, y: 679 }],
        "2": [{ n: "楼梯间A", x: 133, y: 70 }, { n: "楼梯间B", x: 130, y: 228 },
              { n: "楼梯间C", x: 320, y: 442 }, { n: "楼梯间D", x: 316, y: 679 }],
        "3": [{ n: "楼梯间A", x: 147, y: 70 }, { n: "楼梯间B", x: 144, y: 228 },
              { n: "楼梯间C", x: 334, y: 442 }, { n: "楼梯间D", x: 330, y: 679 }],
        "4": [{ n: "楼梯间A", x: 132, y: 71 }, { n: "楼梯间B", x: 129, y: 229 },
              { n: "楼梯间C", x: 319, y: 443 }, { n: "楼梯间D", x: 315, y: 680 }],
        "5": [{ n: "楼梯间A", x: 132, y: 71 }, { n: "楼梯间B", x: 129, y: 229 },
              { n: "楼梯间C", x: 319, y: 443 }, { n: "楼梯间D", x: 315, y: 680 }]
    };
    var ZH_EXIT = "门厅";
    var fireStart = null, showAlt = false, altCache = {};

    function defaultStart(fl, coords) {
        var pref = String(fl) === "1"
            ? ["门厅", "大厅", "正门", "出口", "电梯厅"]
            : ["电梯厅", "门厅", "大厅"];
        for (var i = 0; i < pref.length; i++) if (coords[pref[i]]) return pref[i];
        var keys = Object.keys(coords).filter(function (k) { return !/^楼梯/.test(k); });
        /* 「严禁乘电梯」：默认起点不应落在电梯节点上，优先按房间估位置 */
        var roomsOnly = keys.filter(function (k) { return !/^电梯/.test(k); });
        if (roomsOnly.length) keys = roomsOnly;
        if (!keys.length) return (Object.keys(coords)[0] || null);
        /* 没有门厅/电梯厅标注时，取离楼层几何中心最近的点作为默认起点，
         * 比「取第一个房间」更接近"人在楼内中部"的真实情况 */
        var W = (typeof REF_W !== "undefined") ? REF_W : 500;
        var H = (typeof REF_H !== "undefined") ? REF_H : 700;
        if (planActive()) {
            var m = PlanBuildings.floorMeta(fl);
            if (m) { W = m.W; H = m.H; }
        }
        var best = keys[0], bd = 1e9;
        keys.forEach(function (k) {
            var p = coords[k];
            if (!p) return;
            var dd = Math.hypot(p.x - W / 2, p.y - H / 2);
            if (dd < bd) { bd = dd; best = k; }
        });
        return best;
    }

    function zhRouteToStairs(fl, start) {
        var added = [];
        var fc = (typeof floorCoordinates !== "undefined") ? floorCoordinates : null;
        if (!fc) return [];
        try {
            for (var lf in ZH_STAIRS) {
                fc[lf] = fc[lf] || {};
                ZH_STAIRS[lf].forEach(function (s) {
                    if (!fc[lf][s.n]) { fc[lf][s.n] = { x: s.x, y: s.y }; added.push([lf, s.n]); }
                });
            }
            var sp = fc[fl] && fc[fl][start];
            var list = (ZH_STAIRS[fl] || []).slice();
            if (sp) {
                list.sort(function (a, b) {
                    var qa = fc[fl][a.n], qb = fc[fl][b.n];
                    return Math.hypot(qa.x - sp.x, qa.y - sp.y) - Math.hypot(qb.x - sp.x, qb.y - sp.y);
                });
            }
            var out = [];
            list.forEach(function (s) {
                var r = IndoorRouter.route("综合楼", { floor: fl, node: start }, { floor: fl, node: s.n }, { strategy: "distance" });
                if (r && !r.error) out.push({ stair: s.n, route: r });
            });
            return out;
        } finally {
            added.forEach(function (a) { try { delete fc[a[0]][a[1]]; } catch (e) {} });
        }
    }

    function evacSteps(flS, start, stair, exitName) {
        var out = [], n = Number(flS);
        if (n === 1) {
            var isStairExit = /^楼梯/.test(exitName);
            out.push({ kind: "walk", floor: "1",
                text: "您已在 1 层，请立即从『" + start + "』沿疏散指示前往" +
                      (isStairExit ? "『" + exitName + "』楼梯口，循疏散标志走出楼门" : "『" + exitName + "』室外出口") });
        } else {
            out.push({ kind: "walk", floor: flS,
                text: "从『" + start + "』出发，沿走廊前往最近的『" + stair + "』（全程不乘电梯）" });
            for (var f = n; f > 1; f--) {
                out.push({ kind: "stairs", floor: String(f),
                    text: "进入『" + stair + "』，沿疏散指示向下至 " + (f - 1) + " 层" });
            }
            out.push({ kind: "walk", floor: "1", text: "到达 1 层后，从『" + exitName + "』撤出建筑" });
        }
        out.push({ kind: "out", floor: "1",
            text: "到楼前开阔地带集合（距外墙 ≥50 米），清点人数，切勿返回取物" });
        return out;
    }

    function evacFor(fl, startNode) {
        var flS = String(fl);
        var coords = roomsOf(flS);
        var start = (startNode && coords[startNode]) ? startNode : defaultStart(flS, coords);
        if (!start) return { error: "no_start", floor: flS };
        var exitName = planActive() ? PlanBuildings.hallNode() : ZH_EXIT;
        var isFirst = flS === "1";
        var runs = [];
        if (isFirst && start === exitName) {
            /* 人已在 1 层门厅：无需画线，直接给"往外走"的指引 */
            return {
                floor: "1", start: start, exitName: exitName, exitFirst: true, stair: exitName,
                route: { segments: [], meters: 0, sec: 0 }, altStair: null, altRoute: null,
                meters: 0, sec: 0,
                steps: [
                    { kind: "walk", floor: "1", text: "您已在 1 层『" + start + "』，请沿疏散指示立即走出建筑" },
                    { kind: "out", floor: "1", text: "到楼前开阔地带集合（距外墙 ≥50 米），切勿返回" }
                ]
            };
        }
        if (isFirst) {
            var r1 = planActive()
                ? PlanBuildings.route({ floor: "1", node: start }, { floor: "1", node: exitName }, { strategy: "distance" })
                : IndoorRouter.route("综合楼", { floor: "1", node: start }, { floor: "1", node: exitName }, { strategy: "distance" });
            if (r1 && !r1.error) runs.push({ stair: exitName, route: r1 });
        } else if (planActive()) {
            var names = Object.keys(coords).filter(function (k) { return /^楼梯/.test(k); });
            var pa = coords[start];
            names.sort(function (a, b) {
                var qa = coords[a], qb = coords[b];
                return Math.hypot(qa.x - pa.x, qa.y - pa.y) - Math.hypot(qb.x - pa.x, qb.y - pa.y);
            });
            if (names.length) {
                var r2 = PlanBuildings.route({ floor: flS, node: start }, { floor: flS, node: names[0] }, { strategy: "distance" });
                if (r2 && !r2.error) runs.push({ stair: names[0], route: r2 });
            }
        } else {
            runs = zhRouteToStairs(flS, start);
        }
        if (!runs.length) return { error: "no_path", floor: flS, start: start, exitName: exitName };
        var main = runs[0];
        var key = flS + "|" + start + "|" + main.stair;
        var cachedAlt = altCache[key] || null;
        return {
            floor: flS, start: start, exitName: exitName, exitFirst: isFirst,
            stair: main.stair, route: main.route,
            altStair: runs[1] ? runs[1].stair : (cachedAlt ? cachedAlt.stair : null),
            altRoute: runs[1] ? runs[1].route : (cachedAlt ? cachedAlt.route : null),
            meters: main.route.meters + (isFirst ? 0 : (Number(flS) - 1) * 9),
            sec: main.route.sec + (isFirst ? 0 : (Number(flS) - 1) * 45),
            steps: evacSteps(flS, start, main.stair, exitName)
        };
    }

    /* 取某层步行段的折线点 */
    function segOf(route, fl) {
        if (!route || !route.segments) return null;
        for (var i = 0; i < route.segments.length; i++) {
            var s = route.segments[i];
            if (s.kind === "walk" && String(s.floor) === String(fl) && s.pts && s.pts.length > 1) return s;
        }
        return null;
    }

    /* 备用楼梯：研究生楼按需再算（PlanBuildings 建图较重，不预计算） */
    function altEvacFor(ev) {
        if (!ev || ev.error || ev.exitFirst) return null;
        if (ev.altRoute) return ev.altRoute;
        var coords = roomsOf(ev.floor);
        var names = Object.keys(coords).filter(function (k) { return /^楼梯/.test(k) && k !== ev.stair; });
        if (!names.length) return null;
        var pa = coords[ev.start];
        names.sort(function (a, b) {
            var qa = coords[a], qb = coords[b];
            return Math.hypot(qa.x - pa.x, qa.y - pa.y) - Math.hypot(qb.x - pa.x, qb.y - pa.y);
        });
        var r = PlanBuildings.route({ floor: ev.floor, node: ev.start }, { floor: ev.floor, node: names[0] }, { strategy: "distance" });
        if (r && !r.error) {
            ev.altRoute = r; ev.altStair = names[0];
            altCache[ev.floor + "|" + ev.start + "|" + ev.stair] = { stair: names[0], route: r };
            return r;
        }
        return null;
    }

    function renderPlan() {
        var box = el("firePlan");
        if (!box) return;
        box.innerHTML = "";
        var svg = planSvgText(floorView);
        if (!svg) {
            box.innerHTML = '<div class="fire-plan-missing">本层平面图暂不可用，请沿疏散指示标志前往最近楼梯间。</div>';
            return;
        }
        var vbm = /viewBox="([^"]+)"/.exec(svg);
        var vb = vbm ? vbm[1] : ("0 0 " + REF_W + " " + REF_H);
        var vbp = vb.replace(/,/g, " ").trim().split(/\s+/);
        var vbW = +vbp[2] || REF_W, vbH = +vbp[3] || REF_H;
        /* 按底图真实宽高比固定展示区高度：避免被 flex 压扁成一条缝，看不清疏散路线 */
        box.style.aspectRatio = vbW + " / " + vbH;
        box.style.flex = "0 0 auto";
        box.style.minHeight = "0";
        var inner = svg
            .replace(/<svg\b([^>]*)>/, function (m, attrs) {
                return "<svg" + attrs + ' class="fire-plan-svg" preserveAspectRatio="none">';
            })
            .replace(/<\?xml[^>]*\?>/g, "");
        box.innerHTML = inner;

        var ev = evacFor(floorView, fireStart);
        lastRoute = ev;
        var seg = ev.error ? null : segOf(ev.route, floorView);
        var altSeg = (showAlt && ev.altRoute) ? segOf(ev.altRoute, floorView) : null;
        var overlay = document.createElementNS("http://www.w3.org/2000/svg", "svg");
        overlay.setAttribute("class", "fire-route-svg");
        overlay.setAttribute("viewBox", vb);
        overlay.setAttribute("preserveAspectRatio", "none");
        /* 先把本层所有楼梯间标出来：主楼梯被封堵时，用户一眼能看到还有哪些备选 */
        var stairMap = {};
        var baseCoords = roomsOf(floorView);
        for (var bk in baseCoords) if (/^楼梯/.test(bk)) stairMap[bk] = baseCoords[bk];
        /* 综合楼的楼梯间未登记在 floorCoordinates（寻路时才临时注入），这里单独补上标注 */
        if (!planActive()) {
            (ZH_STAIRS[String(floorView)] || []).forEach(function (x) {
                stairMap[x.n] = { x: x.x, y: x.y };
            });
        }
        var stairR = Math.max(7, vbW / 120), stairFs = Math.max(12, vbW / 80);
        for (var sk in stairMap) {
            var sp = stairMap[sk];
            if (!sp) continue;
            var sc = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            sc.setAttribute("cx", sp.x); sc.setAttribute("cy", sp.y);
            sc.setAttribute("r", String(stairR));
            sc.setAttribute("fill", "none");
            sc.setAttribute("stroke", "#64748b");
            sc.setAttribute("stroke-width", "2");
            sc.setAttribute("stroke-dasharray", "4 3");
            overlay.appendChild(sc);
            var stx = document.createElementNS("http://www.w3.org/2000/svg", "text");
            stx.setAttribute("x", sp.x + stairR * 1.4);
            stx.setAttribute("y", sp.y - stairR * 1.2);
            stx.setAttribute("font-size", String(stairFs));
            stx.setAttribute("font-weight", "600");
            stx.setAttribute("fill", "#475569");
            stx.setAttribute("paint-order", "stroke");
            stx.setAttribute("stroke", "#fff");
            stx.setAttribute("stroke-width", "3");
            stx.textContent = sk;
            overlay.appendChild(stx);
        }
        if (seg && seg.pts && seg.pts.length > 1) {
            var d = "";
            for (var p = 0; p < seg.pts.length; p++) d += (p ? " L " : "M ") + (seg.pts[p].x).toFixed(1) + " " + (seg.pts[p].y).toFixed(1);
            var shadow = document.createElementNS("http://www.w3.org/2000/svg", "path");
            shadow.setAttribute("d", d);
            shadow.setAttribute("fill", "none");
            shadow.setAttribute("stroke", "#ffffff");
            shadow.setAttribute("stroke-width", String(Math.max(10, vbW / 90)));
            shadow.setAttribute("stroke-opacity", "0.85");
            shadow.setAttribute("stroke-linejoin", "round");
            shadow.setAttribute("stroke-linecap", "round");
            overlay.appendChild(shadow);
            var line = document.createElementNS("http://www.w3.org/2000/svg", "path");
            line.setAttribute("d", d);
            line.setAttribute("fill", "none");
            line.setAttribute("stroke", "#16a34a");
            line.setAttribute("stroke-width", String(Math.max(6, vbW / 150)));
            line.setAttribute("stroke-linejoin", "round");
            line.setAttribute("stroke-linecap", "round");
            overlay.appendChild(line);
            var dotR = Math.max(8, vbW / 100);
            // 起点标记
            var st = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            st.setAttribute("cx", seg.pts[0].x); st.setAttribute("cy", seg.pts[0].y);
            st.setAttribute("r", String(dotR)); st.setAttribute("fill", "#16a34a");
            st.setAttribute("stroke", "#fff"); st.setAttribute("stroke-width", "3");
            overlay.appendChild(st);
            // 本层终点标记（楼梯间 / 1F 安全出口），让"往哪走"一眼可见
            var lastPt = seg.pts[seg.pts.length - 1];
            var goal = document.createElementNS("http://www.w3.org/2000/svg", "circle");
            goal.setAttribute("cx", lastPt.x); goal.setAttribute("cy", lastPt.y);
            goal.setAttribute("r", String(dotR * 1.1)); goal.setAttribute("fill", "#dc2626");
            goal.setAttribute("stroke", "#fff"); goal.setAttribute("stroke-width", "3");
            overlay.appendChild(goal);
            var goalTxt = document.createElementNS("http://www.w3.org/2000/svg", "text");
            goalTxt.setAttribute("x", lastPt.x + dotR * 1.5);
            goalTxt.setAttribute("y", lastPt.y - dotR);
            goalTxt.setAttribute("font-size", String(Math.max(16, vbW / 55)));
            goalTxt.setAttribute("font-weight", "700");
            goalTxt.setAttribute("fill", "#b91c1c");
            goalTxt.setAttribute("paint-order", "stroke");
            goalTxt.setAttribute("stroke", "#fff");
            goalTxt.setAttribute("stroke-width", "4");
            goalTxt.textContent = (String(floorView) === "1")
                ? "安全出口"
                : ((ev && !ev.error && ev.stair) ? ev.stair : "疏散楼梯");
            overlay.appendChild(goalTxt);
        }
        /* 1 层且人已在出口节点：无需走廊路线，但必须给出「出口 + 向外」的视觉指向，
         * 否则只会看到一张没有路线的平面图，误以为疏散失效 */
        if (!seg && ev && !ev.error && ev.exitFirst) {
            var ec = roomsOf(floorView)[ev.exitName];
            if (ec) {
                var rr = Math.max(10, vbW / 80);
                var ring = document.createElementNS("http://www.w3.org/2000/svg", "circle");
                ring.setAttribute("cx", ec.x); ring.setAttribute("cy", ec.y);
                ring.setAttribute("r", String(rr * 1.25));
                ring.setAttribute("fill", "#16a34a"); ring.setAttribute("fill-opacity", "0.22");
                ring.setAttribute("stroke", "#16a34a"); ring.setAttribute("stroke-width", "3");
                overlay.appendChild(ring);
                var dcx = ec.x - vbW / 2, dcy = ec.y - vbH / 2;
                var dl = Math.hypot(dcx, dcy) || 1;
                var ux = dcx / dl, uy = dcy / dl;
                var x1 = ec.x + ux * rr * 1.6, y1 = ec.y + uy * rr * 1.6;
                var x2 = ec.x + ux * rr * 4.2, y2 = ec.y + uy * rr * 4.2;
                var arrow = document.createElementNS("http://www.w3.org/2000/svg", "path");
                var px = -uy, py = ux, hw = rr * 0.85;
                arrow.setAttribute("d", "M " + x1.toFixed(1) + " " + y1.toFixed(1) +
                    " L " + x2.toFixed(1) + " " + y2.toFixed(1) +
                    " M " + x2.toFixed(1) + " " + y2.toFixed(1) +
                    " L " + (x2 - ux * rr * 1.4 + px * hw).toFixed(1) + " " + (y2 - uy * rr * 1.4 + py * hw).toFixed(1) +
                    " M " + x2.toFixed(1) + " " + y2.toFixed(1) +
                    " L " + (x2 - ux * rr * 1.4 - px * hw).toFixed(1) + " " + (y2 - uy * rr * 1.4 - py * hw).toFixed(1));
                arrow.setAttribute("fill", "none");
                arrow.setAttribute("stroke", "#16a34a");
                arrow.setAttribute("stroke-width", String(Math.max(6, vbW / 120)));
                arrow.setAttribute("stroke-linecap", "round");
                arrow.setAttribute("stroke-linejoin", "round");
                overlay.appendChild(arrow);
                var et = document.createElementNS("http://www.w3.org/2000/svg", "text");
                et.setAttribute("x", ec.x + ux * rr * 5 + Math.max(6, vbW / 120));
                et.setAttribute("y", ec.y + uy * rr * 5 + Math.max(6, vbW / 90));
                et.setAttribute("font-size", String(Math.max(16, vbW / 55)));
                et.setAttribute("font-weight", "700");
                et.setAttribute("fill", "#15803d");
                et.setAttribute("paint-order", "stroke");

            altLine.setAttribute("fill", "none");
            altLine.setAttribute("stroke", "#f59e0b");
            altLine.setAttribute("stroke-width", String(Math.max(4, vbW / 240)));
            altLine.setAttribute("stroke-dasharray", String(Math.max(10, vbW / 80)) + " " + String(Math.max(6, vbW / 130)));
            altLine.setAttribute("stroke-linejoin", "round");
            altLine.setAttribute("stroke-linecap", "round");

            var altTxt = document.createElementNS("http://www.w3.org/2000/svg", "text");

            altTxt.setAttribute("font-size", String(Math.max(13, vbW / 70)));
            altTxt.setAttribute("font-weight", "700");
            altTxt.setAttribute("fill", "#b45309");
            altTxt.setAttribute("paint-order", "stroke");
            altTxt.setAttribute("stroke", "#fff");
            altTxt.setAttribute("stroke-width", "4");

    function renderSteps() {
        var box = el("fireSteps");
        if (!box) return;
        box.innerHTML = "";
        if (!lastRoute || lastRoute.error) {
            box.innerHTML = '<div class="fire-tip">未找到可用疏散路线：请立即前往最近的疏散楼梯间，' +
                '向下至 1 层从安全出口撤离，<b>切勿乘坐电梯</b>；若通道被烟火封堵，请退回房间关门、堵缝、窗口示警等待救援。</div>';

        var html = '<div class="fire-sum"><span>本层步行 ' + Math.max(1, Math.round(lastRoute.route.meters)) + ' 米</span>' +
                   '<span>全程约 ' + Math.max(5, Math.round(lastRoute.sec)) + ' 秒</span>' +
                   '<span>' + (lastRoute.exitFirst ? "直接出楼" : "下撤 " + (Number(lastRoute.floor) - 1) + " 层") + '</span></div>';
        (lastRoute.steps || []).forEach(function (s, i) {
            html += '<div class="fire-step"><i>' + (i + 1) + '</i><span>' + s.text + '</span></div>';
        });
        if (lastRoute.exitFirst) {
            html += '<div class="fire-tip">1 层请就近选择<b>安全出口</b>，不要穿过浓烟区域；' +
                    '撤出后到楼前开阔地带集合，配合清点人数。</div>';
        } else {
            html += '<div class="fire-tip">下楼梯时靠右扶墙、不要逆行；若主楼梯被烟火封堵，' +
                    '<b>点「备用楼梯」</b>改走另一处楼梯间。行动不便或轮椅使用者请勿乘电梯，' +
                    '就近进入避难间/靠窗房间关门堵缝、窗口示警并拨打 119 等待救援。</div>';
        }

    function boot() {

        var entry = el("fireEntryBtn");
        if (entry) {
            entry.addEventListener("click", function () {
                open(typeof currentFloor !== "undefined" ? currentFloor : "1");
            });
        }
        // 同域同步：storage 事件 + 800ms 轮询兜底（部分 WebView 不派发 storage 事件）
        window.addEventListener("storage", function (e) {

        btn.onclick = function () { toggle(typeof currentFloor !== "undefined" ? currentFloor : "1"); };
        document.body.appendChild(btn);
    }

    else boot();

    return { open: open, close: close, toggle: toggle, isOn: function () { return on; } };
